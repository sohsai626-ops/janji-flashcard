</script>
<script>
const $=s=>document.querySelector(s);
const D=W.map(w=>({no:w[0],w:w[1],pos:w[2],kj:w[3],m:w[4],g:w[5],mean:w[6],key:w[7],ex:w[8],src:w[9],yaku:w[10],ans:w[11]}));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(){try{return JSON.parse(localStorage.getItem('kobun365v3')||'{}')}catch(e){return{}}},set(v){try{localStorage.setItem('kobun365v3',JSON.stringify(v))}catch(e){}}};
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[・（）()]/g,'、'));u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)}catch(e){}};
const GROUPS=[];D.forEach(d=>{const k=d.m+'｜'+d.g;if(!GROUPS.includes(k))GROUPS.push(k)});

// 範囲
let h='';['神無月','霜月','師走'].forEach(m=>{
 h+=`<div class="gh">${m}<button type="button" data-m="${m}">全部はずす</button></div>`;
 GROUPS.filter(k=>k.startsWith(m)).forEach(k=>{const ds=D.filter(d=>d.m+'｜'+d.g===k);
  h+=`<label><input type="checkbox" value="${k}" data-m="${m}" checked> ${k.split('｜')[1]}（${ds[0].no}〜${ds[ds.length-1].no}・${ds.length}語）</label>`})});
$('#sel').innerHTML=h;
const picked=()=>{const ks=[...document.querySelectorAll('#sel input:checked')].map(x=>x.value);return D.filter(d=>ks.includes(d.m+'｜'+d.g))};
const order=a=>document.querySelector('input[name="ord"]:checked').value==='shuf'?shuffle(a):a;
const upd=()=>$('#cnt').textContent=`えらんだ語：${picked().length}語`;
document.querySelectorAll('#sel input').forEach(x=>x.onchange=upd);
document.querySelectorAll('#sel .gh button').forEach(b=>b.onclick=()=>{const xs=document.querySelectorAll(`#sel input[data-m="${b.dataset.m}"]`);const all=[...xs].every(x=>x.checked);xs.forEach(x=>x.checked=!all);b.textContent=all?'全部えらぶ':'全部はずす';upd()});
upd();

function tab(t){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('show',x.id===t));
 if(t==='miss')renderMiss();if(t==='rank')renderRank();if(t==='card'&&!C)startCard();if(t==='quiz'&&!Q)startQuiz();scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(!picked().length){alert('範囲をえらんでください');return}
 if(b.dataset.go==='card'){C=null;tab('card')}else{Q=null;tab('quiz')}});

const exHTML=d=>d.ex?`<div class="ex">${d.ex} <span class="src">（${d.src}）</span><div class="yaku">訳　${d.yaku.replace('【　】',`<em>【${d.ans.split('／')[0]}】</em>`).replace('【　】',`<em>【${d.ans.split('／')[1]||''}】</em>`)}</div></div>`:'';
const head=d=>`<div class="word">${d.w}<button class="say" onclick="say('${d.w}')">🔊</button></div><div class="meta">No.${d.no}　［${d.pos}］${d.kj?'《'+d.kj+'》':''}</div>`;

// カード
let C=null;
function startCard(){C={list:order(picked()),i:0};showCard()}
function showCard(){
 const d=C.list[C.i];
 $('#card').innerHTML=`<div class="card"><div class="qhead"><span>${d.m}・${d.g}</span><span>${C.i+1} / ${C.list.length}</span></div>${head(d)}
 <div class="back" id="bk"><div class="mean">${d.mean.replace(/([①-⑤])/g,'<br>$1').replace(/^<br>/,'')}</div>${exHTML(d)}</div>
 <button class="btn" id="flip">意味を見る</button>
 <div class="twob"><button class="btn ghost" id="pv">← 前へ</button><button class="btn sub" id="nx">次へ →</button></div></div>`;
 $('#flip').onclick=()=>{$('#bk').classList.toggle('show');$('#flip').textContent=$('#bk').classList.contains('show')?'意味をかくす':'意味を見る'};
 $('#pv').onclick=()=>{if(C.i>0){C.i--;showCard()}};
 $('#nx').onclick=()=>{if(C.i<C.list.length-1){C.i++;showCard()}else{alert('最後の語です。おつかれさま！');C.i=0;showCard()}};
}

// 4択（意味／例文）
let Q=null,miss=[];
function startQuiz(list){
 const base=list||order(picked());
 Q={list:base,i:0,ok:0,mode:Q&&Q.mode||'imi'};miss=[];
 $('#quiz').innerHTML=`<div class="card"><h2>どちらで出題する？</h2>
 <button class="btn" id="qm1">意味をえらぶ（見出し語 → 意味）</button>
 <button class="btn sub" id="qm2">例文の訳の【　】をうめる</button>
 <p class="note" style="margin-top:8px">例文モードは、本の「問」と同じ形です。（${base.length}語）</p></div>`;
 $('#qm1').onclick=()=>{Q.mode='imi';showQ()};
 $('#qm2').onclick=()=>{Q.mode='rei';Q.list=Q.list.filter(d=>d.ex);showQ()};
}
function distract(d,field){
 const same=D.filter(x=>x!==d&&x[field]&&x[field]!==d[field]&&x.pos.split('・')[0]===d.pos.split('・')[0]);
 const pool=shuffle(same.length>=3?same:D.filter(x=>x!==d&&x[field]&&x[field]!==d[field]));
 const out=[];for(const x of pool){if(!out.includes(x[field]))out.push(x[field]);if(out.length===3)break}return out;
}
function showQ(){
 const d=Q.list[Q.i];const f=Q.mode==='imi'?'key':'ans';
 const ch=shuffle([d[f],...distract(d,f)]);
 const body=Q.mode==='imi'?head(d)+`<p class="note" style="text-align:center;margin:8px 0">意味をえらぼう</p>`
  :`<div class="ex">${d.ex} <span class="src">（${d.src}）</span></div><div class="yaku" style="margin:10px 2px">訳　${d.yaku.replace(/【　】/g,'<em>【　？　】</em>')}</div><p class="note">太字の語：<b>${d.w}</b>（No.${d.no}）</p>`;
 $('#quiz').innerHTML=`<div class="card"><div class="qhead"><span>${d.m}・${d.g}</span><span>${Q.i+1} / ${Q.list.length}　⭕${Q.ok}</span></div>${body}
 ${ch.map(c=>`<button class="choice">${c}</button>`).join('')}<div id="fb"></div></div>`;
 let done=false;
 document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(done)return;done=true;
  const ok=b.textContent===d[f];
  document.querySelectorAll('.choice').forEach(x=>{if(x.textContent===d[f])x.classList.add('ok')});if(!ok)b.classList.add('ng');
  if(ok)Q.ok++;else{if(!miss.includes(d))miss.push(d);const r=store.get();r[d.no]=(r[d.no]||0)+1;store.set(r)}
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><span class="mk">${ok?'⭕ 正解！':'❌ ざんねん'}</span><div><b>${d.w}</b>：${d.mean}</div>${Q.mode==='imi'?exHTML(d):''}</div>
  <button class="btn" id="nq">${Q.i+1<Q.list.length?'次へ':'結果を見る'}</button><button class="btn ghost" id="qq">やめる</button>`;
  $('#nq').onclick=()=>{Q.i++;Q.i<Q.list.length?showQ():result()};$('#qq').onclick=result;
  if(ok)say(d.w);
 });
}
function result(){
 $('#quiz').innerHTML=`<div class="card"><h2>結果</h2><div class="score">${Q.ok} / ${Math.min(Q.i+1,Q.list.length)}</div>
 ${miss.length?`<button class="btn" id="rt">まちがえた語だけもう一度</button>`:'<p style="text-align:center">全問正解！</p>'}
 <button class="btn sub" id="again">最初から</button><button class="btn ghost" id="toSet">範囲えらびへ</button></div>`;
 if(miss.length)$('#rt').onclick=()=>{const m=Q.mode;const l=shuffle(miss);Q={list:l,i:0,ok:0,mode:m};miss=[];showQ()};
 $('#again').onclick=()=>{Q=null;startQuiz()};$('#toSet').onclick=()=>tab('set');
}
function renderMiss(){$('#misslist').innerHTML=miss.length?miss.map(d=>`<div class="li"><span class="w">${d.w}</span>　No.${d.no}<br>${d.mean}</div>`).join(''):'<p class="note">まだありません。</p>';$('#missretry').style.display=miss.length?'':'none'}
$('#missretry').onclick=()=>{const l=shuffle(miss);const m=Q?Q.mode:'imi';Q={list:l,i:0,ok:0,mode:m};miss=[];tab('quiz');showQ()};
function renderRank(){const r=store.get();const ids=Object.keys(r).sort((a,b)=>r[b]-r[a]);
 $('#ranklist').innerHTML=ids.length?ids.slice(0,40).map(id=>{const d=D.find(x=>x.no==id);return d?`<div class="li"><span class="n">${r[id]}回</span><span class="w">${d.w}</span>　No.${d.no}<br>${d.mean}</div>`:''}).join(''):'<p class="note">まだ記録がありません。</p>'}
$('#rankquiz').onclick=()=>{const r=store.get();const l=D.filter(d=>r[d.no]);if(!l.length){alert('まだ記録がありません');return}Q={mode:'imi'};startQuiz(shuffle(l));tab('quiz')};
$('#rankreset').onclick=()=>{if(confirm('苦手の記録をすべて消しますか？')){store.set({});renderRank()}};

// プリント
$('#pgo').onclick=()=>{
 const kind=document.querySelector('input[name="pk"]:checked').value;
 let L=order(picked());if(kind==='rei')L=L.filter(d=>d.ex);
 if(!L.length){alert('範囲をえらんでください');return}
 const title={imi:'意味テスト',rei:'例文の穴うめテスト',list:'覚える用一覧'}[kind];
 let h=`<div class="ph"><h1>古文単語365　神無月・霜月・師走　${title}</h1><div class="nm">名前（　　　　　　　）　${kind==='list'?'':'　　／'+L.length}</div></div>`;
 if(kind==='imi'){h+=`<table class="pt"><tr><th style="width:8%">No.</th><th style="width:30%">古語</th><th>意味</th></tr>${L.map(d=>`<tr><td>${d.no}</td><td>${d.w}</td><td style="height:10mm"></td></tr>`).join('')}</table>`;
  if($('#pans').checked)h+=`<div class="pans"><div class="ph"><h1>解答</h1></div><table class="pt">${L.map(d=>`<tr><td>${d.no}</td><td>${d.w}</td><td>${d.mean}</td></tr>`).join('')}</table></div>`}
 if(kind==='rei'){h+=L.map((d,i)=>`<div class="pq">(${i+1}) ${d.ex}（${d.src}）<br><span class="y">訳　${d.yaku}</span></div>`).join('');
  if($('#pans').checked)h+=`<div class="pans"><div class="ph"><h1>解答</h1></div>${L.map((d,i)=>`<div class="pq">(${i+1}) ${d.w}　→　${d.ans}</div>`).join('')}</div>`}
 if(kind==='list')h+=`<table class="pt"><tr><th style="width:7%">No.</th><th style="width:24%">古語</th><th>意味</th></tr>${L.map(d=>`<tr><td>${d.no}</td><td>${d.w}<br><span style="font-size:8pt;font-family:sans-serif">［${d.pos}］${d.kj?'《'+d.kj+'》':''}</span></td><td>${d.mean}</td></tr>`).join('')}</table>`;
 $('#printArea').innerHTML=h;setTimeout(()=>window.print(),200);
};
</script></body></html>
