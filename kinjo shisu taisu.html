<script>
// ===== 共通：分数・表示 =====
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
function Q(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d);return[n/g,d/g]}
const qa=(a,b)=>Q(a[0]*b[1]+b[0]*a[1],a[1]*b[1]),qs=(a,b)=>qa(a,[-b[0],b[1]]),qm=(a,b)=>Q(a[0]*b[0],a[1]*b[1]),qd=(a,b)=>Q(a[0]*b[1],a[1]*b[0]),qv=a=>a[0]/a[1],qeq=(a,b)=>a[0]==b[0]&&a[1]==b[1];
const qn=a=>[-a[0],a[1]];
function qpow(q,k){return k>=0?Q(q[0]**k,q[1]**k):Q(q[1]**(-k),q[0]**(-k))}
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)];
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
const MI='−',LE='≦',GE='≧';
const nm=n=>n<0?MI+(-n):''+n,np=n=>n<0?'('+MI+(-n)+')':''+n;
const fr=(a,b,c='')=>`<span class="fr ${c}"><span>${a}</span><span>${b}</span></span>`;
const qh=q=>q[1]==1?nm(q[0]):(q[0]<0?MI:'')+fr(Math.abs(q[0]),q[1]);
const qp=q=>q[0]<0?'('+qh(q)+')':qh(q);
const eh=q=>{if(!Array.isArray(q))q=[q,1];return q[1]==1?nm(q[0]):(q[0]<0?MI:'')+fr(Math.abs(q[0]),q[1],'sm')};
const pw=(b,e)=>`${b}<sup>${typeof e=='string'?e:eh(e)}</sup>`;
const rt=(n,x)=>`<span class="rt">${n==2?'':`<span class="ix">${n}</span>`}√<span class="rad">${x}</span></span>`;
const lg=(a,M)=>`log<sub>${a}</sub>${M}`;
const X='<i>x</i>',Y='<i>y</i>',T='<i>t</i>';
const bh=q=>q[1]==1?(q[0]<0?`(${nm(q[0])})`:''+q[0]):`(${qh(q)})`; // 底の表示
const lcm=(a,b)=>a/gcd(a,b)*b;
// p^E（Eは有理数）を「数・累乗根」で表示
function pv(p,E){const v=Math.pow(p,qv(E));if(E[1]==1)return{h:qh(qpow([p,1],E[0])),v};
 const k=Math.floor(qv(E)),f=qs(E,[k,1]),r=rt(f[1],f[0]==1?p:p**f[0]);
 return{h:k==0?r:k>0?(p**k)+r:fr(r,p**(-k)),v}}
// 選択肢づくり（数値が同じものは除く）
function mk(ans,cands,fb){const A=typeof ans=='string'?{h:ans}:ans;const out=[],seen=new Set([A.h]);
 const ok=c=>c&&!seen.has(c.h)&&!(A.v!=null&&c.v!=null&&(Math.abs(c.v-A.v)<1e-9||out.some(o=>o.v!=null&&Math.abs(o.v-c.v)<1e-9)));
 for(let c of cands){if(c==null)continue;c=typeof c=='string'?{h:c}:c;if(ok(c)){seen.add(c.h);out.push(c)}if(out.length==3)break}
 let g=0;while(out.length<3&&fb&&g++<80){let c=fb();c=typeof c=='string'?{h:c}:c;if(ok(c)){seen.add(c.h);out.push(c)}}
 return{a:A.h,opts:shuf([A.h,...out.map(c=>c.h)])}}
const close=(a,b)=>Math.abs(a-b)<1e-7*Math.max(1,Math.abs(a));
// 不等式の答えの表示
const ineq=(rel,v)=>`${X} ${rel} ${typeof v=='string'?v:qh(v)}`;
const flip={'<':'>','>':'<',[LE]:GE,[GE]:LE};
const relf={'<':(a,b)=>a<b,'>':(a,b)=>a>b,[LE]:(a,b)=>a<=b+1e-12,[GE]:(a,b)=>a>=b-1e-12};
// グラフ（解説用）
function plot(fs,o={}){const W=240,H=200,x0=o.x0??-3,x1=o.x1??3,y0=o.y0??-4,y1=o.y1??6;const sx=x=>(x-x0)/(x1-x0)*W,sy=y=>H-(y-y0)/(y1-y0)*H;
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:280px;display:block;margin:6px auto;background:#fff;border:1px solid #ddd;border-radius:6px">`;
 for(let x=Math.ceil(x0);x<=x1;x++)s+=`<line x1="${sx(x)}" y1="0" x2="${sx(x)}" y2="${H}" stroke="#eee"/>`;
 for(let y=Math.ceil(y0);y<=y1;y++)s+=`<line x1="0" y1="${sy(y)}" x2="${W}" y2="${sy(y)}" stroke="#eee"/>`;
 s+=`<line x1="0" y1="${sy(0)}" x2="${W}" y2="${sy(0)}" stroke="#333"/><line x1="${sx(0)}" y1="0" x2="${sx(0)}" y2="${H}" stroke="#333"/><text x="${W-10}" y="${sy(0)-4}" font-size="11">x</text><text x="${sx(0)+4}" y="11" font-size="11">y</text><text x="${sx(0)-10}" y="${sy(0)+12}" font-size="10">O</text>`;
 (o.lines||[]).forEach(l=>{s+=l.v!=null?`<line x1="${sx(l.v)}" y1="0" x2="${sx(l.v)}" y2="${H}" stroke="#999" stroke-dasharray="4 3"/>`:`<line x1="0" y1="${sy(l.h)}" x2="${W}" y2="${sy(l.h)}" stroke="#999" stroke-dasharray="4 3"/>`});
 fs.forEach(F=>{let d='',pen=false;for(let i=0;i<=300;i++){const x=x0+(x1-x0)*i/300,y=F.f(x);if(!isFinite(y)||y<y0-5||y>y1+5){pen=false;continue}d+=(pen?'L':'M')+sx(x).toFixed(1)+' '+sy(Math.max(y0-2,Math.min(y1+2,y))).toFixed(1);pen=true}
  s+=`<path d="${d}" fill="none" stroke="${F.c||'#1d4e89'}" stroke-width="${F.w||2.2}" ${F.dash?'stroke-dasharray="5 4"':''}/>`;if(F.lab)s+=`<text x="${sx(F.lx??x1-1)}" y="${(v=>isFinite(v)?Math.max(12,Math.min(H-4,sy(v)-5)):12)(F.f(F.lx??x1-1))}" font-size="11" fill="${F.c||'#1d4e89'}">${F.lab}</text>`});
 (o.pts||[]).forEach(p=>{s+=`<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="3.5" fill="#d64545"/>`;if(p[2])s+=`<text x="${sx(p[0])+5}" y="${sy(p[1])-5}" font-size="10">${p[2]}</text>`});
 return s+'</svg>'}


</script>
<script>
// ===== 第1節 指数関数：20型 =====
const G={};
// ①0・負の指数
G.e01=()=>{const a=pick([2,3,4,5,10,-2,-3,-5,6]);let n=pick([0,-1,-2,-3,-2,-1]);if(Math.abs(a)>=5&&n==-3)n=-2;
 const B=bh([a,1]),m=-n,val=n==0?[1,1]:Q(a<0&&m%2?-1:1,Math.abs(a)**m);
 const cand=[{h:nm(a*n),v:a*n},{h:qh(qn(val)),v:-qv(val)},{h:qh(Q(Math.abs(a)**m*(a<0&&m%2?-1:1))),v:(a<0&&m%2?-1:1)*Math.abs(a)**m},{h:'0',v:0},{h:nm(a),v:a}];
 return{q:`次の値を求めよ。<div class="big">${pw(B,n)}</div>`,...mk({h:qh(val),v:qv(val)},cand,()=>{const k=R(2,40);return{h:qh(Q(1,k)),v:1/k}}),
  exp:n==0?[`0でない数の<b>0乗は必ず1</b>：${pw(B,0)} = 1`]:[`${pw('<i>a</i>','−<i>n</i>')} = ${fr(1,pw('<i>a</i>','<i>n</i>'))}（マイナスの指数は<b>分母に</b>）`,`${pw(B,n)} = ${fr(1,pw(B,m))} = ${fr(1,nm((a<0&&m%2?-1:1)*Math.abs(a)**m))} = <b>${qh(val)}</b>`],
  hint:`${pw('<i>a</i>','−<i>n</i>')} = ${fr(1,pw('<i>a</i>','<i>n</i>'))}`,ck:close(Math.pow(a,n),qv(val))}};
// ②指数法則（文字式）
function mono(ea,eb){const p=[];const f=(c,e)=>e==0?'':e==1?c:pw(c,e);if(ea)p.push(f('<i>a</i>',ea));if(eb)p.push(f('<i>b</i>',eb));return p.join('')||'1'}
G.e02=()=>{const nz=()=>pick([-5,-4,-3,-2,-1,2,3,4,5,6,7,8]);const p=nz(),q=nz(),r=pick([2,3,-1,-2]),f=R(1,4),A=1.37,Bv=0.83;
 let qq,ea,eb=0,cand,num,ex;
 if(f==1){qq=`${pw('<i>a</i>',p)}${pw('<i>a</i>',q)}`;ea=p+q;cand=[[p*q,0],[p-q,0],[-(p+q),0]];num=A**p*A**q;ex=`${pw('<i>a</i>','<i>m</i>')}${pw('<i>a</i>','<i>n</i>')} = ${pw('<i>a</i>','<i>m</i>＋<i>n</i>')}（かけ算は<b>たす</b>）：${p}＋${np(q)} = ${p+q}`}
 else if(f==2){qq=`(${pw('<i>a</i>',p)})<sup>${nm(r)}</sup>`;ea=p*r;cand=[[p+r,0],[-p*r,0],[p-r,0]];num=(A**p)**r;ex=`(${pw('<i>a</i>','<i>m</i>')})<sup><i>n</i></sup> = ${pw('<i>a</i>','<i>mn</i>')}（累乗の累乗は<b>かける</b>）：${p}×${np(r)} = ${p*r}`}
 else if(f==3){qq=`${pw('<i>a</i>',p)}(${pw('<i>a</i>',q)}<i>b</i>)<sup>${nm(r)}</sup>`;ea=p+q*r;eb=r;cand=[[p+q+r,r],[p+q*r,1],[p*q*r,r],[p+q,r]];num=A**p*(A**q*Bv)**r;ex=`(${pw('<i>a</i>',q)}<i>b</i>)<sup>${nm(r)}</sup> = ${pw('<i>a</i>',q*r)}${pw('<i>b</i>',r)}　→　${pw('<i>a</i>',p)}×${pw('<i>a</i>',q*r)} = ${pw('<i>a</i>',p+q*r)}`}
 else{qq=`${pw('<i>a</i>',p)} ÷ ${pw('<i>a</i>',q)}`;ea=p-q;cand=[[p+q,0],[q-p,0],[p*q,0]];num=A**p/A**q;ex=`${pw('<i>a</i>','<i>m</i>')} ÷ ${pw('<i>a</i>','<i>n</i>')} = ${pw('<i>a</i>','<i>m</i>−<i>n</i>')}（わり算は<b>ひく</b>）：${p}−${np(q)} = ${p-q}`}
 const val=(x,y)=>A**x*Bv**y;
 return{q:`次の式を計算せよ。（<i>a</i>≠0，<i>b</i>≠0）<div class="big">${qq}</div>`,...mk({h:mono(ea,eb),v:val(ea,eb)},cand.map(c=>({h:mono(c[0],c[1]),v:val(c[0],c[1])})),()=>{const d=R(-3,3)||1;return{h:mono(ea+d,eb),v:val(ea+d,eb)}}),
  exp:[ex,`答え：<b>${mono(ea,eb)}</b>`],hint:'かけ算→たす，わり算→ひく，累乗の累乗→かける',ck:close(num,val(ea,eb))}};
// ③指数法則（数の計算）

const SUMMARY=`
<h3>① 指数の拡張</h3>
<table class="sum"><tr><td>${pw('<i>a</i>',0)} = 1</td><td>${pw('<i>a</i>','−<i>n</i>')} = ${fr(1,pw('<i>a</i>','<i>n</i>'))}</td></tr>

<table class="sum"><tr><td>${pw('<i>a</i>','<i>r</i>')}${pw('<i>a</i>','<i>s</i>')} = ${pw('<i>a</i>','<i>r</i>＋<i>s</i>')}</td><td>${pw('<i>a</i>','<i>r</i>')} ÷ ${pw('<i>a</i>','<i>s</i>')} = ${pw('<i>a</i>','<i>r</i>−<i>s</i>')}</td></tr>
<tr><td>(${pw('<i>a</i>','<i>r</i>')})<sup><i>s</i></sup> = ${pw('<i>a</i>','<i>rs</i>')}</td><td>(<i>ab</i>)<sup><i>r</i></sup> = ${pw('<i>a</i>','<i>r</i>')}${pw('<i>b</i>','<i>r</i>')}</td></tr></table>

<tr><td>(${rt('<i>n</i>','<i>a</i>')})<sup><i>m</i></sup> = ${rt('<i>n</i>',pw('<i>a</i>','<i>m</i>'))}</td><td>${rt('<i>m</i>',rt('<i>n</i>','<i>a</i>'))} = ${rt('<i>mn</i>','<i>a</i>')}</td></tr></table>
<p class="note">迷ったら <b>すべて「底の分数乗」</b> に直して，指数を計算する。</p>
<h3>④ 指数関数 ${Y} = ${pw('<i>a</i>',X)}</h3>
<p>・点 (0, 1) を通り，<i>x</i>軸が漸近線。値域は<b>正の数全体</b>（${pw('<i>a</i>',X)}＞0）<br>・<b><i>a</i>＞1 → 増加</b>（右上がり），<b>0＜<i>a</i>＜1 → 減少</b>（右下がり）</p>
<table class="sum"><tr><th>式</th><th>${Y} = ${pw('<i>a</i>',X)} との関係</th></tr><tr><td>${Y} = ${MI}${pw('<i>a</i>',X)}</td><td><i>x</i>軸に関して対称</td></tr><tr><td>${Y} = ${pw('<i>a</i>',MI+X)}</td><td><i>y</i>軸に関して対称</td></tr><tr><td>${Y} = ${MI}${pw('<i>a</i>',MI+X)}</td><td>原点に関して対称</td></tr><tr><td>${Y} = ${pw('<i>a</i>',X+'−<i>p</i>')}＋<i>q</i></td><td><i>x</i>軸方向に<i>p</i>，<i>y</i>軸方向に<i>q</i></td></tr></table>
<h3>⑤ 方程式・不等式</h3>
<p>1. <b>底をそろえる</b>（${pw('<i>a</i>','<i>p</i>')} = ${pw('<i>a</i>','<i>q</i>')} ⇔ <i>p</i> = <i>q</i>）<br>2. 不等式は<b>底と1の大小</b>：1より小さいときは向きが<b>逆</b><br>3. ${pw(4,X)}，${pw(9,X)} があれば ${pw(2,X)} = ${T}，${pw(3,X)} = ${T} とおく。<b>${T}＞0 に注意</b></p>
<h3>⑥ 大小比較のコツ</h3>
<p>・底をそろえて指数をくらべる　・指数をそろえて底をくらべる　・何乗かして整数にする（正の数どうしのとき）</p>
<h3>⑦ 対数の定義</h3>
<p><i>M</i> = ${pw('<i>a</i>','<i>p</i>')} ⇔ ${LG('<i>a</i>','<i>M</i>')} = <i>p</i>　（<i>a</i>＞0，<i>a</i>≠1，<b><i>M</i>＞0</b>）<br>${LG('<i>a</i>','<i>a</i>')} = 1，${LG('<i>a</i>',1)} = 0，${LG('<i>a</i>',pw('<i>a</i>','<i>p</i>'))} = <i>p</i>，${pw('<i>a</i>',LG('<i>a</i>','<i>M</i>'))} = <i>M</i></p>
<h3>⑧ 対数の性質（かけ算→たす，わり算→ひく，累乗→前に出す）</h3>
<table class="sum"><tr><td>${LG('<i>a</i>','<i>MN</i>')} = ${LG('<i>a</i>','<i>M</i>')} ＋ ${LG('<i>a</i>','<i>N</i>')}</td><td>${LG('<i>a</i>',fr('<i>M</i>','<i>N</i>'))} = ${LG('<i>a</i>','<i>M</i>')} − ${LG('<i>a</i>','<i>N</i>')}</td></tr>
<tr><td>${LG('<i>a</i>',pw('<i>M</i>','<i>k</i>'))} = <i>k</i>${LG('<i>a</i>','<i>M</i>')}</td><td>底の変換：${LG('<i>a</i>','<i>b</i>')} = ${fr(LG('<i>c</i>','<i>b</i>'),LG('<i>c</i>','<i>a</i>'))}</td></tr></table>
<p class="note">${LG('<i>a</i>','<i>b</i>')}·${LG('<i>b</i>','<i>a</i>')} = 1，${LG(pw('<i>a</i>','<i>n</i>'),'<i>M</i>')} = ${fr(1,'<i>n</i>')}${LG('<i>a</i>','<i>M</i>')}</p>
<h3>⑨ 対数関数 ${Y} = ${LG('<i>a</i>',X)}</h3>
<p>・点 (1, 0) を通り，<i>y</i>軸が漸近線。定義域は<b>正の数全体</b><br>・<b><i>a</i>＞1 → 増加</b>，<b>0＜<i>a</i>＜1 → 減少</b><br>・${Y} = ${pw('<i>a</i>',X)} と<b>直線 ${Y} = ${X} に関して対称</b>　・${LG(fr(1,'<i>a</i>','sm'),X)} = ${MI}${LG('<i>a</i>',X)}（<i>x</i>軸に関して対称）</p>
<h3>⑩ 方程式・不等式の手順</h3>
<p>1. <b>まず真数条件</b>（真数＞0）<br>2. 1つの log にまとめて，<b>底をそろえる</b><br>3. 不等式は<b>底と1の大小</b>：1より小さいときは向きが<b>逆</b><br>4. 最後に<b>真数条件との共通範囲</b>／解が条件をみたすか確認<br>5. ${LG('<i>a</i>',X)} が何度も出たら ${LG('<i>a</i>',X)} = ${T} とおく（${T} はすべての実数）</p>
