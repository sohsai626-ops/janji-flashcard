<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans CJK JP",sans-serif;background:#eef5f1;color:#1d2733;-webkit-text-size-adjust:100%}
header{background:#1d6b45;color:#fff;padding:10px 12px 0;position:sticky;top:0;z-index:10}
header h1{font-size:17px;font-weight:800}
header .sub{font-size:11px;opacity:.85;margin:2px 0 6px}
nav{display:flex;gap:3px}
nav button{flex:1;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:12.5px;font-weight:700;padding:9px 0;border-radius:10px 10px 0 0}
nav button.on{background:#eef5f1;color:#1d6b45}
.tab{display:none;padding:12px;max-width:720px;margin:0 auto}.tab.show{display:block}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(20,70,45,.12)}
h2{font-size:16px;color:#1d6b45;margin-bottom:8px}
h3{font-size:14px;color:#556;margin:10px 0 6px}
.note{font-size:13px;color:#66788a;line-height:1.6}
.step{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(20,70,45,.12);text-align:left;color:#1d2733}
.step .n{flex:none;width:36px;height:36px;border-radius:50%;background:#1d6b45;color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}
.step .t{font-size:15.5px;font-weight:800}.step .s{font-size:12px;color:#66788a;margin-top:2px}
.step .pr{margin-left:auto;font-size:12px;font-weight:800;color:#2e7d32;text-align:right;white-space:nowrap}
.big{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:14px;padding:14px;margin-bottom:8px;color:#fff;text-align:left;font-size:16.5px;font-weight:800}
.big small{display:block;font-size:12px;font-weight:600;opacity:.9;margin-top:2px}

.chip.on{background:#1d6b45;color:#fff}
.bar{height:7px;background:#dde9e2;border-radius:4px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;background:#1d6b45}

.qhead button{border:1px solid #aab;background:#fff;border-radius:10px;padding:3px 8px;font-size:12px}
.tag{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;background:#1d6b45;border-radius:6px;padding:1px 7px;margin:0 4px 6px 0}
.tag.w{background:#c62828}
.qtext{font-size:17.5px;line-height:1.6;margin:6px 0;font-weight:700}
.choice{display:block;width:100%;text-align:left;font-size:16.5px;border:2px solid #d3e0d8;background:#fff;border-radius:12px;padding:12px;margin:7px 0;color:#1d2733;line-height:1.45}
.choice.ok{border-color:#2e7d32;background:#e8f5e9}.choice.ng{border-color:#c62828;background:#ffebee}
.fb{border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px;line-height:1.7}
.fb.ok{background:#e8f5e9}.fb.ng{background:#ffebee}
.ex{background:#fff8e6;border-radius:10px;padding:10px;font-size:14.5px;line-height:1.7;margin-top:8px}
.ansbox{font-size:19px;font-weight:800;color:#1d6b45;background:#e6f2ea;border-radius:12px;padding:12px;margin:8px 0;line-height:1.6;word-break:break-all}
.fx{font-family:Menlo,Consolas,"Courier New",monospace;letter-spacing:.3px}
.score{font-size:42px;font-weight:900;color:#1d6b45;text-align:center}

.tile.used{opacity:.2}
.built{min-height:52px;background:#f3f8f5;border:2px dashed #b9d0c2;border-radius:10px;padding:10px;font-size:19px;line-height:1.5;word-break:break-all}

.kb button{flex:1 0 11%;border:1.5px solid #9bb;background:#f6f9f7;border-radius:8px;padding:9px 0;font-size:17px;font-weight:700}

.diff{background:#ffebee;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px;line-height:1.6}

.flow{flex:none;width:44%;display:flex;flex-direction:column;align-items:center}
.fl{width:100%;border:2px solid #1d6b45;background:#fff;font-size:12px;text-align:center;padding:5px 3px;line-height:1.3;position:relative;margin-bottom:9px}
.fl:after{content:'';position:absolute;left:50%;bottom:-11px;height:9px;border-left:2px solid #1d6b45}
.fl:last-child:after{display:none}
.fl.t{border-radius:18px}.fl.d{transform:skewX(-14deg)}.fl.d span{display:inline-block;transform:skewX(14deg)}

.fl.now{background:#ffe066}
.fl .jn{display:block;font-size:10.5px;color:#c2571a}

 @page{size:A4;margin:12mm}

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

りの「計」（7月〜10月の合計）を求める式は？", "a": "=SUM(B5:E5)", "alt": [], "d": ["B5:F5", "AVERAGE"], "ex": "7月〜10月は B〜E 列。", "warn": 0, "src": "No.18", "id": "q54", "tk": ["=", "SUM", "(", "B5:E5", ")"]}, {"k": "func", "t": "f", "sheet": "s18", "cell": "B10", "q": "7月の「合計」を求める式は？", "a": "=SUM(B5:B9)", "alt": [], "d": ["B5:E5", "B5:B10"], "ex": "たて（列）の合計。5品目なので B5〜B9。", "warn": 0, "src": "No.18", "id": "q55", "tk": ["=", "SUM", "(", "B5:B9", ")"]}, {"k": "func", "t": "f", "sheet": "s24", "cell": "B9", "q": "2024年の「合計」を求める式は？", "a": "=SUM(B5:B8)", "alt": [], "d": ["B5:D5", "B5:B9"], "ex": "4分類なので B5〜B8。", "warn": 0, "src": "No.23", "id": "q56", "tk": ["=", "SUM", "(", "B5:B8", ")"]}, {"k": "count", "t": "ch", "q": "COUNT 関数が数えるのは？", "a": "数値が入っているセルの数", "ch": ["数値が入っているセルの数", "空白でないセルの数（文字もふくむ）", "文字が入っているセルの数", "空白のセルの数"], "ex": "COUNT＝数値だけ数える。文字（「棄権」など）は数えない。", "src": "No.8", "warn": 1, "html": 0, "id": "q57"}, {"k": "count", "t": "ch", "q": "COUNTA 関数が数えるのは？", "a": "空白でないセルの数（文字もふくむ）", "ch": ["空白でないセルの数（文字もふくむ）", "数値が入っているセルの数だけ", "文字が入っているセルの数だけ", "空白のセルの数"], "ex": "COUNTA＝何か入っていれば数える（文字も数値も）。", "src": "No.8", "warn": 1, "html": 0, "id": "q58"}, {"k": "count", "t": "ch", "q": "「棄権」が入ったセルは、COUNT で数えられる？", "a": "数えられない（文字だから）", "ch": ["数えられない（文字だから）", "数えられる", "0として数える"], "ex": "「棄権」は文字データ。COUNT は数値だけ。だから「出場者数」を COUNT で数えると、棄権した人は入らない。", "src": "No.8", "warn": 1, "html": 0, "id": "q59"}, {"k": "count", "t": "f", "sheet": "s8", "cell": "B16", "q": "「生徒数」（名前の数）を求める式は？", "a": "=COUNTA(A5:A11)", "alt": [], "d": ["COUNT", "B5:B11"], "ex": "名前（文字）を数えるので COUNTA。範囲は名前の列 A5〜A11。生徒は範囲を書き忘れていた！", "warn": 1, "src": "No.8", "id": "q60", "tk": ["=", "COUNTA", "(", "A5:A11", ")"]}, {"k": "count", "t": "f", "sheet": "s8", "cell": "B17", "q": "1回目の「出場者数」を求める式は？", "a": "=COUNT(B5:B11)", "alt": [], "d": ["COUNTA", "A5:A11"], "ex": "記録（数値）が入っている人だけ数える＝COUNT。「棄権」（文字）は数えない。範囲を必ず書く！", "warn": 1, "src": "No.8", "id": "q61", "tk": ["=", "COUNT", "(", "B5:B11", ")"]}, {"k": "count", "t": "f", "sheet": "s8", "cell": "D17", "q": "3回目の「出場者数」を求める式は？", "a": "=COUNT(D5:D11)", "alt": [], "d": ["COUNTA", "B5:B11"], "ex": "3回目は D 列。棄権2人は数えない。", "warn": 1, "src": "No.8", "id": "q62", "tk": ["=", "COUNT", "(", "D5:D11", ")"]}, {"k": "count", "t": "n", "q": "3回目の出場者数（=COUNT(D5:D11)）はいくつ？", "a": "5", "ex": "7人のうち「棄権」が2人（戎谷・下平）。数値は5つ。", "src": "No.8", "sheet": null, "warn": 0, "unit": "人", "id": "q63"}, {"k": "count", "t": "n", "q": "4回目の出場者数（=COUNT(E5:E11)）はいくつ？", "a": "4", "ex": "4回目の「棄権」は3人（下平・安田・三浦）。7−3＝4。", "src": "No.8", "sheet": null, "warn": 0, "unit": "人", "id": "q64"}, {"k": "count", "t": "f", "sheet": "s12", "cell": "E12", "q": "「商品数」を求める式は？", "a": "=COUNTA(A5:A9)", "alt": [], "d": ["COUNT", "E5:E9"], "ex": "商品名（文字）を数える＝COUNTA。", "warn": 0, "src": "No.12", "id": "q65", "tk": ["=", "COUNTA", "(", "A5:A9", ")"]}, {"k": "count", "t": "f", "sheet": "s16", "cell": "C14", "q": "「商品数」を求める式は？", "a": "=COUNTA(A5:A9)", "alt": [], "d": ["COUNT", "C5:C9"], "ex": "「商品名の数」なので、商品名の列（A）を COUNTA で数える。生徒は =COUNT(C5:C9) と書いた。答えは同じ5でも、作成条件どおりではない。", "warn": 1, "src": "No.16", "id": "q66", "tk": ["=", "COUNTA", "(", "A5:A9", ")"]}, {"k": "count", "t": "ch", "q": "No.16 の「商品数」を =COUNT(C5:C9) と書いた。何がまずい？", "a": "「商品名の数」なので、A列を COUNTA で数えるべき", "ch": ["「商品名の数」なので、A列を COUNTA で数えるべき", "まずくない（答えが同じ5だから）", "COUNT ではなく SUM を使うべき", "範囲を C5:C10 にすべき"], "ex": "答えがたまたま同じでも、作成条件（商品名の数）とちがう式は×になることがある。", "src": "No.16", "warn": 1, "html": 0, "id": "q67"}, {"k": "abs", "t": "ch", "q": "「絶対番地」とは？", "a": "式をコピーしても変わらないセル番地", "ch": ["式をコピーしても変わらないセル番地", "式をコピーすると変わるセル番地", "いちばん大きい数が入ったセル", "合計が入ったセル"], "ex": "$E$10 のように $ をつけると、コピーしてもずれない。", "src": "No.12", "warn": 0, "html": 0, "id": "q68"}, {"k": "abs", "t": "ch", "q": "セル番地に $ をつけるときに押すキーは？", "a": "F4", "ch": ["F4", "F2", "Shift", "Ctrl"], "ex": "F4 を押すと、列と行の両方に $ がつく（例 $E$10）。", "src": "No.12", "warn": 0, "html": 0, "id": "q69"}, {"k": "abs", "t": "ch", "q": "E10 を選んで F4 キーを1回押すと？", "a": "$E$10", "ch": ["$E$10", "E$10", "$E10", "E10$"], "ex": "1回目は列にも行にも $ がつく。", "src": "No.12", "warn": 0, "html": 0, "id": "q70"}, {"k": "abs", "t": "ch", "q": "F5 に =E5/E10 と入れて、F6 にコピーすると、F6 の式は？", "a": "=E6/E11（合計のセルまでずれてしまう）", "ch": ["=E6/E11（合計のセルまでずれてしまう）", "=E6/E10", "=E5/E10", "=E6/$E$10"], "ex": "$ がないと分母（合計）もずれる。だから =E5/$E$10 と書く。", "src": "No.12", "warn": 1, "html": 0, "id": "q71"}, {"k": "abs", "t": "f", "sheet": "s12", "cell": "F5", "q": "ブレンドコーヒーの「売上比率」を求める式は？", "a": "=E5/$E$10", "alt": [], "d": ["E10", "$E$11", "*100"], "ex": "売上金額÷合計。合計（E10）はコピーしてもずれないように $E$10。", "warn": 1, "src": "No.12・13", "id": "q72", "tk": ["=", "E5", "/", "$E$10"]}, {"k": "abs", "t": "n", "q": "ブレンドコーヒーの売上比率（65,100÷262,650）は、%で小数第1位まで表示すると何%？", "a": "24.8", "ex": "65100÷262650＝0.2478…→ 24.8%", "src": "No.12", "sheet": null, "warn": 0, "unit": "%", "id": "q73"}, {"k": "abs", "t": "ch", "q": "売上比率を「%表示」にするとき、式に ×100 は必要？", "a": "必要ない（表示形式を%にする）", "ch": ["必要ない（表示形式を%にする）", "必要（=E5/$E$10*100 と書く）", "必要（=E5*100/E10 と書く）"], "ex": "式は =E5/$E$10 のまま。表示を「%」にすると 0.248→24.8% になる。", "src": "No.12", "warn": 0, "html": 0, "id": "q74"}, {"k": "abs", "t": "f", "sheet": "s16", "cell": "E5", "q": "焼きプリンの「売上比率」を求める式は？", "a": "=D5/$D$10", "alt": [], "d": ["D10", "$D$11"], "ex": "売上金額÷合計。合計 D10 に $。生徒は =D5/D10 と書いた（$ がない）。", "warn": 1, "src": "No.16", "id": "q75", "tk": ["=", "D5", "/", "$D$10"]}, {"k": "abs", "t": "f", "sheet": "s16", "cell": "D5", "q": "焼きプリンの「売上金額」（単価×数量）を求める式は？", "a": "=B5*C5", "alt": ["=C5*B5"], "d": ["×", "D10"], "ex": "単価（B）×数量（C）。", "warn": 0, "src": "No.16", "id": "q76", "tk": ["=", "B5", "*", "C5"]}, {"k": "abs", "t": "f", "sheet": "s18", "cell": "G5", "q": "上にぎりの「構成比」（計の合計に対する割合）を求める式は？", "a": "=F5/$F$10", "alt": [], "d": ["F10", "$G$10"], "ex": "計÷計の合計。F10 に $。", "warn": 1, "src": "No.18", "id": "q77", "tk": ["=", "F5", "/", "$F$10"]}, {"k": "abs", "t": "ch", "q": "構成比・売上比率の分母（わる数）には、何をつける？", "a": "$（絶対番地にする）", "ch": ["$（絶対番地にする）", "かっこ", "%", "\"（ダブルコーテーション）"], "ex": "分母はいつも同じ合計のセル。コピーしてもずれないよう $ をつける。", "src": "No.12・16・18", "warn": 0, "html": 0, "id": "q78"}, {"k": "if", "t": "ch", "q": "IF 関数の正しい形は？", "a": "=IF(条件,真の場合,偽の場合)", "ch": ["=IF(条件,真の場合,偽の場合)", "=IF(真の場合,偽の場合,条件)", "=IF(条件:真の場合:偽の場合)", "=IF(条件,偽の場合,真の場合)"], "ex": "条件 → 当てはまるとき（真）→ 当てはまらないとき（偽）の順。区切りはカンマ。", "src": "No.13", "warn": 1, "html": 0, "id": "q79"}, {"k": "if", "t": "ch", "q": "「以上」を表す比較演算子は？", "a": ">=", "ch": [">=", ">", "≧", "=>"], "ex": "以上＝>=（その数もふくむ）。≧ は Excel では使えない！", "src": "No.13", "warn": 1, "html": 0, "id": "q80"}, {"k": "if", "t": "ch", "q": "「以下」を表す比較演算子は？", "a": "<=", "ch": ["<=", "<", "≦", "=<"], "ex": "以下＝<=（その数もふくむ）。", "src": "No.13", "warn": 0, "html": 0, "id": "q81"}, {"k": "if", "t": "ch", "q": "「より大きい（超える）」を表す比較演算子は？", "a": ">", "ch": [">", ">=", "≧", "<"], "ex": "超える＝>（その数はふくまない）。", "src": "No.13", "warn": 1, "html": 0, "id": "q82"}, {"k": "if", "t": "ch", "q": "「より小さい（未満）」を表す比較演算子は？", "a": "<", "ch": ["<", "<=", ">", "≦"], "ex": "未満＝<（その数はふくまない）。", "src": "No.13", "warn": 0, "html": 0, "id": "q83"}, {"k": "if", "t": "ch", "q": "「等しくない」を表す比較演算子は？", "a": "<>", "ch": ["<>", "><", "≠", "!="], "ex": "<> ＝等しくない。", "src": "No.13", "warn": 0, "html": 0, "id": "q84"}, {"k": "if", "t": "ch", "q": "「等しい」を表す比較演算子は？", "a": "=", "ch": ["=", "==", "≒", "<>"], "ex": "= ＝等しい。", "src": "No.13", "warn": 0, "html": 0, "id": "q85"}, {"k": "if", "t": "ch", "q": "IF 関数で「人気」という文字を表示させるとき、どう書く？", "a": "\"人気\"", "ch": ["\"人気\"", "人気", "'人気'", "（人気）"], "ex": "文字はダブルコーテーション \" \" で囲む。数値（100など）はそのまま。", "src": "No.13", "warn": 1, "html": 0, "id": "q86"}, {"k": "if", "t": "ch", "q": "IF 関数で「何も表示しない」ときは、どう書く？", "a": "\"\"（\" を2つ、すき間なし）", "ch": ["\"\"（\" を2つ、すき間なし）", "\" \"（間にスペース）", "0", "（何も書かない）"], "ex": "\"\" の間にスペースを入れると「空白文字」になってしまう。すき間なし！", "src": "No.13", "warn": 1, "html": 0, "id": "q87"}, {"k": "if", "t": "f", "sheet": "s12", "cell": "G5", "q": "「評価」：売上金額が平均以上なら「人気」、そうでなければ「通常」を表示する式は？", "a": "=IF(E5>=$E$11,\"人気\",\"通常\")", "alt": [], "d": ["≧", "$E$10", ">", "\"人気\"\"通常\""], "ex": "平均は E11（E10 は合計）。「以上」は >=（≧ は使えない）。平均は全員同じセルなので $E$11。\"人気\" と \"通常\" の間にカンマ。", "warn": 1, "src": "No.13", "id": "q88", "tk": ["=", "IF", "(", "E5", ">=", "$E$11", ",", "\"人気\"", ",", "\"通常\"", ")"]}, {"k": "if", "t": "f", "sheet": "s12", "cell": "H5", "q": "「判定」：売上金額が 60,000 を超えていたら「○」、そうでなければ何も表示しない式は？", "a": "=IF(E5>60000,\"○\",\"\")", "alt": [], "d": [">=", "\" \"", "60,000"], "ex": "「超える」は >（>= は「以上」）。何も表示しない＝\"\"（すき間なし）。60,000 のコンマは書かない。", "warn": 1, "src": "No.13", "id": "q89", "tk": ["=", "IF", "(", "E5", ">", "60000", ",", "\"○\"", ",", "\"\"", ")"]}, {"k": "if", "t": "ch", "q": "No.12 のアイスティー（売上金額 40,950、平均 52,530）の「評価」は？", "a": "通常", "ch": ["通常", "人気", "何も表示しない"], "ex": "40,950 は平均 52,530 以上ではない → 偽 →「通常」。", "src": "No.13", "warn": 0, "html": 0, "id": "q90"}, {"k": "if", "t": "f", "sheet": "s14", "cell": "G5", "q": "「評価」：合計が 250 を超えたら「優秀」、そうでなければ何も表示しない式は？", "a": "=IF(E5>250,\"優秀\",\"\")", "alt": [], "d": [">=", "\" \""], "ex": "超える＝>。何も表示しない＝\"\"。", "warn": 0, "src": "No.14", "id": "q91", "tk": ["=", "IF", "(", "E5", ">", "250", ",", "\"優秀\"", ",", "\"\"", ")"]}, {"k": "if", "t": "f", "sheet": "s14", "cell": "H5", "q": "「判定」：平均が 70 以上なら「A」、そうでなければ「B」を表示する式は？", "a": "=IF(F5>=70,\"A\",\"B\")", "alt": [], "d": [">", "E5", "≧"], "ex": "以上＝>=。平均は F 列。", "warn": 0, "src": "No.14", "id": "q92", "tk": ["=", "IF", "(", "F5", ">=", "70", ",", "\"A\"", ",", "\"B\"", ")"]}, {"k": "if", "t": "ch", "q": "No.14 の保田（合計 250）の「評価」は？（250 を超えたら「優秀」）", "a": "何も表示しない", "ch": ["何も表示しない", "優秀"], "ex": "250 は「250を超えて」いない（> はその数をふくまない）。だから「優秀」にならない。", "src": "No.14", "warn": 1, "html": 0, "id": "q93"}, {"k": "if", "t": "f", "sheet": "s16", "cell": "F5", "q": "「評価」：売上金額が 20,000 を超えたら「良」、そうでなければ何も表示しない式は？", "a": "=IF(D5>20000,\"良\",\"\")", "alt": [], "d": [":", ">=", "\" \""], "ex": "生徒は =IF(D5:>20000,…) と書いた。「:」は範囲の記号なので、ここに入れてはいけない。", "warn": 1, "src": "No.16", "id": "q94", "tk": ["=", "IF", "(", "D5", ">", "20000", ",", "\"良\"", ",", "\"\"", ")"]}, {"k": "if", "t": "ch", "q": "No.16 のどら焼き（売上金額 20,000）の「評価」は？（20,000 を超えたら「良」）", "a": "何も表示しない", "ch": ["何も表示しない", "良"], "ex": "20,000 は 20,000 を「超えて」いない。", "src": "No.16", "warn": 1, "html": 0, "id": "q95"}, {"k": "if", "t": "f", "sheet": "s16", "cell": "G5", "q": "「判定」：数量が最小と同じなら「検討」、そうでなければ何も表示しない式は？", "a": "=IF(C5=$C$13,\"検討\",\"\")", "alt": [], "d": ["$C$12", "C13", "MIN"], "ex": "最小は C13。全員同じセルとくらべるので $C$13。等しい＝「=」。", "warn": 1, "src": "No.16", "id": "q96", "tk": ["=", "IF", "(", "C5", "=", "$C$13", ",", "\"検討\"", ",", "\"\"", ")"]}, {"k": "if", "t": "ch", "q": "No.16 で「判定」が「検討」になるのはどれ？（数量が最小と同じ）", "a": "カステラ（123）", "ch": ["カステラ（123）", "焼きプリン（154）", "シフォンケーキ（124）", "コーヒーゼリー（165）"], "ex": "数量の最小は 123（カステラ）。", "src": "No.16", "warn": 0, "html": 0, "id": "q97"}, {"k": "if", "t": "f", "sheet": "s18", "cell": "I5", "q": "「備考」：計が 5,000 以上なら ○、そうでなければ何も表示しない式は？", "a": "=IF(F5>=5000,\"○\",\"\")", "alt": [], "d": [">", "\" \"", "5,000"], "ex": "以上＝>=。", "warn": 1, "src": "No.18", "id": "q98", "tk": ["=", "IF", "(", "F5", ">=", "5000", ",", "\"○\"", ",", "\"\"", ")"]}, {"k": "if", "t": "ch", "q": "No.18 の上にぎり（計 5,000）の「備考」は？（5,000 以上なら ○）", "a": "○", "ch": ["○", "何も表示しない"], "ex": "「以上」はその数をふくむ。5,000 は 5,000 以上 → ○。", "src": "No.18", "warn": 1, "html": 0, "id": "q99"}, {"k": "rank", "t": "ch", "q": "順位をつける関数は？", "a": "RANK", "ch": ["RANK", "ROUND", "MAX", "COUNT"], "ex": "RANK（ランク）＝順位", "src": "No.18", "warn": 0, "html": 0, "id": "q100"}, {"k": "rank", "t": "ch", "q": "RANK 関数の正しい形は？", "a": "=RANK(数値,範囲,順序)", "ch": ["=RANK(数値,範囲,順序)", "=RANK(範囲,数値,順序)", "=RANK(順序,数値,範囲)", "=RANK(数値:範囲:順序)"], "ex": "何の順位か（数値）→ どの中で（範囲）→ どっち向き（順序）。", "src": "No.18", "warn": 1, "html": 0, "id": "q101"}, {"k": "rank", "t": "ch", "q": "RANK 関数の「順序」が 0 のときは？", "a": "降順（大きい順。いちばん大きいのが1位）", "ch": ["降順（大きい順。いちばん大きいのが1位）", "昇順（小さい順。いちばん小さいのが1位）", "ランダム"], "ex": "0＝降順（大きい順）、1＝昇順（小さい順）。売上や人数は大きい順＝0。", "src": "No.18", "warn": 0, "html": 0, "id": "q102"}, {"k": "rank", "t": "ch", "q": "RANK 関数の範囲に $ をつけるのはなぜ？", "a": "コピーしても、くらべる範囲がずれないように", "ch": ["コピーしても、くらべる範囲がずれないように", "見た function run(list,title,keep){if(!keep)S={ids:list.map(o=>o.id),i:0,ok:0,miss:[],title};saveProg();go('play');draw()}
function saveProg(){if(S)lsSet('prog',S)}
function resume(){S=lsGet('prog',null);if(!S)return;go('play');draw()}
function mark(id,ok){const r=REC[id]||{n:0,x:0,h:[]};r.n++;if(!ok){r.x++;if(!S.miss.includes(id))S.miss.push(id)}else S.ok++;r.last=ok?'o':'x';r.h=(r.h||[]).slice(-9);r.h.push([Date.now(),ok?1:0]);REC[id]=r;saveRec();saveProg()}
function head(o){return `<div class="bar"><i style="width:${S.i/S.ids.length*100}%"></i></div><div class="qhead"><span>${esc(S.title)}　${S.i+1}/${S.ids.length}</span><span><button onclick="showMissNow()">×一覧</button> <button onclick="quit()">やめる</button></span></div><span class="tag">${UN[o.k]}</span>${o.src?`<span class="tag" style="background:#6b7f74">${o.src}</span>`:''}${o.warn?'<span class="tag w">⚠ 重点</span>':''}`}
function nxBtn(){return `<button class="btn" onclick="nx()">${S.i+1<S.ids.length?'次へ':'結果を見る'}</button>`}
function exHTML(o){return o.ex?`<div class="ex">📘 ${esc(o.ex)}</div>`:''}
function draw(){
 if(S.i>=S.ids.length){finish();return}
 const o=Q[S.ids[S.i]];if(!o){S.i++;draw();return}
 const p=$('#play');let h=`<div class="card">${head(o)}`;let done=false;
 if(o.t==='ch'){
  h+=`<div class="qtext">${o.html?o.q:esc(o.q)}</div>`+shuffle(o.ch).map(c=>`<button class="choice" data-v="${esc(c)}">${esc(c)}</button>`).join('')+`<div id="fb"></div></div>`;p.innerHTML=h;
  p.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(done)return;done=true;const ok=b.dataset.v===o.a;
   p.querySelectorAll('.choice').forEach(x=>{if(x.dataset.v===o.a)x.classList.add('ok')});if(!ok)b.classList.add('ng');mark(o.id,ok);
   $('#fb').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><b>${ok?'⭕ 正解！':'❌ 正解は「'+esc(o.a)+'」'}</b></div>${exHTML(o)}${nxBtn()}`});
 }else if(o.t==='n'){
  h+=`<div class="qtext">${esc(o.q)}</div><div style="display:flex;align-items:center;gap:8px"><input class="nin" id="nin" inputmode="decimal" autocomplete="off"> <b>${esc(o.unit||'')}</b></div><button class="btn" id="nok">答える</button><div id="fb"></div></div>`;p.innerHTML=h;
  const go1=()=>{if(done)return;const v=normNum($('#nin').value);if(v==='')return;done=true;const ok=v===o.a;mark(o.id,ok);$('#nok').style.display='none';
   $('#fb').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><b>${ok?'⭕ 正解！':'❌ 正解は '+esc(o.a)+esc(o.unit||'')}</b></div>${exHTML(o)}${nxBtn()}`};
  $('#nok').onclick=go1;$('#nin').onkeydown=e=>{if(e.key==='Enter')go1()};
 }else if(o.t==='f'){drawF(o,h);return}
 else if(o.t==='tr'){drawTR(o,h);return}

function normNum(s){s=String(s).replace(/[０-９．－ー−]/g,c=>({'．':'.','－':'-','ー':'-','−':'-'})[c]||String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[,，\s%％]/g,'');if(s==='')return '';const n=Number(s);return isNaN(n)?s:String(n)}
// ---- シート ----
function sheetHTML(key,target){const s=D.SH[key];const rows=Object.keys(s.rows).map(Number).sort((a,b)=>a-b);const nc=s.cols.length;
 let h=`<div class="shtitle">📄 ${esc(s.title)}（${s.src}）</div><div class="shw"><table class="sht"><tr><th></th>${[...COLS.slice(0,nc)].map(c=>`<th>${c}</th>`).join('')}</tr><tr><th>4</th>${s.cols.map(c=>`<td class="h">${esc(c)}</td>`).join('')}</tr>`;
 let prev=4;
 rows.forEach(r=>{if(r>prev+1)h+=`<tr><th>⋮</th><td colspan="${nc}" class="x" style="text-align:left">（${prev+1}〜${r-1}行目 省略）</td></tr>`;prev=r;
  const row=s.rows[r];h+=`<tr><th>${r}</th>`;for(let i=0;i<nc;i++){const v=row[i]===undefined?'':row[i];const ref=COLS[i]+r;
   if(ref===target)h+=`<td class="tg">？</td>`;else if(v==='※')h+=`<td class="x">※</td>`;else if(typeof v==='number')h+=`<td>${v.toLocaleString()}</td>`;else h+=`<td class="${i===0?'s':''}">${esc(v)}</td>`}
  h+='</tr>'});
 return h+'</table></div>'}
function fitSheet(){const w=document.querySelector('.shw'),t=document.querySelector('.sht');if(!w||!t)return;t.style.zoom=1;const r=(w.clientWidth-12)/t.scrollWidth;if(r<1)t.style.zoom=Math.max(r,.7).toFixed(3)}
// ---- 式 ----
function normF(s){let out='',q=false;s=String(s).replace(/[“”＂]/g,'"').replace(/[！-～]/g,c=>c==='＂'?'"':String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/〇/g,'○').replace(/[×✕]/g,'×');
 for(const c of s){if(c==='"'){q=!q;out+=c}else if(!q&&/[\s　]/.test(c)){}else out+=q?c:c.toUpperCase()}return out}
function fOK(o,v){const n=normF(v);return n===o.a||o.alt.includes(n)}
function diffMsg(o,v){const n=normF(v),m=[];
 if(!n.startsWith('='))m.push('「=」から書き始めよう。');
 if(/[≧≦≠]/.test(n))m.push('≧ ≦ ≠ は使えない。>= <= <> を使う。');
 if(/[×÷]/.test(n))m.push('× ÷ は使えない。* / を使う。');
 if(/" "/.test(n))m.push('「何も表示しない」は "" （すき間なし）。');
 if(o.a.includes('$')&&!n.includes('$'))m.push('$（絶対番地）がぬけていない？');
 const pa=(o.a.match(/\(/g)||[]).length,pn=(n.match(/\(/g)||[]).length;if(pa!==pn)m.push('かっこ（ ）の数をたしかめよう。');
 const ca=(o.a.match(/,/g)||[]).length,cn=(n.match(/,/g)||[]).length;if(ca!==cn)m.push('カンマ（,）の数をたしかめよう。');
 const fa=(o.a.match(/[A-Z]+(?=\()/g)||[]).join(),fn=(n.match(/[A-Z]+(?=\()/g)||[]).join();if(fa!==fn)m.push('関数名がちがう。');
 return m.length?`<div class="diff">🔎 ${m.join('<br>🔎 ')}</div>`:''}
function fAfter(o,ok,v){const r=$('#fr');r.innerHTML=`<div class="fb ${ok?'ok':'ng'}"><b>${ok?'⭕ 正解！':'❌ ざんねん'}</b>${v!=null&&!ok?`<div class="fx" style="margin-top:4px">あなた：${esc(v)}</div>`:''}</div>${!ok&&v!=null?diffMsg(o,v):''}<div class="ansbox fx">${esc(o.a)}</div>${o.alt.length?`<div class="note">これも正解：${o.alt.map(esc).join('　')}</div>`:''}${exHTML(o)}${nxBtn()}`}
function drawF(o,h){
 const p=$('#play');let done=false;
 setTimeout(fitSheet,0);
 h+=sheetHTML(o.sheet,o.cell)+`<div class="qtext"><span style="background:#ffe066;padding:0 6px;border-radius:4px">${o.cell}</span> ${esc(o.q)}</div>`;
 if(FMODE==='tile'){
  const tiles=shuffle([...o.tk.map((t,i)=>({t,i})),...o.d.map((t,i)=>({t,i:100+i}))]);
  h+=`<div class="built fx" id="built">&nbsp;</div><div class="tiles fx" id="tiles">${tiles.map((x,k)=>`<button class="tile" data-k="${k}">${esc(x.t)}</button>`).join('')}</div>
  <div class="two"><button class="btn sub" id="b1">← 1つ消す</button><button class="btn sub" id="b0">全部消す</button></div><button class="btn" id="chk">答え合わせ</button><div id="fr"></div></div>`;p.innerHTML=h;
  let built=[];const upd=()=>{$('#built').textContent=built.map(k=>tiles[k].t).join('')||' ';p.querySelectorAll('.tile').forEach(b=>b.classList.toggle('used',built.includes(+b.dataset.k)))};
  p.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(done)return;const k=+b.dataset.k;if(built.includes(k))return;built.push(k);upd()});
  $('#b1').onclick=()=>{if(!done){built.pop();upd()}};$('#b0').onclick=()=>{if(!done){built=[];upd()}};
  $('#chk').onclick=()=>{if(done||!built.length)return;done=true;const v=built.map(k=>tiles[k].t).join('');const ok=fOK(o,v);mark(o.id,ok);$('#chk').style.display='none';fAfter(o,ok,v)};
 }else if(FMODE==='key'){
  h+=`<input class="fin" id="fin" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="=SUM(B5:F5) のように"><div class="kb">${['=','(',')',',',':','$','"','*','/','+','-','>','<','.'].map(c=>`<button data-c='${c}'>${c}</button>`).join('')}<button data-c="BS">⌫</button></div>
  <button class="btn" id="chk">答え合わせ</button><div id="fr"></div></div>`;p.innerHTML=h;
  const fin=$('#fin');p.querySelectorAll('.kb button').forEach(b=>b.onclick=()=>{const c=b.dataset.c;const s=fin.selectionStart??fin.value.length,e=fin.selectionEnd??s;
   if(c==='BS'){if(s===e&&s>0){fin.value=fin.value.slice(0,s-1)+fin.value.slice(e);fin.setSelectionRange(s-1,s-1)}else{fin.value=fin.value.slice(0,s)+fin.value.slice(e);fin.setSelectionRange(s,s)}}
   else{fin.value=fin.value.slice(0,s)+c+fin.value.slice(e);fin.setSelectionRange(s+1,s+1)}});
  const ck=()=>{if(done||!fin.value.trim())return;done=true;const v=fin.value;const ok=fOK(o,v);mark(o.id,ok);$('#chk').style.display='none';fAfter(o,ok,v)};
  $('#chk').onclick=ck;fin.onkeydown=e=>{if(e.key==='Enter')ck()};
 }else{
  h+=`<p class="note">📝 紙に式を書いてから「答えを見る」。</p><div id="fr"><button class="btn sub" id="rv">答えを見る</button></div></div>`;p.innerHTML=h;
  $('#rv').onclick=()=>{$('#fr').innerHTML=`<div class="ansbox fx">${esc(o.a)}</div>${o.alt.length?`<div class="note">これも正解：${o.alt.map(esc).join('　')}</div>`:''}${exHTML(o)}<p class="note">1文字ずつくらべよう（= ( ) , $ " の書きわすれは×）</p><div class="two"><button class="btn ok" id="o1">⭕ 全部同じ</button><button class="btn ng" id="x1">❌ ちがった</button></div>`;
   const fin=ok=>{if(done)return;done=true;mark(o.id,ok);nx()};$('#o1').onclick=()=>fin(true);$('#x1').onclick=()=>fin(false)};
 }
 window.scrollTo(0,0);
}
// ---- トレース ----
function drawTR(o,h0){
 const t=TR[o.id],p=$('#play');let k=0,miss=false;const vals={};
 const flowH=cur=>t.flow.map(f=>{const [txt,ty,j]=f.split('|');const num=(txt.match(/^[①-⑩]/)||[''])[0];
  return `<div class="fl ${ty} ${num&&num===cur?'now':''}"><span>${esc(txt)}</span>${j?`<span class="jn">${esc(j)}</span>`:''}</div>`}).join('');
 const rowsDone=[];
 const tblH=()=>`<table class="trt"><tr><th></th>${t.vars.map(v=>`<th>${v}</th>`).join('')}</tr>${rowsDone.map(r=>`<tr><th>${r.n}</th>${t.vars.map(v=>`<td class="${r.v===v?'chg':''}">${r.vals[v]??''}</td>`).join('')}</tr>`).join('')}</table>`;
 const render=()=>{
  const s=t.steps[k];let h=h0+`<div class="qtext">${esc(t.q)}</div><div class="note">1つずつ実行して、トレース表をうめよう。</div><div class="trw"><div class="flow">${flowH(s?s[0]:'')}</div><div class="trbox"><b style="font-size:13px">▼トレース表</b>${tblH()}<div id="tq" style="margin-top:8px"></div></div></div><div id="tf"></div></div>`;
  p.innerHTML=h;if(!s)return fin();
  const tq=$('#tq');
  if(s[1]==='?'){tq.innerHTML=`<div style="font-size:14.5px;font-weight:700">${s[0]} の判断は？</div><div class="two"><button class="btn" data-a="YES">YES</button><button class="btn sub" data-a="NO">NO</button></div>`;
   tq.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(b.dataset.a))}
  else if(s[1]==='loop'){tq.innerHTML=`<div class="ex" style="margin:0">${s[0]} ${esc(s[3])}</div><button class="btn" id="tn">次へ</button>`;$('#tn').onclick=()=>{k++;render()}}
  else{tq.innerHTML=`<div style="font-size:14.5px;font-weight:700">${s[0]} のあと<br>${s[1]==='out'?'出力される値は？':s[1]+' の値は？'}</div><input class="nin" id="tv" inputmode="numeric" style="width:100%" autocomplete="off"><button class="btn" id="ta">答える</button>`;
   const a=()=>{const v=normNum($('#tv').value);if(v!=='')answer(v)};$('#ta').onclick=a;$('#tv').onkeydown=e=>{if(e.key==='Enter')a()};setTimeout(()=>{try{$('#tv').focus({preventScroll:true})}catch(e){}},50)}
 };
 const answer=v=>{const s=t.steps[k];const ok=String(v)===String(s[2]);if(!ok)miss=true;
  $('#tq').innerHTML=`<div class="fb ${ok?'ok':'ng'}" style="font-size:14px"><b>${ok?'⭕':'❌ 正しくは '+s[2]}</b><br>${esc(s[3])}</div><button class="btn" id="tn">次へ</button>`;
  $('#tn').onclick=()=>{if(s[1]!=='?'&&s[1]!=='out'){vals[s[1]]=s[2]}
   if(s[1]!=='out'&&s[1]!=='?')rowsDone.push({n:s[0],v:s[1],vals:{...vals}});k++;render()}};
 const fin=()=>{const last=t.steps[t.steps.length-1];mark(o.id,!miss);
  $('#tf').innerHTML=`<div class="fb ${miss?'ng':'ok'}"><b>${miss?'❌ とちゅうでまちがいあり':'⭕ 全部正解！'}</b>　答え：<b>${last[2]}</b></div>${nxBtn()}`};
 render();window.scrollTo(0,0);
}

function explainBody(o){
 return `<div class="qtext">💬 ${esc(o.q)}</div><div class="note">ヒント：${esc(o.hint)}</div>
 <div class="rec"><button id="rb">🎙 録音する</button><button class="pl" id="pb" disabled>▶ 聞き返す</button></div><p class="note" id="rs">録音できないときは、声に出して言うだけでOK。</p>

function bindExplain(o){

 rb.onclick=async()=>{if(rec&&rec.state==='recording'){rec.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st);chunksA=[];rec.ondataavailable=e=>chunksA.push(e.data);
   rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunksA,{type:rec.mimeType||'audio/mp4'}));pb.disabled=false;rb.textContent='🎙 録音しなおす';$('#rs').textContent='録音できました。聞き返して、模範とくらべよう。'};
   rec.start();rb.textContent='■ 止める';$('#rs').textContent='録音中…';
  }catch(e){$('#rs').textContent='このブラウザでは録音できません。声に出して言うだけでOK。'}};
 pb.onclick=()=>{if(audioURL)new Audio(audioURL).play()};
 $('#xm').onclick=()=>{$('#xa').innerHTML=`<div class="ex">📘 ${esc(o.model)}</div><h3>チェック：自分の説明に入っていた？</h3><div class="kw">${o.kw.map(k=>`<label><input type="checkbox" class="kwc"> ${esc(k)}</label>`).join('')}</div><button class="btn" id="xf">チェックした → 次へ</button>`;
  $('#xf').onclick=()=>{const all=[...document.querySelectorAll('.kwc')].every(c=>c.checked);mark(o.id,all);nx()}};
}
function nx(){S.i++;saveProg();draw()}
function finish(){lsDel('prog');const n=S.ids.length;
 $('#play').innerHTML=`<div class="card"><h2>${esc(S.title)}　結果</h2><div class="score">${S.ok} / ${n}</div><p style="text-align:center;margin:6px 0">${S.ok===n?'🎉 全部⭕！':'❌の問題を、全部⭕になるまでくり返そう！'}</p>
 ${S.miss.length?`<button class="btn org" onclick="retry()">❌だけもう一度（${S.miss.length}問）</button><button class="btn ghost" onclick="showMissNow()">❌の問題を見る</button>`:''}<button class="btn sub" onclick="go('home')">ホームへ</button></div>`}
function retry(){const l=shuffle(S.miss);S={ids:l,i:0,ok:0,miss:[],title:S.title.replace(/（❌だけ）$/,'')+'（❌だけ）'};run(null,null,true)}

function qText(o){return o.t==='tr'?'トレース '+o.q:o.t==='f'?o.cell+' '+o.q:o.q.replace(/<[^>]+>/g,'').replace(/この記号の名称は？.*/,'この記号の名称は？')}
function aText(o){return o.t==='tr'?String(TR[o.id].steps.slice(-1)[0][2]):o.t==='x'?o.model:o.a+(o.unit||'')}
function qLine(o){return `${esc(qText(o))}<br><span class="a">→ ${esc(aText(o))}</span>`}
function showMissNow(){const l=(S&&S.miss)||[];openM(`<h2>まちがえた問題</h2>${l.length?l.map(id=>`<div class="mist">${qLine(Q[id])}</div>`).join(''):'<p class="note">まだありません。</p>'}<button class="btn ghost" onclick="closeM()">とじる</button>`)}
// ===== まとめ =====
function renderMat(){$('#mat').innerHTML=`<div class="card"><h2>📘 まとめ（テスト前に読む）</h2><p class="note">単元をタップすると、その単元の問題ができます。</p></div>`+D.U.map((u,i)=>`<div class="card"><h2>${i+1}. ${u[1]}</h2><div class="pt">${D.M[u[0]]}</div><button class="btn ghost" onclick="run(byU('${u[0]}'),'${u[1]}')">この単元の問題をやる</button></div>`).join('')}
// ===== 苦手 =====
function renderRank(){const ids=Object.keys(REC).filter(id=>Q[id]&&REC[id].x>0).sort((a,b)=>REC[b].x-REC[a].x);
 $('#rank').innerHTML=`<div class="card"><h2>🏆 苦手ランキング</h2><p class="note">まちがえた回数が多い順。最後に⭕なら「克服」。</p>${ids.length?`<button class="btn org" onclick="run(Object.keys(REC).filter(id=>Q[id]&&REC[id].last==='x').map(id=>Q[id]),'🏆 まだ❌の問題')">まだ❌の問題をやる（${ids.filter(id=>REC[id].last==='x').length}問）</button>`:''}</div><div class="card">${ids.length?ids.map(id=>`<div class="mist"><span class="c">×${REC[id].x}</span>${REC[id].last==='o'?'✅ ':''}${qLine(Q[id])}</div>`).join(''):'<p class="note">まだありません。</p>'}</div>`}
// ===== 検索 =====
function renderSearch(){$('#search').innerHTML=`<div class="card"><h2>🔍 検索</h2><input type="search" id="sq" placeholder="例：COUNTA、絶対番地、凡例、ナノ"><p class="note" style="margin-top:6px">問題・答え・解説から探します。タップでその問題を練習できます。</p></div><div id="sr"></div>`;$('#sq').oninput=e=>doSearch(e.target.value.trim())}
function doSearch(w){if(!w){$('#sr').innerHTML='';return}const lw=w.toLowerCase();
 const hit=D.Q.filter(o=>[qText(o),aText(o),o.ex||'',o.src||''].join(' ').toLowerCase().includes(lw)).slice(0,40);
 $('#sr').innerHTML=`<div class="card">${hit.length?hit.map(o=>`<div class="mist" onclick="run([Q['${o.id}']],'検索から')" style="cursor:pointer">${REC[o.id]?`<span class="c" style="background:${REC[o.id].last==='o'?'#2e7d32':'#c62828'}">${REC[o.id].last==='o'?'⭕':'❌'}${REC[o.id].n}回</span>`:''}<span class="tag">${UN[o.k]}</span> ${qLine(o)}</div>`).join(''):'<p class="note">見つかりませんでした。</p>'}</div>`}
// ===== 印刷 =====
function openPrint(){openM(`<h2>🖨 プリントを作る</h2><p class="note">解答ページつき。印刷画面で「PDFに保存」もできます。</p>
 <button class="btn" onclick="mkPrint('f')">式を書くテスト（${D.Q.filter(o=>o.t==='f').length}問）</button><button class="btn sub" onclick="mkPrint('ch')">用語の一問一答（${D.Q.filter(o=>o.t==='ch'&&!o.html).length}問）</button><button class="btn org" onclick="mkPrint('w')">⚠ 重点だけ</button><button class="btn ghost" onclick="closeM()">とじる</button>`)}
function mkPrint(t){closeM();let l=t==='f'?D.Q.filter(o=>o.t==='f'):t==='ch'?D.Q.filter(o=>o.t==='ch'&&!o.html):D.Q.filter(o=>o.warn&&o.t!=='tr'&&!o.html);
 const name=t==='f'?'式を書くテスト':t==='ch'?'用語の一問一答':'重点テスト';
 const qs=l.map((o,i)=>`<div class="pq">${i+1}. ${o.t==='f'?`［${esc(D.SH[o.sheet].title)}（${o.src}）］ <b>${o.cell}</b>：`:''}${esc(qText(o).replace(/^[A-I]\d+ /,''))}<div class="l"></div></div>`).join('');
 const as=l.map((o,i)=>`<div class="pa">${i+1}. <b>${esc(aText(o))}</b></div>`).join('');
 $('#printArea').innerHTML=`<div class="pp"><h1>情報処理　${name}<span>名前（　　　　　　　）</span></h1>${qs}</div><div class="pp"><h1>解答　${name}<span></span></h1>${as}</div>`;
 setTimeout(()=>window.print(),300)}
// ===== 報告 =====
function reportText(){const now=Date.now(),today=dayKey(now),name=lsGet('name','');let tn=0,to=0;
 Object.entries(REC).forEach(([id,r])=>(r.h||[]).forEach(x=>{if(dayKey(x[0])===today&&Q[id]){tn++;if(x[1])to++}}));
 const L=[`【情報処理 学習報告】${name?name+'　':''}${new Date(now).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}`,
 `■今日：${tn}問（⭕${to}／❌${tn-to}${tn?'、正答率'+Math.round(to/tn*100)+'%':''}）`];
 const [wd,wn]=st(D.Q.filter(o=>o.warn)),[fd,fn]=st(D.Q.filter(o=>o.t==='f'));
 L.push(`■⚠重点 ${wd}/${wn}　✍式 ${fd}/${fn}`);L.push('■単元ごと（⭕／全部）');
 D.U.forEach((u,i)=>{const [d,n]=st(byU(u[0]));L.push(`　${i+1} ${u[1]}：${d}/${n}`)});
 const [xd,xn]=st(D.Q.filter(o=>o.t==='x'));L.push(`　💬 説明：${xd}/${xn}`);
 const weak=Object.keys(REC).filter(id=>Q[id]&&REC[id].last==='x').sort((a,b)=>REC[b].x-REC[a].x).slice(0,5);
 if(weak.length){L.push('■まだ❌の苦手（上位5）');weak.forEach(id=>L.push(`　・${qText(Q[id]).slice(0,40)}（×${REC[id].x}）`))}
 return L.join('\n')}
function shortReport(){const now=Date.now(),today=dayKey(now),name=lsGet('name','');let tn=0,to=0;
 Object.entries(REC).forEach(([id,r])=>(r.h||[]).forEach(x=>{if(dayKey(x[0])===today&&Q[id]){tn++;if(x[1])to++}}));
 const s=l=>st(l).join('/');const [wd,wn]=st(D.Q.filter(o=>o.warn)),[fd,fn]=st(D.Q.filter(o=>o.t==='f'));
 const L=[`情報処理報告 ${name} ${new Date(now).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}`,`今日${tn}問 ⭕${to} 重点${wd}/${wn} 式${fd}/${fn}`,
  D.U.map((u,i)=>`${i+1}:${s(byU(u[0]))}`).join(' ')];
 const weak=Object.keys(REC).filter(id=>Q[id]&&REC[id].last==='x').sort((a,b)=>REC[b].x-REC[a].x).slice(0,3);
 if(weak.length)L.push('苦手:'+weak.map(id=>qText(Q[id]).slice(0,16)).join('／'));return L.join('\n')}
function openReport(){const t=reportText();
 openM(`<h2>📋 先生に報告する</h2><p class="note">名前を入れて送ってください。</p><input type="search" id="rname" placeholder="名前" value="${esc(lsGet('name',''))}" style="margin:6px 0">
 <textarea id="rtxt" style="width:100%;height:260px;font-size:14px;line-height:1.5;padding:8px;border:2px solid #b9d0c2;border-radius:10px">${esc(t)}</textarea>
 <button class="btn" onclick="copyReport()">📋 コピーする</button><a class="btn org" style="text-align:center;text-decoration:none" id="rline" href="#">LINE で先生に送る</a><a class="btn sub" style="text-align:center;text-decoration:none" id="rhome" href="#">👪 おうちの人に送る（LINE）</a><button class="btn" style="background:#2e7d32" onclick="showQR()">📱 QRコードで先生に見せる</button><p class="note" id="rmsg"></p><button class="btn ghost" onclick="closeM()">とじる</button>`);
 const upd=()=>{$('#rline').href='https://line.me/R/msg/text/?'+encodeURIComponent($('#rtxt').value);$('#rhome').href='https://line.me/R/msg/text/?'+encodeURIComponent('【古賀先生に転送してください】\n'+$('#rtxt').value)};upd();
 $('#rname').oninput=e=>{lsSet('name',e.target.value);$('#rtxt').value=reportText();upd()};$('#rtxt').oninput=upd}
function showQR(){const t=shortReport();let svg='';
 try{qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];const q=qrcode(0,'M');q.addData(t,'Byte');q.make();svg=q.createSvgTag({cellSize:5,margin:4,scalable:true})}catch(e){svg='<p class="note">QRコードを作れませんでした。報告画面を見せてください。</p>'}
 openM(`<h2>📱 QRコードで先生に見せる</h2><p class="note">先生のスマホのカメラで読み取ってもらってね。</p><div style="background:#fff;padding:8px;max-width:340px;margin:8px auto">${svg}</div><pre style="white-space:pre-wrap;font-size:12.5px;background:#f3f8f5;border-radius:8px;padding:8px">${esc(t)}</pre><button class="btn ghost" onclick="openReport()">報告の画面にもどる</button><button class="btn ghost" onclick="closeM()">とじる</button>`)}
function copyReport(){const t=$('#rtxt');const ok=()=>{$('#rmsg').textContent='コピーしました。LINE に貼りつけて送ってください。'};
 try{navigator.clipboard.writeText(t.value).then(ok,()=>{t.select();document.execCommand('copy');ok()})}catch(e){t.select();try{document.execCommand('copy');ok()}catch(e2){$('#rmsg').textContent='長押しして全部選択→コピーしてください。'}}}
// ===== 使い方 =====
function renderHelp(){$('#help').innerHTML=`<div class="card"><h2>❓ 使い方</h2><div class="pt">
<p><b>テスト前日のおすすめ</b></p><ol><li>📘 まとめ を読む（5分）</li><li>⚠️ 重点 を全部⭕に</li><li>✍️ 式を書く練習 を「📝紙に書く」で（本番と同じ）</li><li>単元ごとに、❌だけもう一度 → 全部⭕</li></ol>
<p><b>✍️ 式の問題</b>：表の<b>黄色いセル（？）</b>に入る式を答えます。答え方は3つ。<br>🧩 タイル：部品を順にタップ（まぎらわしい部品もまざっている）<br>⌨ 入力：記号ボタンつき。小文字・全角で打っても大丈夫（テストでは大文字・半角で書くこと）<br>📝 紙に書く：紙に書いてから答えを見て、自分で⭕❌</p>
<p><b>🔁 トレース</b>：流れ図の黄色の箱を実行して、変数の値を答える。表が1行ずつうまっていく。</p>

<p><b>📌 続きから</b>：1問ごとに自動保存。ホームの「続きから再開」で再開。</p>
<p><b>📋 先生に報告</b>：LINEで先生へ、👪おうちの人へ（転送してもらう）、📱QRコードを塾で見せる、のどれかで。</p>
<p class="note">記録はこのスマホのこのブラウザだけに残ります。</p></div></div>`}
renderHome();
