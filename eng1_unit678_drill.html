</style></head><body><div id="app"></div><div id="print"></div><script>// ===== 問題生成エンジン（中1 New Horizon Unit6〜8）=====
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const uniq=a=>[...new Set(a.filter(x=>x))];
const clean=s=>s.replace(/\s+/g,' ').replace(/ ([.?!,])/g,'$1').trim();

function ing(v){
  if(['run','swim','sit','get','put','cut','stop','shop'].includes(v)) return v+v.slice(-1)+'ing';
  if(v.endsWith('e')&&!v.endsWith('ee')) return v.slice(0,-1)+'ing';
  return v+'ing';
}
function s3(v){
  if(v==='have') return 'has';
  if(/[^aeiou]y$/.test(v)) return v.slice(0,-1)+'ies';
  if(/(s|sh|ch|x|o)$/.test(v)) return v+'es';
  return v+'s';
}
function ingType(v){
  if(['run','swim','sit','get','put','cut','stop','shop'].includes(v)) return 'dbl';
  if(v.endsWith('e')&&!v.endsWith('ee')) return 'e';
  return 'plain';
}

// ---- ルール（まちがえた時の1行）----
const R={
  c0:'「〜は・〜が」→ 表の1列目（I / he / she / we / they）',
  c1:'「〜の」→ 表の2列目（my / his / her / our / their）',
  c2:'「〜を・〜に」と、like・with・about のあと → 表の3列目（me / him / her / us / them）',
  c3:'「〜のもの」→ 表の4列目（mine / his / hers / ours / theirs）',
  whose:'「だれの〜？」→ Whose ＋ 名詞 ＋ is this[that]?',
  pos:'「〇〇のもの」→ 名前に \'s（Ken\'s / my sister\'s）',
  wh:'答えを見て選ぶ：いつ→When／どこ→Where／だれの→Whose／だれ→Who／何→What／いくつ・何歳→How',
  which:'「AとBでは、どちら？」→ Which ＋ do[does] ＋ 主語 ＋ 動詞, A or B?',
  does:'主語が he / she / 1人の名前 → does を使う（you・複数なら do）',
  ans3:'he / she が主語の答え → 動詞に s（He likes 〜 / She wants 〜）',
  can:'「〜してもいいですか」→ Can I 〜?　「〜してくれますか」→ Can you 〜?',
  be:'be動詞：I → am ／ you・複数 → are ／ he・she・1人 → is',
  prog:'「〜している」＝ be動詞（am / are / is）＋ 動詞ing。be動詞を忘れない！',
  ingP:'ふつうはそのまま ing（play → playing）',
  ingE:'e で終わる語は e をとって ing（make → making / use → using）',
  ingD:'run / swim / sit / get などは最後の文字を重ねて ing（run → running）',
  neg:'否定文は be動詞のあとに not（is not playing / isn\'t playing）',
  q:'疑問文は be動詞を主語の前へ（Is he playing 〜?）',
  qa:'答えも be動詞で（Yes, he is. / No, she isn\'t.）',
  what:'「何をしていますか」→ What is[are] ＋ 主語 ＋ doing?',
  pp:'every day（毎日）→ ふつうの形　／　now（今）→ be動詞＋ing',
  how:'形容詞だけ → How 〜!（How cute!）',
  whatA:'形容詞＋名詞 → What a[an] 〜 ●●!（What a nice picture!）',
  an:'a, i, u, e, o の音で始まる語の前は an（an interesting book）',
  road:'道案内：Go along 〜（〜を進む）／Turn left[right] at 〜（〜で曲がる）／Go straight（まっすぐ）',
  want:'「〜したい」→ want to ＋ 動詞の原形（s も ing も付けない）',
  wantS:'主語が he / she / 1人なら wants・likes（want に s）',
  wantBe:'「〜になりたい」→ want to be 〜',
  like:'「〜することが好き」→ like to ＋ 動詞の原形',
  toS:'「〜することは」→ To ＋ 動詞の原形 で文を始める',
  order:'教科書・ワークの文。日本語とよく見くらべよう',
};

// ---- 代名詞 ----
const P=[
  {ja:'私',f:['I','my','me','mine']},
  {ja:'あなた',f:['you','your','you','yours']},
  {ja:'彼',f:['he','his','him','his']},
  {ja:'彼女',f:['she','her','her','hers']},
  {ja:'それ',f:['it','its','it',null]},
  {ja:'私たち',f:['we','our','us','ours']},
  {ja:'彼ら',f:['they','their','them','theirs']},
];
const COL=['〜は・〜が','〜の','〜を・〜に','〜のもの'];
const CK=['代名詞：〜は','代名詞：〜の','代名詞：〜を・〜に','代名詞：〜のもの'];
const fixI=(s)=>s==='i'?'I':s;
function pChoices(p,c,capFirst){
  let ch=uniq(p.f);
  if(ch.length<3){ // it など
    ch=uniq(ch.concat(shuf(P.map(x=>x.f[c]).filter(x=>x&&!ch.includes(x))).slice(0,3-ch.length)));
  }
  return ch.map(x=>capFirst?cap(x):fixI(x));
}
const NOUNS=[['bag','かばん'],['pen','ペン'],['book','本'],['guitar','ギター'],['racket','ラケット'],['notebook','ノート'],['camera','カメラ'],['umbrella','かさ'],['computer','コンピュータ'],['bike','自転車'],['dog','イヌ'],['house','家']];

function gTable(){
  let p,c; do{p=rnd(P);c=Math.floor(Math.random()*4);}while(!p.f[c]);
  const ans=p.f[c];
  return {cat:'table',k:CK[c],jp:`「${p.ja}」の「${COL[c]}」の形は？`,t:`[${ans}]`,ch:pChoices(p,c,false),rule:R['c'+c],noOrder:true};
}
function gPron(){
  const c=Math.floor(Math.random()*4);
  let p; do{p=rnd(P);}while(!p.f[c]);
  const x=p.f[c];
  const [n,nj]=rnd(NOUNS);
  let t,jp;
  if(c===0){
    const T=[['can swim well.','上手に泳げます'],['can speak English.','英語を話せます'],['can play the piano.','ピアノをひけます'],['can cook well.','上手に料理ができます']];
    const [e,j]=rnd(T); t=`[${cap(x)}] ${e}`; jp=`${p.ja}は${j}。`;
    return {cat:'pron',k:CK[0],jp,t,ch:pChoices(p,0,true),rule:R.c0};
  }
  if(c===1){ t=`This is [${fixI(x)}] ${n}.`; jp=`これは${p.ja}の${nj}です。`; }
  if(c===2){
    const T=[
      [`Ken likes [${x}].`,`ケンは${p.ja}が好きです。`],
      [`Ken plays tennis with [${x}].`,`ケンは${p.ja}とテニスをします。`],
      [`Ken knows [${x}].`,`ケンは${p.ja}を知っています。`],
      [`Ken talks about [${x}].`,`ケンは${p.ja}について話します。`],
    ];
    [t,jp]=rnd(T);
  }
  if(c===3){ t=`This ${n} is [${x}].`; jp=`この${nj}は${p.ja}のものです。`; }
  return {cat:'pron',k:CK[c],jp,t,ch:pChoices(p,c,false),rule:R['c'+c]};
}
// 名前 → 代名詞（ワーク型）
const PEOPLE=[
  {n:'Ken',j:'ケン',p:2,pl:false},{n:'Yuki',j:'ユキ',p:3,pl:false},{n:'Mr. Sato',j:'佐藤先生',p:2,pl:false},
  {n:'Ms. Brown',j:'ブラウン先生',p:3,pl:false},{n:'Tom',j:'トム',p:2,pl:false},{n:'Emma',j:'エマ',p:3,pl:false},
  {n:'Ken and Yumi',j:'ケンとユミ',p:6,pl:true},{n:'Tom and Emma',j:'トムとエマ',p:6,pl:true},
];
function gPron2(){
  const q=rnd(PEOPLE), p=P[q.p];
  const T=[
    ()=>[`${q.pl?'These are':'This is'} ${q.n}. Do you know [${p.f[2]}]?`,`こちらは${q.j}です。あなたは${p.ja}を知っていますか。`,2],
    ()=>[`That is ${q.n}. I like [${p.f[2]}] very much.`,`あちらは${q.j}です。私は${p.ja}が大好きです。`,2],
    ()=>[`Look at ${q.n}. [${cap(p.f[0])}] ${q.pl?'are my friends':'is my friend'}.`,`${q.j}を見て。${p.ja}は私の友だちです。`,0],
    ()=>[`I know ${q.n}. But I don't know [${p.f[1]}] sister.`,`私は${q.j}を知っています。でも、${p.ja}のお姉さんは知りません。`,1],
    ()=>[`I play soccer with ${q.n}. [${cap(p.f[1])}] house is big.`,`私は${q.j}とサッカーをします。${p.ja}の家は大きいです。`,1],
  ];
  const [t,jp,c]=rnd(T)();
  const capF=c===0||(c===1&&t.indexOf('['+cap(p.f[1]))>=0);
  return {cat:'pron2',k:CK[c],jp,t,ch:pChoices(p,c,capF),rule:R['c'+c]};
}

// ---- Whose ----
const OWN=[["Ken's",'ケン','n'],["Yuki's",'ユキ','n'],["Hide's",'ヒデ','n'],["Taro's",'タロウ','n'],["Maki's",'マキ','n'],
  ["my sister's",'私の姉','f'],["my father's",'私の父','f'],["my brother's",'私の兄','f'],["my mother's",'私の母','f'],
  ['mine','私','p'],['hers','彼女','p'],['his','彼','p'],['yours','あなた','p'],['theirs','彼ら','p'],['ours','私たち','p']];
function gWhose(){
  const [n,nj]=rnd(NOUNS.slice(0,10)); const d=rnd([['this','これ'],['that','あれ']]);
  const o=rnd(OWN);
  const jp=`${d[1]}はだれの${nj}ですか。― ${o[1]}のものです。`;
  if(Math.random()<0.45){
    return {cat:'whose',k:'Whose（だれの）',jp,t:`[Whose] ${n} is ${d[0]}? — It's ${o[0]}.`,ch:['Whose','Who','What','Where'],rule:R.whose};
  }
  let t,ch,rule=R.pos,k="〜'sのもの";
  if(o[2]==='n'){const b=o[0].replace("'s",'');t=`Whose ${n} is ${d[0]}? — It's [${o[0]}].`;ch=[b,o[0],b+'s'];}
  else if(o[2]==='f'){const b=o[0].replace("my ",'').replace("'s",'');t=`Whose ${n} is ${d[0]}? — It's my [${b}'s].`;ch=[b,b+"'s",b+'s'];}
  else{const p=P.find(x=>x.f[3]===o[0]);t=`Whose ${n} is ${d[0]}? — It's [${o[0]}].`;ch=pChoices(p,3,false);rule=R.c3;k=CK[3];}
  return {cat:'whose',k,jp,t,ch,rule};
}
const WH=[
  ['[When] is your birthday? — It\'s November 4th.','あなたの誕生日はいつですか。― 11月4日です。'],
  ['[Where] is my book? — It\'s under the desk.','私の本はどこにありますか。― 机の下にあります。'],
  ['[What] time is it? — It\'s ten o\'clock.','何時ですか。― 10時です。'],
  ['[Who] are they? — They are my sisters.','彼女たちはだれですか。― 私の姉妹です。'],
  ['[How] old are you? — I\'m thirteen.','あなたは何歳ですか。― 13歳です。'],
  ['[How] many dogs do you have? — I have two.','あなたは何匹イヌを飼っていますか。― 2匹です。'],
  ['[What] do you usually do after school? — I play soccer.','あなたはふだん放課後に何をしますか。― サッカーをします。'],
  ['[When] do you study math? — I study it after school.','あなたはいつ数学を勉強しますか。― 放課後に勉強します。'],
  ['[Whose] T-shirt is that? — It\'s Taro\'s.','あれはだれのTシャツですか。― タロウのものです。'],
  ['[When] is the concert? — It\'s on August 8th.','コンサートはいつですか。― 8月8日です。'],
  ['[Where] is my racket? — It\'s by the bed.','私のラケットはどこにありますか。― ベッドのそばにあります。'],
  ['[Whose] pencil is this? — It\'s Maki\'s.','これはだれのえんぴつですか。― マキのものです。'],
  ['[What] is this? — It\'s a guitar.','これは何ですか。― ギターです。'],
  ['[Who] is that girl? — She is my sister.','あの女の子はだれですか。― 私の妹です。'],
  ['[Where] is the hospital? — It\'s by the station.','病院はどこですか。― 駅のそばです。'],
];
function gWh(){
  const [t,jp]=rnd(WH);
  const a=t.match(/\[(.+?)\]/)[1];
  const ch=uniq([a].concat(shuf(['When','Where','Whose','Who','What','How'].filter(x=>x!==a)).slice(0,3)));
  return {cat:'wh',k:'疑問詞の使い分け',jp,t,ch,rule:R.wh};
}

// ---- Which ----
const WP=[
  {a:'baseball',b:'soccer',ja:'野球',jb:'サッカー',n:'sport',nj:'スポーツ',vs:['play','like']},
  {a:'tennis',b:'basketball',ja:'テニス',jb:'バスケットボール',n:'sport',nj:'スポーツ',vs:['play','like']},
  {a:'dogs',b:'cats',ja:'イヌ',jb:'ネコ',n:'animal',nj:'動物',vs:['like','want']},
  {a:'math',b:'English',ja:'数学',jb:'英語',n:'subject',nj:'教科',vs:['like','study']},
  {a:'rice',b:'toast',ja:'ごはん',jb:'トースト',n:'food',nj:'食べ物',vs:['eat','want']},
  {a:'pizza',b:'spaghetti',ja:'ピザ',jb:'スパゲッティ',n:'food',nj:'食べ物',vs:['eat','like']},
  {a:'summer',b:'winter',ja:'夏',jb:'冬',n:'season',nj:'季節',vs:['like']},
  {a:'apples',b:'oranges',ja:'リンゴ',jb:'オレンジ',n:'fruit',nj:'果物',vs:['like','want']},
  {a:'Japanese',b:'English',ja:'日本語',jb:'英語',n:'language',nj:'言語',vs:['speak','study']},
  {a:'pens',b:'notebooks',ja:'ペン',jb:'ノート',n:null,vs:['want','use']},
];
const WV={play:['をしますか','をします'],like:['が好きですか','が好きです'],want:['がほしいですか','がほしいです'],study:['を勉強しますか','を勉強します'],eat:['を食べますか','を食べます'],speak:['を話しますか','を話します'],use:['を使いますか','を使います']};
const WS=[
  {s:'you',ja:'あなた',d:'do',a:'I',aj:'私',th:false},
  {s:'he',ja:'彼',d:'does',a:'He',aj:'彼',th:true},
  {s:'she',ja:'彼女',d:'does',a:'She',aj:'彼女',th:true},
  {s:'Ken',ja:'ケン',d:'does',a:'He',aj:'彼',th:true},
  {s:'Yumi',ja:'ユミ',d:'does',a:'She',aj:'彼女',th:true},
  {s:'your mother',ja:'あなたのお母さん',d:'does',a:'She',aj:'彼女',th:true},
];
function gWhich(){
  const p=rnd(WP), v=rnd(p.vs), S=rnd(WS);
  const useN=p.n&&Math.random()<0.3;
  const pickA=Math.random()<0.5; const A=pickA?p.a:p.b, AJ=pickA?p.ja:p.jb;
  const jw=WV[v];

function toks(s){ // 文 → 語のリスト（, は1語、最後の . ? ! は除く）
  const body=s.replace(/[.?!]$/,'');
  return body.replace(/,/g,' ,').split(/\s+/).filter(x=>x);
}
const LOW=new Set(['what','which','whose','who','where','when','how','is','are','am','do','does','can','my','his','her','their','our','your','this','that','these','those','to','go','turn','the','a','an','he','she','they','we','you','it','and','or','but','not','in','at','for','of','with','now','now?']);
const lc=(w)=>LOW.has(w.toLowerCase())?w.toLowerCase():w;
function swapWrong(s){
  const end=s.match(/[.?!]$/)?s.slice(-1):'';
  const t=toks(s).map((w,i)=>i===0?lc(w):w); if(t.length<3) return null;
  for(let k=0;k<20;k++){
    const u=t.slice(); const i=Math.floor(Math.random()*(u.length-1));
    if(u[i].toLowerCase()===u[i+1].toLowerCase()||u[i]===','||u[i+1]===',') continue;
    [u[i],u[i+1]]=[u[i+1],u[i]];
    let o=u.map((w,j)=>j===0?w:lc(w)).join(' ').replace(/ ,/g,',')+end;
    o=o.charAt(0).toUpperCase()+o.slice(1);
    if(o!==s) return o;
  }
  return null;
}
function gWork(){
  const [jp,en]=rnd(WORK);
  let ch=uniq([en,swapWrong(en),swapWrong(en),swapWrong(en),swapWrong(en),swapWrong(en)]).slice(0,4);
  if(ch.length<3) ch=uniq(ch.concat([en.replace(/^How/,'What'),en.replace(/^How /,'How a '),en.replace(/^What an? /,'How ')])).slice(0,4);
  return {cat:'work',k:'ワーク・教科書の文',jp,t:`[${en}]`,ch,rule:R.order,ord:en};
}

function finish(q){
  const m=q.t.match(/\[(.+?)\]/);
  q.ans=m[1];
  q.full=q.t.replace(/\[(.+?)\]/,'$1');
  q.ord=q.ord||(q.noOrder?null:q.full.split(' — ')[0]);
  q.ch=uniq(q.ch);
  if(!q.ch.includes(q.ans)) q.ch.unshift(q.ans);
  q.ch=shuf(q.ch);
  q.alts=q.alts||[];
  return q;
}
function makeQ(catId){ const c=CATS.find(x=>x.id===catId); return finish(c.g()); }

const CONTR={"isn't":'is not',"aren't":'are not',"i'm":'i am',"it's":'it is',"don't":'do not',"doesn't":'does not',"he's":'he is',"she's":'she is',"they're":'they are',"you're":'you are',"we're":'we are',"can't":'cannot',"let's":'let us'};
function norm(s){
  s=s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[。．]/g,'.').replace(/[？]/g,'?').replace(/[！]/g,'!').replace(/[，、]/g,',');
  s=s.replace(/[.?!]+\s*$/,'').replace(/\s*,\s*/g,', ').replace(/\s+/g,' ').trim();
  return s.split(' ').map(w=>CONTR[w]||w).join(' ');
}
function checkWrite(q,v){
  const g=norm(v);

  const d=document.createElement('div'); d.className='modal';
  d.innerHTML=`<div class="mbox"><h3>🖨 プリントを作る</h3><p class="hint">問題は毎回ちがう組み合わせになります。2ページ目が答えです。</p>
  <label>はんい<select id="pc"><option value="all">ぜんぶ ミックス</option><option value="6">Unit 6 ミックス</option><option value="7">Unit 7 ミックス</option><option value="8">Unit 8</option>${CATS.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>
  <label>形式<select id="pm"><option value="choice">( )の中から選ぶ</option><option value="order">並べかえ</option><option value="write">＿＿に書く</option></select></label>
  <label>問題数<select id="pn"><option>10</option><option selected>20</option><option>30</option></select></label>
  <div class="row"><button class="small" id="pcan">やめる</button><button class="go" id="pgo">印刷する</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#pcan').onclick=()=>d.remove();
  d.querySelector('#pgo').onclick=()=>{const c=d.querySelector('#pc').value,m=d.querySelector('#pm').value,n=+d.querySelector('#pn').value;d.remove();doPrint(c,m,n);};
}
function doPrint(c,m,n){
  const ids=c==='all'?CATS.map(x=>x.id):(['6','7','8'].includes(c)?CATS.filter(x=>String(x.u)===c).map(x=>x.id):[c]);
  const qs=[]; const seen=new Set(); let guard=0;
  while(qs.length<n&&guard++<500){const q=makeQ(ids[qs.length%ids.length]); if(seen.has(q.full))continue; if(m==='order'&&!q.ord)continue; seen.add(q.full); qs.push(q);}
  const title=c==='all'?'Unit 6〜8 ミックス':(['6','7','8'].includes(c)?`Unit ${c}`:CATS.find(x=>x.id===c).name);
  const mt={choice:'(　)の中から正しいものを選んで○でかこみなさい。',order:'日本文に合うように、(　)内の語を並べかえなさい。',write:'日本文に合うように、＿＿に入る英語を書きなさい。'}[m];
  let h=`<div class="pp"><h2>${esc(title)}　<small>名前（　　　　　　　）　　　／${n}</small></h2><p>${mt}</p><ol>`;
  for(const q of qs){
    let body;
    if(m==='choice'&&q.ch.length<=4&&!q.t.startsWith('[')) body=esc(q.t).replace(/\[(.+?)\]/,`( ${q.ch.map(esc).join(' / ')} )`);
    else if(m==='choice') body=`<span class="pc">${q.ch.map((x,i)=>'アイウエ'[i]+'. '+esc(x)).join('　')}</span>`;
    else if(m==='order'){const end=(q.ord.match(/[.?!]$/)||[''])[0];body=`( ${shuf(toks(q.ord).map((w,i)=>i===0?lc(w):w)).map(esc).join(' / ')} ${end} )<div class="ln"></div>`;}
    else body=esc(q.t).replace(/\[(.+?)\]/,'<span class="u">　　　　　　　　</span>');
    h+=`<li><div class="pj">${esc(q.jp)}</div><div>${body}</div></li>`;
  }
  h+=`</ol></div><div class="pp brk"><h2>${esc(title)}　解答</h2><ol class="ans">${qs.map(q=>`<li>${esc(q.full)}</li>`).join('')}</ol></div>`;
  document.getElementById('print').innerHTML=h;
  setTimeout(()=>window.print(),200);
}
home();
</script></body></html>
