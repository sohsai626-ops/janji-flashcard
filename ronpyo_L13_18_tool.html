</style></head><body><div id="app"></div><div id="print"></div><script>// ===== 論理表現 Lesson 13〜18・Extra 1（不定詞・動名詞・分詞）=====
// en の [ ] が答えの部分。| は別解。o.s=先生の解説あり, o.ch=選択肢, o.h=ヒント
const U={
 L13:['Lesson 13','不定詞(2)','of A to do／人に〜させる・してほしい'],
 L14:['Lesson 14','不定詞(3)','seem to／to be＋過去分詞／to have＋過去分詞'],
 EX1:['Extra Lesson 1','不定詞','疑問詞＋to／目的／too…to／独立不定詞'],
 L15:['Lesson 15','動名詞(1)','〜ing と to do のちがい'],
 L16:['Lesson 16','動名詞(2)','not 〜ing／having＋過去分詞／慣用表現'],
 L17:['Lesson 17','分詞(1)','名詞を説明する分詞／〜ing と 〜ed'],
 L18:['Lesson 18','分詞(2)','O＋分詞／分詞構文'],
};
const ITEMS=[];
function Q(u,no,jp,en,r,o){ITEMS.push(Object.assign({u,no,jp,en,r,id:u+'-'+no},o||{}));}
const OF='「〜するなんて A は…だ」→ It is＋人の性質（nice, kind, smart, careless, rude）＋of A to do。「A は…だ」と言えれば of、言えなければ for';

const GIT='Give It a Try（解答例）：自分で考えて書く問題。解答例とちがっても、文法が正しければOK（先生に確認しよう）';
// ---------- Lesson 13 ----------
Q('L13','①1','手伝ってくれるなんてサチはなんて優しいんだ。',"It is nice [of] Sachi [to] help me.",
 '「〜するなんて」→ It is＋人の性質＋of A to do。Sachi が意味上の主語（だれが help するか）、to help me が真主語（It の中身）。「サチは優しい（Sachi is nice）」と言えるので of',{s:1});
Q('L13','①2','間違ったバスに乗るなんて、あなたは不注意でしたね。',"It was [careless] [of] you [to] take the wrong bus.",OF);
Q('L13','①3','私はジョンにサラも誘うように頼んだ。',"I [asked] [John] [to] invite Sarah, too.",
 'ask＋人＋to do「人に〜するように頼む」／tell＋人＋to do「〜するように言う」／want＋人＋to do「〜してほしい」。「頼んだ」の『た』→ 過去形 asked',{s:1});
Q('L13','①4','写真をお撮りしましょうか。',"Would you [like] [me] to [take] your photo?",
 'would like ＝ want。want A to do「A に〜してほしいと思っている」→ Would you like me to 〜?「私に〜してほしいですか＝〜しましょうか」',{s:1});
Q('L13','①5','両親は私がスマホを持つことを許そうとはしない。',"My parents won't [allow|permit] [me] [to] have a smartphone.",
 'allow A to do「A が〜するのを許す」（permit でもよいが、堅い表現）',{s:1});
Q('L13','②1','私はミカがトランペットを演奏するのを聞いた。',"I [listened to Mika play] the trumpet.",
 '知覚動詞（see, watch, hear, listen to, feel）＋O＋原形「O が〜するのを見る・聞く」。to は付けない');
Q('L13','②2','私はイヌがえさを食べるのを見ていた。',"I [was watching my dog eat] his food.",
 '知覚動詞＋O＋原形。watch my dog eat「イヌが食べるのを見る」');
Q('L13','②3','先生たちは学園祭の準備のために早く登校させてくれた。',"Our teachers [let us come to school] early to prepare for the school festival.",
 'let＋O＋原形「O に（望みどおり）〜させてあげる」。to は付けない');
Q('L13','②4','私は昨日書店で店員にその本を見つけてもらった。',"I [had the clerk find the book] at the bookstore yesterday.",
 'have＋O＋原形「O に（当然すべきことを）〜してもらう」');
Q('L13','③1','あんなふうに先生に話すなんて、あなたは失礼だ。',"It is rude [of] you to talk to your teacher like that.",OF,{ch:['of','for']});
Q('L13','③2','先生は私に夢をあきらめないように助言した。',"My teacher advised [me not to] give up my dream.",
 'advise＋人＋to do。「〜しないように」は not を to の前に → 人＋not to do',{ch:['me not to','for me to not']});
Q('L13','③3','たいていの親にとって、子どもに一生懸命勉強させるのは難しい。',"For most parents, it is difficult to get [their children] to study hard.",
 'get＋O＋to do「（説得して）O に〜させる」。O の前に for は付けない',{ch:['their children','for their children']});
Q('L13','③4','まず自己紹介させてください。',"Let me [introduce] myself first.",'let＋O＋原形。to は付けない',{ch:['introduce','to introduce']});
Q('L13','③5','私は30分以上待たされた。',"I was made [to wait] for over thirty minutes.",
 'make＋O＋原形 を受け身にすると、原形が to do に変わる（was made to wait）',{ch:['wait','to wait']});
Q('L13','④1','学校行事向けに素晴らしいプランを提案したなんて、ケンタは賢い。',"It was [clever of Kenta to|smart of Kenta to] suggest a great plan for the school event.",
 '「〜したなんて」→ It is[was]＋人の性質＋of A to do。「ケンタは賢い（Kenta was clever）」と言えるので of。模範解答は clever（smart も可）',{s:1});
Q('L13','④2','私たちの英語の先生は、私たちにたくさんの英語の小説を読んでほしいと思っている。',"Our English teacher [wants us to read] a lot of English novels.",
 'want＋人＋to do「人に〜してほしい」。人は目的格（us）。主語が先生1人なので wants');
Q('L13','④3','両親は、夜9時以降は私にスマホを使わせてくれない。',"My parents [don't let me use|won't let me use|do not let me use|will not let me use|don't allow me to use|won't allow me to use|do not allow me to use|will not allow me to use] my smartphone after 9 p.m.",
 'let＋O＋原形「O に〜させてあげる」→ 否定 don\'t let me use。allow＋O＋to do でもよい（don\'t allow me to use）');
Q('L13','④4','だれかが玄関のドアを開けるのが聞こえた。（front door）',"I [heard someone open] the front door.",
 '感覚動詞＋O＋do（原形）。一般に、動作の始めから終わりまでが対象（開けるところが全部聞こえた）',{s:1});
Q('L13','④5','母は私に朝食を食べるように言った。',"My mother [told me to eat|told me to have] breakfast.",
 'tell＋人＋to do「人に〜するように言う」。「言った」の『た』→ told',{s:1});
Q('L13','GIT1','熱があったので、コーチは（出たかったが）私を試合に出してくれなかった。（make か let を正しい形で）',"Our coach didn't [let] me play in the game because I had a fever.",
 'Give It a Try：make と let の使い分け。let＋O＋原形「O に（望んでいることを）させてやる」。出たかったのに出してくれなかった → didn\'t let。didn\'t のあとは原形',{ch:['let','make','made']});
Q('L13','GIT2','昨晩私はテレビを見たかったが、父が（強制的に）試験勉強をさせた。（make か let を正しい形で）',"I wanted to watch TV last night, but my father [made] me study for the test.",
 'Give It a Try：make＋O＋原形「O に（強制的に）〜させる」。見たかったのに勉強させられた → make。昨晩のこと → 過去形 made',{ch:['made','make','let']});

// ---------- Lesson 14 ----------
Q('L14','①1','みんな文化祭を楽しんでいるようだ。',"Everyone [seems to be enjoying] the school festival.",
 'seem, appear＋to do「〜のようだ・〜のように見える」。「楽しんでいる」→ to be ～ing。every / everyone は単数あつかい → seems',{s:1});
Q('L14','①2','今日は、ひとりにしておいてほしい。',"I [want to be left alone] today.",
 '受け身の不定詞：to be＋過去分詞。leave O alone「O をひとりにしておく」→ be left alone「ひとりにしておかれる」');
Q('L14','①3','インフルエンザが流行っているようだ。',"The flu [seems to be going] around.",'seem to be ～ing「〜しているようだ」（進行形の不定詞）');
Q('L14','①4','このタブレットは使う前に充電する必要がある。',"This tablet [needs to be charged] before you use it.",
 'タブレットは「充電される」側 → to be＋過去分詞（need to be charged）');
Q('L14','②1','a. It seems that Kevin is sleepy. と同じ意味に',"Kevin seems [to] [be] sleepy.",'It seems that S is 〜 → S seems to be 〜（時が同じ → to be）');
Q('L14','②2','a. Edison was believed to be a genius. と同じ意味に',"It was believed that [Edison|he] [was] a genius.",
 'S was believed to be 〜 → It was believed that S was 〜（主語 Edison をそのまま that のあとへ、時制は was）');
Q('L14','②3','a. It is said that this museum was built in the eighteenth century. と同じ意味に',"This museum is said [to] [have] [been] built in the eighteenth century.",
 '「言われている（今）」より「建てられた（昔）」が前 → 完了不定詞 to have＋過去分詞。受け身なので to have been built');
Q('L14','②4','a. It seems that Daiki has been learning the piano for many years. と同じ意味に',"Daiki seems [to] [have] [been] [learning] the piano for many years.",
 'that 節が現在完了進行形 → to have been ～ing');
Q('L14','③1','あなたの作文は今週末までに書かれる必要がある。',"Your essay [needs to be written by] the end of this week.",'作文は「書かれる」側 → to be＋過去分詞。by「〜までに」');
Q('L14','③2','マナはだれかを待っているようだった。',"Mana [seemed to be waiting for] someone.",'seem to be ～ing「〜しているようだ」。「〜ようだった」→ seemed');
Q('L14','③3','メグはチームのキャプテンに選ばれることを望んでいる。',"Meg [hopes to be elected captain] of the team.",
 'hope to be＋過去分詞「〜されることを望む」。役職（captain）には a を付けない');
Q('L14','③4','電話に出られなくてごめんなさい。',"I am sorry [to have missed] your call.",'「ごめんなさい（今）」より「出られなかった（前）」→ to have＋過去分詞');
Q('L14','④1','電話が話し中だ。まだベンがベスと電話で話しているようだ。',"The line is busy. Ben seems [to be speaking|to be talking] with Beth on the phone again.",'seem to be ～ing「〜しているようだ」');
Q('L14','④2','校門に何人か人が来ている。彼らは今日のイベントに招待されたようだ。',"There are several people at the school gate. They [seem to have been invited] to today's event.",
 '「〜ようだ（今）」より「招待された（前）」→ to have been＋過去分詞');
Q('L14','④3','ミキは先生にほめられたかった。（praise）',"Miki [wanted to be praised by her teacher|wanted to be praised by the teacher].",
 '主語＋be動詞＋過去分詞「〜される」。ほめ・られ・たかっ・た → wanted to be praised。「先生に」→ by her teacher',{s:1});
Q('L14','④4','ダヴィンチはパラシュートを発明したと言われている。',"[Da Vinci is said to have invented the parachute|It is said that da Vinci invented the parachute|Da Vinci is said to have invented a parachute|It is said that da Vinci invented a parachute|They say that da Vinci invented the parachute|They say da Vinci invented the parachute].",
 'They say (that) ＝ It is said that 〜「〜だと言われている」。Da Vinci を主語にすると、発明したのは前のこと → to have invented（完了不定詞）',{s:1});

Q('L14','GIT','私の兄は2時間前は忙しそうだったが、今は暇な（くつろいでいる）ようだ。',"My brother [seemed to be busy] two hours ago, but now he [seems to be free|seems to be relaxing].",
 GIT+'。「〜ようだった（過去）」→ seemed to be、「〜ようだ（今）」→ seems to be');

// ---------- Extra Lesson 1 ----------
const QW='疑問詞＋to do：what to do（何を〜すべきか）／how to do（どのように）／when to do（いつ）／where to do（どこで）';
Q('EX1','①1','ジムの誕生日パーティーに何を持っていくか考えよう。',"Let's think about [what] to bring to Jim's birthday party.",QW,{ch:['how','what','when','where']});
Q('EX1','①2','ひとり暮らしを始める前に、料理のしかたを学ぶ必要がある。',"I need to learn [how] to cook before starting to live alone.",QW,{ch:['how','what','when','where']});
Q('EX1','①3','いつトマトを植えればいいか知りたい。―このサイトには5月上旬とある。',"I want to know [when] to plant tomatoes. — This website says in early May.",QW,{ch:['how','what','when','where']});
Q('EX1','①4','これらの箱をどこに置けばいいか教えてほしい。―あの棚の上ですか？',"I'd like you to tell me [where] to put these boxes. — On that shelf?",QW,{ch:['how','what','when','where']});

    }
    else body=esc(q.en).replace(/\[(.+?)\]/g,(mm,a)=>`( <span class="u" style="min-width:${Math.max(3,a.split('|')[0].length*0.55)}em"></span> )`);
    h+=`<li><div class="pj">${esc(q.jp)}　<span class="no">[${U[q.u][0]} ${q.no}]</span></div><div>${body}</div></li>`;
  }
  h+=`</ol></div><div class="pp brk"><h2>${esc(title)}　解答</h2><ol class="ans">${qs.map(q=>`<li>${esc(q.tr||q.full)}</li>`).join('')}</ol></div>`;
  document.getElementById('print').innerHTML=h;
  setTimeout(()=>window.print(),200);
}
home();
</script></body></html>
