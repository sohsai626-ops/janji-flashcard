<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中1数学 方程式 くわしい解説</title>
<style>
:root{--fs:26px;--lw:auto;--rw:auto;--bg:#fcfaf4;--ink:#28282f;--grey:#7a7a85;--red:#d63a3a;--blue:#2f6fd6;--org:#e08a1e;--pur:#8a3fd1;--grn:#14915a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",Meiryo,sans-serif}
button{font-family:inherit}
i{font-family:"Times New Roman",Times,serif;font-style:italic;font-weight:normal;padding:0 .04em}
.op{margin:0 .1em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.82em;margin:0 .12em;line-height:1.12}
.fr .nu{border-bottom:2px solid currentColor;padding:0 .2em .05em}
.fr .de{padding:.05em .2em 0}
.r{color:var(--red)}.b{color:var(--blue)}.o{color:var(--org)}.p{color:var(--pur)}
.g{color:var(--grn);font-weight:700;border-bottom:3px solid var(--grn);padding:0 .1em}
.t{display:inline-flex;align-items:center;position:relative;border-radius:6px}
/* ---------- home ---------- */
#home{height:100%;overflow-y:auto;padding:18px 14px 40px}
h1{font-size:24px;margin:6px 0 2px;text-align:center}
.sub{color:var(--grey);text-align:center;font-size:14px;margin-bottom:14px}
.mode{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #e6dfcc;border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:15px}
.mode input{width:24px;height:24px;accent-color:var(--grn)}
.unit{background:#fff;border:2px solid #eadfca;border-radius:16px;padding:12px;margin-bottom:12px}
.unit h2{font-size:19px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.unit h2 .no{background:#e2557a;color:#fff;border-radius:8px;padding:2px 8px;font-size:15px}
details{margin:4px 0 10px;background:#fff7e6;border-radius:10px;padding:8px 10px;font-size:15px;line-height:1.7}
summary{font-weight:700;color:#b5651d;cursor:pointer}
details ul{margin:6px 0 0;padding-left:1.1em}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{flex:1 1 calc(50% - 8px);min-width:140px;border:2px solid #cfd9ee;background:#f4f7fd;border-radius:12px;padding:10px 8px;font-size:16px;text-align:left;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pbtn.star{border-color:#f0c35a;background:#fff8e2}
.pbtn .lbl{font-weight:700}
.pbtn .chk{margin-left:auto;color:var(--grn);font-weight:700}
.badge{font-size:11px;background:#f0b429;color:#fff;border-radius:6px;padding:1px 5px}
/* ---------- problem view ---------- */
#view{display:none;height:100%;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-bottom:2px solid #eee4cf}
#top button{border:none;background:#efe8d8;border-radius:10px;padding:8px 10px;font-size:15px}
#ttl{font-weight:700;font-size:16px;flex:1;line-height:1.3}
#prog{font-size:13px;color:var(--grey);white-space:nowrap}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#q{margin:10px 10px 0;background:#fff;border:2px solid #e6dfcc;border-radius:14px;padding:10px 12px;font-size:17px;line-height:1.8}
#q .qt{font-size:13px;color:var(--grey)}
#board{position:relative;padding:6px 8px 26px;font-size:var(--fs);min-height:120px}
#arcs{position:absolute;left:0;top:0;width:100%;pointer-events:none;overflow:visible;z-index:3}
.row{animation:none}
.row.e{display:flex;justify-content:center;align-items:center;padding-top:.62em;line-height:1.3}
.row.e.arcrow{padding-top:1.5em}
.row .cl{width:var(--lw);text-align:right;flex:none}
.row .cq{width:1.3em;text-align:center;flex:none}
.row .cr{width:var(--rw);text-align:left;flex:none}
.in{white-space:nowrap;display:inline-flex;align-items:center}
.row .cl .lab{font-size:.62em;color:var(--grey)}
.row.tx{padding:.6em .3em 0;text-align:center;font-size:.8em;line-height:1.6}
.row.new{animation:rowin .6s ease-out}
@keyframes rowin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.1s ease-in-out 3;}
@keyframes pulse{0%,100%{background:transparent;box-shadow:none}50%{background:#ffe680;box-shadow:0 0 0 4px #ffe680}}
.land{animation:land .5s ease-out}
@keyframes land{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.fly{position:absolute;z-index:6;pointer-events:none;white-space:nowrap;display:inline-flex;align-items:center;background:#fffbe0;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.18);padding:0 .1em;font-weight:700}
.cx::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;border-top:3px solid var(--red);transform:rotate(-35deg) scaleX(0);animation:slash .45s ease-out forwards;animation-delay:var(--d,0s)}
.cx.done::after{animation:none;transform:rotate(-35deg) scaleX(1)}
@keyframes slash{to{transform:rotate(-35deg) scaleX(1)}}
.cx[data-n]::before{content:attr(data-n);position:absolute;right:-.62em;top:-.75em;font-size:.62em;color:var(--red);font-weight:700;opacity:0;animation:fadein .3s forwards;animation-delay:calc(var(--d,0s) + .4s)}
.cx.done[data-n]::before{animation:none;opacity:1}
@keyframes fadein{to{opacity:1}}
.dia{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:nowrap;font-size:.95em}
.dia .bx{border:2px solid #555;border-radius:6px;padding:4px 6px;text-align:center;line-height:1.3;min-width:3.6em;background:#fff}
.dia .bx b{font-size:1.05em}
.dia .ar{font-size:1.2em;color:var(--pur);text-align:center;line-height:1.1}
.dia .ar small{display:block;font-size:.55em}
/* ---------- card ---------- */
#card{background:#fff;border-top:3px solid #e8dcc0;padding:10px 14px 4px;min-height:132px;max-height:42vh;overflow-y:auto}
#ctag{font-size:14px;font-weight:700;color:#b5651d;margin-bottom:4px}
#ctext{font-size:18px;line-height:1.75}
#ctext .dob{font-weight:700;display:block;margin-bottom:4px}
#cnote{font-size:13px;color:var(--grey);margin-top:6px}
.ansbox{background:#eaf7ef;border:2px solid var(--grn);border-radius:12px;padding:6px 10px;margin:4px 0 8px;font-weight:700;font-size:20px;text-align:center}
.exbox{background:#fff6e0;border:2px solid var(--org);border-radius:12px;padding:8px 10px;font-size:16px;line-height:1.7}
.exbox b{color:var(--org)}
#nav{display:flex;gap:10px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:#fff}
#nav button{flex:1;border:none;border-radius:14px;padding:14px 6px;font-size:18px;font-weight:700}
#bk{background:#ece6d8;color:#555;flex:0 0 32% !important}
#nx{background:var(--grn);color:#fff}
#nx.alt{background:#e2557a}
</style>
</head>
<body>
<div id="home"></div>
<div id="view">
  <div id="top"><button id="homeBtn">≡ 一覧</button><div id="ttl"></div><div id="prog"></div></div>
  <div id="main">
    <div id="q"></div>
    <div id="board"></div>
  </div>
  <div id="card"><div id="ctag"></div><div id="ctext"></div><div id="cnote"></div></div>
  <div id="nav"><button id="bk">◀ もどる</button><button id="nx">スタート ▶</button></div>
</div>
<script>
/* ================= mini math markup =================
   [key|content|class]  -> tagged span      {num/den} -> fraction
   x, a -> italic letters ;  - * + = :  -> math operators            */
function closeIdx(s,i,o,c){let d=0;for(let j=i;j<s.length;j++){if(s[j]===o)d++;else if(s[j]===c){d--;if(!d)return j}}return s.length-1}
function splitTop(s,ch){const out=[];let d=0,cur='';for(const c of s){if(c==='['||c==='{')d++;if(c===']'||c==='}')d--;if(c===ch&&d===0){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
const OPS={'-':'−','*':'×','+':'+','=':'=',':':':'};
function esc(c){return c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c}
function M(s){if(s==null)return'';let out='';for(let i=0;i<s.length;){const ch=s[i];
  if(ch==='['){const j=closeIdx(s,i,'[',']');const p=splitTop(s.slice(i+1,j),'|');out+=`<span class="t ${p[2]||''}" data-k="${p[0]}">${M(p[1]||'')}</span>`;i=j+1;continue}
  if(ch==='{'){const j=closeIdx(s,i,'{','}');const p=splitTop(s.slice(i+1,j),'/');out+=`<span class="fr"><span class="nu">${M(p[0])}</span><span class="de">${M(p[1]||'')}</span></span>`;i=j+1;continue}
  if(ch==='x'||ch==='a'){out+=`<i>${ch}</i>`;i++;continue}
  if(OPS[ch]){out+=`<span class="op">${OPS[ch]}</span>`;i++;continue}
  out+=esc(ch);i++}return out}
const E=(L,R,eq)=>({L,R,eq}), T=s=>({T:s}), Hh=s=>({H:s});

/* ================= data ================= */
const UNITS=[
{no:'3-1',name:'方程式と解',
 point:['xに入れる数によって、成り立ったり 成り立たなかったりする等式を <b>方程式</b> という。',
        '方程式を成り立たせる xの値を <b>解（かい）</b> という。',
        '解かどうかは、xに その数を入れて（代入して）、<b>左辺と右辺を 別々に計算</b>。同じなら 解。',
        'マイナスの数は <b>かっこを つけて</b> 代入する。'],
 probs:[
 {t:'ア　6-x=10',q:'x=-4 は 6-x=10 の 解かな？<br><span class="qt">（−4 が解であるものを ア〜エ から すべて選ぶ問題）</span>',
  start:[E('6-[x1|x|o]','10')],
  steps:[
   {do:'左辺（＝の左がわ）の x に −4 を 入れる。マイナスの数は かっこを つけて 入れる。',row:E('<(左辺)>','6-[s1|(-4)|o]'),move:[['x1','s1']],why:'「6−−4」と 書くと わけが 分からなくなるので、かっこで つつむ。'},
   {do:'−(−4) を 計算する',row:E('','6+4'),why:'「−」の あとに「−4」が 来たら、マイナスが 2つで ＋ になる。−(−4)＝＋4'},
   {row:E('','[r1|10|b]'),why:'左辺は 10'},
   {do:'右辺（＝の右がわ）を 見る',row:E('<(右辺)>','[r2|10|b]'),why:'右辺には x が ないので、そのまま 10'},
   {row:T('左辺 10 と 右辺 10 → [g|同じ！|g]'),why:'左辺＝右辺 が 成り立つ。だから −4 は 解。'}],
  ans:'○　−4 は 解',ex:'「−4 は 解」って どういう意味？ 「左辺」「右辺」という ことばを つかって 説明しよう。'},
 {t:'イ　-3-(x+1)=1',q:'x=-4 は -3-(x+1)=1 の 解かな？',
  start:[E('-3[m|-|p]([a1|x|]+[b1|1|])','1')],
  steps:[
   {do:'左辺の かっこを はずす。かっこの前の「−」は、中の 全部の 符号を 変える。',row:E('<(左辺)>','-3[x1|-x|o]-1'),arcs:[['m','a1','①'],['m','b1','②']],why:'−(x+1) は「x と 1 を まるごと ひく」こと。だから −x−1 になる。'},
   {do:'x に −4 を かっこを つけて 入れる',row:E('','-3-[s1|(-4)|o]-1'),move:[['x1','s1']]},
   {do:'−(−4) を 計算する',row:E('','-3+4-1'),why:'−(−4)＝＋4'},
   {row:E('','[r1|0|b]'),why:'−3+4＝1、1−1＝0'},
   {do:'右辺を 見る',row:E('<(右辺)>','[r2|1|b]')},
   {row:T('左辺 0 と 右辺 1 → [w|ちがう！|r]'),why:'左辺＝右辺 が 成り立たない。だから −4 は 解ではない。'}],
  ans:'×　−4 は 解ではない',ex:'−(x+1) が −x−1 に なるのは なぜ？'},
 {t:'ウ　{x+4/5}={1/3}x',q:'x=-4 は {x+4/5}={1/3}x の 解かな？',
  start:[E('{[x1|x|o]+4/5}','{1/3}[x2|x|o]')],
  steps:[
   {do:'左辺の x に −4 を 入れる',row:E('<(左辺)>','{[s1|(-4)|o]+4/5}'),move:[['x1','s1']]},
   {do:'分子（上の段）を 先に 計算する',row:E('','{0/5}'),why:'−4+4＝0'},
   {row:E('','[r1|0|b]'),why:'0 を 5 で わっても 0'},
   {do:'右辺の x に −4 を 入れる',row:E('<(右辺)>','{1/3}*[s2|(-4)|o]'),move:[['x2','s2']],why:'{1/3}x は「{1/3}×x」のこと。'},
   {row:E('','[r2|-{4/3}|b]'),why:'プラス×マイナス → マイナス。1×4＝4 なので −{4/3}'},
   {row:T('左辺 0 と 右辺 -{4/3} → [w|ちがう！|r]'),why:'だから −4 は 解ではない。'}],
  ans:'×　−4 は 解ではない',ex:'分数の式に 代入するとき、どこから 計算する？'},
 {t:'エ　3x+10=2+x',q:'x=-4 は 3x+10=2+x の 解かな？',
  start:[E('3[x1|x|o]+10','2+[x2|x|o]')],
  steps:[
   {do:'左辺の x に −4 を 入れる',row:E('<(左辺)>','3*[s1|(-4)|o]+10'),move:[['x1','s1']],why:'3x は「3×x」。x の ところに −4 を 入れると 3×(−4)'},
   {row:E('','-12+10'),why:'3×(−4)＝−12'},
   {row:E('','[r1|-2|b]')},
   {do:'右辺の x に −4 を 入れる',row:E('<(右辺)>','2+[s2|(-4)|o]'),move:[['x2','s2']]},
   {row:E('','2-4'),why:'+(−4) は −4'},
   {row:E('','[r2|-2|b]')},
   {row:T('左辺 -2 と 右辺 -2 → [g|同じ！|g]'),why:'だから −4 は 解。'}],
  ans:'○　−4 は 解<br><span style="font-size:16px">ア〜エ で 解なのは <b>ア と エ</b></span>',ex:'3x に −4 を 代入すると、なぜ 3×(−4) に なるの？'}
 ]},
{no:'3-2',name:'等式の性質',
 point:['A＝B のとき、両辺に 同じことを しても ＝ は くずれない（天びんと同じ）。',
        '① 両辺に 同じ数を <b>たす</b>　② 同じ数を <b>ひく</b>　③ 同じ数を <b>かける</b>　④ 同じ数で <b>わる</b>（0以外）　⑤ 左と右を <b>入れかえる</b>',
        '方程式を解く ＝「x＝○」の形に すること。',
        '途中の式は ＝ を 縦に そろえて 書く。',
        '🎬 動画「方程式① 等式の性質」も 見よう。'],
 probs:[
 {t:'(1) 変形ア・イ・ウ',q:'{3x-1/2}=-5 を 下のように 解いた。ア・イ・ウ では ①〜⑤ の どれを 使った？',
  start:[E('{3x-1/2}','-5')],
  steps:[
   {do:'【ア】左辺の 分数（÷2）を なくしたい。どうする？',row:E('{3x-1/[c1|2|]}*[m1|2|p]','-5*[m2|2|p]'),cancel:[['c1',''],['m1','']],why:'両辺に 2 を かけた。両方に 同じことを しているので ＝ は くずれない。'},
   {row:E('3x-1','-10'),why:'→ <b>ア は ③</b>（両辺に 同じ数を かける）'},
   {do:'【イ】左辺の −1 を なくしたい。どうする？',row:E('3x[k1|-1|][p1|+1|p]','-10[p2|+1|p]'),cancel:[['k1','0'],['p1','']],why:'両辺に 1 を たした。−1+1＝0 で 消える。'},
   {row:E('3x','-9'),why:'→ <b>イ は ①</b>（両辺に 同じ数を たす）'},
   {do:'【ウ】x の前の 3 を なくしたい。どうする？',row:E('{3x/[q1|3|p]}','{-9/[q2|3|p]}'),why:'両辺を 3 で わった。'},
   {row:E('x','-3'),why:'→ <b>ウ は ④</b>（両辺を 同じ数で わる）'}],
  ans:'ア ③　イ ①　ウ ④',ex:'「両辺に」同じことを しないと いけないのは なぜ？'},
 {t:'(2)① x-5=4',q:'等式の性質を使って 解こう：x-5=4',
  start:[E('x[k|-5|r]','4')],
  steps:[
   {do:'x の となりの −5 を 消したい。−5 は +5 すると 0 → 両辺に 5 を たす。',row:E('x[k2|-5|][p1|+5|p]','4[p2|+5|p]'),cancel:[['k2','0'],['p1','']],why:'左だけに +5 すると つり合いが くずれる。だから 右にも +5。'},
   {row:E('x','[g|9|g]'),why:'左は −5+5＝0 で x だけ。右は 4+5＝9'}],
  ans:'x＝9',ex:'なぜ 右辺にも +5 するの？'},
 {t:'(2)② 10+x=-5',q:'等式の性質を使って 解こう：10+x=-5',
  start:[E('[a|10|r]+x','-5')],
  steps:[
   {do:'10 を 消したい → 両辺から 10 を ひく',row:E('[a2|10|]+x[b|-10|p]','-5[c|-10|p]'),cancel:[['a2','0'],['b','']],why:'10−10＝0 で 左は x だけ。右からも 10 を ひく。'},
   {row:E('x','[g|-15|g]'),why:'−5−10：マイナス5 から さらに 10 さがるので −15'}],
  ans:'x＝−15',ex:'−5−10 が −15 に なるのは なぜ？ 数直線で 説明しよう。'},
 {t:'(2)③ {x/3}=-2',q:'等式の性質を使って 解こう：{x/3}=-2',
  start:[E('{x/[d0|3|r]}','-2')],
  steps:[
   {do:'分母の 3 を 消したい → 両辺に 3 を かける',row:E('{x/[d|3|]}*[m|3|p]','-2*[n|3|p]'),cancel:[['d',''],['m','']],why:'÷3 と ×3 で 元に もどる。'},
   {row:E('x','[g|-6|g]'),why:'−2×3＝−6'}],
  ans:'x＝−6',ex:'{x/3} の 3 を 消すのに、なぜ 3 を かけるの？'},
 {t:'(2)④ 7x=-56',q:'等式の性質を使って 解こう：7x=-56',
  start:[E('[c|7|r]x','-56')],
  steps:[
   {do:'x の前の 7 を 消したい。7x は 7×x → 両辺を 7 で わる',row:E('{7x/[d|7|p]}','{-56/[e|7|p]}'),why:'かけ算で くっついている数は、わり算で 消す。'},
   {row:E('x','[g|-8|g]'),why:'−56÷7＝−8（マイナス÷プラス → マイナス）'}],
  ans:'x＝−8',ex:'7x の 7 を 消すのに、ひき算ではなく わり算を 使うのは なぜ？'}
 ]},
{no:'3-3',name:'方程式の解き方（移項）',
 point:['項を ＝ の 反対側へ 移すと <b>符号が 変わる</b>。これを <b>移項</b> という。（例）x+4＝7 → x＝7−4',
        '解く手順：❶ 文字の項は 左辺、数の項は 右辺へ 移項 → ❷ 計算して □x＝○ → ❸ x の係数が マイナスなら 両辺の符号を変える → ❹ 両辺を x の係数で わる',
        '🎬 動画「方程式② 移項」も 見よう。'],
 probs:[
 {t:'(1) x-8=3',q:'解こう：x-8=3',
  start:[E('x[m|-8|r]','3')],
  steps:[
   {do:'数の項 −8 を 右辺へ 移項する（＝を こえたら 符号を 変える）',row:E('x','3[t|+8|r]'),move:[['m','t']],why:'−8 が ＝ を こえて +8 に 変身。両辺に 8 を たしたのと 同じこと。'},
   {row:E('x','[g|11|g]'),why:'3+8＝11。答えも「x＝」の形で 書く。'}],
  ans:'x＝11',ex:'移項すると 符号が 変わるのは なぜ？'},
 {t:'(2) 4x-6=22',q:'解こう：4x-6=22　<span class="badge" style="background:#e2557a">よくあるまちがい</span>',

const board=$('#board'),main=$('#main');
let P=null,stages=[],cur=-1,rowSteps=[],svg=null,arcsDone=[],timers=[],arcKeys=new Set();
function later(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id}
function finishAnims(){timers.forEach(clearTimeout);timers=[];
  board.querySelectorAll('.fly').forEach(e=>e.remove());
  board.querySelectorAll('.t').forEach(e=>{if(e.style.visibility==='hidden')e.style.visibility='visible'});
  board.querySelectorAll('.cx').forEach(e=>e.classList.add('done'));
  if(svg)svg.getAnimations&&svg.querySelectorAll('path,text').forEach(n=>n.getAnimations().forEach(a=>a.finish()));}

function homeRender(){
  let h=`<h1>中1数学 方程式</h1><div class="sub">くわしい 解説（3-1〜3-7 Warm Up）</div>
  <label class="mode"><input type="checkbox" id="think" ${think?'checked':''}><span><b>考えてから 見る モード</b>（おすすめ）<br><span style="font-size:13px;color:#7a7a85">「つぎに やること」を 見て、ノートに 書いてから 式を 見る</span></span></label>`;
  UNITS.forEach(u=>{
    h+=`<div class="unit"><h2><span class="no">${u.no}</span>${u.name}</h2>
    <details><summary>ポイント</summary><ul>${u.point.map(x=>`<li>${M2(x)}</li>`).join('')}</ul></details><div class="plist">`;
    u.probs.forEach(p=>{const i=ALL.indexOf(p);
      h+=`<button class="pbtn ${p.star?'star':''}" data-i="${i}"><span class="lbl">${M(p.t)}</span>${p.star?'<span class="badge">★チャレンジ</span>':''}<span class="chk">${doneSet[p.id]?'✔':''}</span></button>`});
    h+=`</div></div>`});
  h+=`<div class="sub" style="margin-top:16px">★チャレンジ は 平均点より 上を ねらう問題</div>`;
  $('#home').innerHTML=h;
  $('#think').onchange=e=>{think=e.target.checked;try{localStorage.setItem('hk_think',think?'1':'0')}catch(_){}}
  document.querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>openProb(ALL[+b.dataset.i]));
}
/* text with HTML tags allowed + math letters: only convert {a/b} fractions; keep tags */
function M2(s){return s.replace(/\{([^{}]*?)\/([^{}]*?)\}/g,(m,a,b)=>`<span class="fr"><span class="nu">${a}</span><span class="de">${b}</span></span>`)}
/* text with fractions and HTML kept (why / do texts) */
function MT(s){if(!s)return'';return s.split(/(<[^>]+>)/).map(seg=>seg.startsWith('<')?seg:Mtext(seg)).join('')}
function Mtext(s){let out='';for(let i=0;i<s.length;){const ch=s[i];
  if(ch==='{'){const j=closeIdx(s,i,'{','}');const p=splitTop(s.slice(i+1,j),'/');out+=`<span class="fr"><span class="nu">${Mtext(p[0])}</span><span class="de">${Mtext(p[1]||'')}</span></span>`;i=j+1;continue}
  if(ch==='x'||ch==='a'){out+=`<i>${ch}</i>`;i++;continue}
  if(ch==='-'){out+='−';i++;continue}
  out+=esc(ch);i++}return out}

function openProb(p){
  P=p;stages=[];P.steps.forEach((s,i)=>{if(think&&s.do)stages.push({i,k:'plan'});stages.push({i,k:'res'})});stages.push({k:'end'});
  arcKeys=new Set();P.steps.forEach(s=>(s.arcs||[]).forEach(a=>{arcKeys.add(a[0]);arcKeys.add(a[1])}));
  cur=-1;$('#home').style.display='none';$('#view').style.display='flex';
  $('#ttl').innerHTML=`${P.unit.no}　${M(P.t)}`;
  $('#q').innerHTML=`<div class="qt">問題</div>${MT(P.q)}`;
  renderStatic();main.scrollTop=0;
}
function goHome(){$('#view').style.display='none';$('#home').style.display='block';homeRender()}

function rowEl(r){const d=document.createElement('div');
  if(r.H!=null){d.className='row tx';d.innerHTML=r.H}
  else if(r.T!=null){d.className='row tx';d.innerHTML=M(r.T)}
  else{d.className='row e';const L=r.L.startsWith('<')&&r.L.endsWith('>')?`<span class="lab">${esc2(r.L.slice(1,-1))}</span>`:M(r.L);
    d.innerHTML=`<div class="cl"><span class="in">${L}</span></div><div class="cq">${r.eq||'＝'}</div><div class="cr"><span class="in">${M(r.R)}</span></div>`;
    if([...d.querySelectorAll('[data-k]')].some(e=>arcKeys.has(e.dataset.k)))d.classList.add('arcrow')}
  return d}
function esc2(s){return s.replace(/[<>&]/g,esc)}

function baseFs(){return Math.max(20,Math.min(32,window.innerWidth/14))}
function fit(){
  const B=board,base=baseFs();B.style.setProperty('--fs',base+'px');B.style.setProperty('--lw','auto');B.style.setProperty('--rw','auto');
  let lw=0,rw=0;B.querySelectorAll('.row.e').forEach(r=>{lw=Math.max(lw,r.querySelector('.cl .in').getBoundingClientRect().width);rw=Math.max(rw,r.querySelector('.cr .in').getBoundingClientRect().width)});
  const avail=B.clientWidth-20;let total=lw+rw+base*1.3;
  // keep "=" near the centre: use symmetric widths when there is room
  let L=lw,R=rw;const sym=Math.max(lw,rw);if(sym*2+base*1.3<=avail){L=sym;R=sym}
  if(total>avail){const s=Math.max(.45,avail/total);B.style.setProperty('--fs',(base*s)+'px');L=lw*s;R=rw*s}
  B.style.setProperty('--lw',Math.ceil(L+3)+'px');B.style.setProperty('--rw',Math.ceil(R+3)+'px');
}
function findLast(k,exclude){const els=[...board.querySelectorAll(`[data-k="${k}"]`)].filter(e=>!exclude||!exclude.contains(e));return els[els.length-1]}

function ensureSvg(){svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.id='arcs';
  svg.innerHTML='<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a3fd1"/></marker></defs>';
  board.appendChild(svg)}
function drawArcs(newOnes){
  if(!svg)return;[...svg.querySelectorAll('.arc')].forEach(e=>e.remove());
  svg.setAttribute('height',board.scrollHeight);
  const B=board.getBoundingClientRect();
  const all=arcsDone;
  all.forEach((a,idx)=>{const s=findLast(a[0]),t=findLast(a[1]);if(!s||!t)return;
    const r1=s.getBoundingClientRect(),r2=t.getBoundingClientRect();
    const x1=r1.left+r1.width/2-B.left,y1=r1.top-B.top+2,x2=r2.left+r2.width/2-B.left,y2=r2.top-B.top+2;
    const h=9+Math.abs(x2-x1)*0.07;const top=Math.min(y1,y2)-h;const mx=(x1+x2)/2;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','arc');
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M${x1},${y1} Q${mx},${top-h} ${x2},${y2}`);p.setAttribute('fill','none');p.setAttribute('stroke','#8a3fd1');p.setAttribute('stroke-width','2.5');p.setAttribute('marker-end','url(#ah)');
    const tx=document.createElementNS('http://www.w3.org/2000/svg','text');tx.setAttribute('x',mx);tx.setAttribute('y',top-4);tx.setAttribute('text-anchor','middle');tx.setAttribute('font-size','13');tx.setAttribute('font-weight','700');tx.setAttribute('fill','#8a3fd1');tx.textContent=a[2]||'';
    g.appendChild(p);g.appendChild(tx);svg.appendChild(g);
    const isNew=newOnes&&newOnes.includes(a);
    if(isNew){const L=p.getTotalLength();const delay=newOnes.indexOf(a)*650;p.style.strokeDasharray=L;p.style.strokeDashoffset=L;tx.style.opacity=0;
      p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:600,delay,fill:'forwards',easing:'ease-out'});
      tx.animate([{opacity:0},{opacity:1}],{duration:300,delay:delay+450,fill:'forwards'});
      later(()=>{s.classList.remove('pulse');void s.offsetWidth;s.classList.add('pulse');t.classList.remove('pulse');void t.offsetWidth;t.classList.add('pulse')},delay+100)}
  });
}
function applyCancel(rowElm,step,anim){(step.cancel||[]).forEach((c,j)=>{const e=rowElm.querySelector(`[data-k="${c[0]}"]`);if(!e)return;
  if(c[1])e.setAttribute('data-n',c[1]);e.style.setProperty('--d',(anim?0.9+j*0.35:0)+'s');e.classList.add('cx');if(!anim)e.classList.add('done')})}
function fly(src,tgt,delay){
  later(()=>{
    if(!document.body.contains(tgt))return;
    const B=board.getBoundingClientRect(),r1=src.getBoundingClientRect(),r2=tgt.getBoundingClientRect();
    const c=document.createElement('span');c.className='fly '+[...src.classList].filter(x=>x!=='t'&&x!=='pulse').join(' ');
    c.innerHTML=src.innerHTML;c.style.fontSize=getComputedStyle(tgt).fontSize;c.style.left=(r1.left-B.left)+'px';c.style.top=(r1.top-B.top)+'px';board.appendChild(c);
    const dx=r2.left-r1.left,dy=r2.top-r1.top,h=-Math.max(36,Math.abs(dx)*0.28);
    const kf=[0,.15,.3,.45,.6,.75,.9,1].map(u=>({transform:`translate(${dx*u}px,${dy*u+h*Math.sin(Math.PI*u)}px) scale(${1+0.35*Math.sin(Math.PI*u)})`}));
    c.animate(kf,{duration:1500,easing:'ease-in-out',fill:'forwards'});
    src.animate([{opacity:1},{opacity:.25},{opacity:.25},{opacity:1}],{duration:1600});
    later(()=>{c.innerHTML=tgt.innerHTML;c.className='fly '+[...tgt.classList].filter(x=>x!=='t').join(' ')},700);
    later(()=>{tgt.style.visibility='visible';tgt.classList.add('land');c.remove()},1520);
  },delay)}

function renderStatic(){
  timers.forEach(clearTimeout);timers=[];board.innerHTML='';ensureSvg();rowSteps=[];arcsDone=[];
  P.start.forEach(r=>board.appendChild(rowEl(r)));
  for(let s=0;s<=cur;s++){const st=stages[s];if(st.k!=='res')continue;const step=P.steps[st.i];const el=rowEl(step.row);board.appendChild(el);rowSteps.push([el,step]);}
  fit();
  rowSteps.forEach(([el,step])=>{applyCancel(el,step,false);(step.arcs||[]).forEach(a=>arcsDone.push(a))});
  drawArcs();
  if(cur>=0&&stages[cur].k==='plan')pulseFocus(P.steps[stages[cur].i]);
  updateCard();
}
function pulseFocus(step){const ks=[];(step.move||[]).forEach(m=>ks.push(m[0]));(step.arcs||[]).forEach(a=>ks.push(a[0]));
  ks.forEach(k=>{const e=findLast(k);if(e){e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse')}})}

function next(){
  if(cur>=stages.length-1){ // end -> next problem
    const i=ALL.indexOf(P);if(i<ALL.length-1)openProb(ALL[i+1]);else goHome();return}
  finishAnims();drawArcs();cur++;const st=stages[cur];
  if(st.k==='plan'){pulseFocus(P.steps[st.i]);scrollEnd()}
  else if(st.k==='res'){
    const step=P.steps[st.i];const el=rowEl(step.row);el.classList.add('new');board.appendChild(el);rowSteps.push([el,step]);
    fit();
    const tg=(step.move||[]).map(m=>el.querySelector(`[data-k="${m[1]}"]`));tg.forEach(t=>{if(t)t.style.visibility='hidden'});
    const newArcs=(step.arcs||[]).slice();
    drawArcs();scrollEnd();newArcs.forEach(a=>arcsDone.push(a));applyCancel(el,step,true);
    later(()=>{
      (step.move||[]).forEach((m,j)=>{const s=findLast(m[0],el),t=tg[j];if(s&&t)fly(s,t,j*1300);else if(t)t.style.visibility='visible'});
      if(newArcs.length)drawArcs(newArcs);
    },450);
  } else {doneSet[P.id]=1;saveDone()}
  updateCard();scrollEnd();
}
function back(){if(cur<0)return;cur--;renderStatic()}
function scrollEnd(){setTimeout(()=>{main.scrollTo({top:main.scrollHeight,behavior:'smooth'})},60)}

function updateCard(){
  const tag=$('#ctag'),tx=$('#ctext'),nt=$('#cnote'),nx=$('#nx');nx.classList.remove('alt');
  const total=P.steps.length;const done=stages.slice(0,cur+1).filter(s=>s.k==='res').length;
  $('#prog').textContent=`${done} / ${total}`;
  $('#bk').style.visibility=cur<0?'hidden':'visible';
  if(cur<0){tag.textContent='📝 はじめに';tx.innerHTML='まず 問題を ノートに 写そう。';nt.textContent=think?'1つずつ「つぎに やること」が 出るよ。自分で 書いてから 式を 見よう。':'';nx.textContent='スタート ▶';return}
  const st=stages[cur];
  if(st.k==='plan'){const s=P.steps[st.i];tag.textContent='🧭 つぎに やること';tx.innerHTML=MT(s.do);nt.textContent='✏️ ノートに 自分で 書いてから「式を見る」を おそう';nx.textContent='式を見る ▶';return}
  if(st.k==='res'){const s=P.steps[st.i];
    let h='';if(!think&&s.do)h+=`<span class="dob">${MT(s.do)}</span>`;
    if(s.why){tag.textContent=think&&s.do?'💡 なぜ？':'💡 せつめい';h+=MT(s.why)}else{tag.textContent='🔢 計算';h+=h?'':'計算すると こうなる'}
    tx.innerHTML=h;nt.textContent=s.move?'⬆ 動いた 数を よく 見よう':'';nx.textContent=cur===stages.length-2?'まとめ ▶':'つぎへ ▶';return}
  tag.textContent='🎉 できた！';
  tx.innerHTML=`<div class="ansbox">答え　${MT(P.ans)}</div><div class="exbox"><b>🗣 説明してみよう！</b><br>${MT(P.ex)}</div>`;
  nt.textContent='';const i=ALL.indexOf(P);nx.textContent=i<ALL.length-1?'つぎの問題 ▶':'一覧へ';nx.classList.add('alt');
}
$('#nx').onclick=next;$('#bk').onclick=back;$('#homeBtn').onclick=goHome;
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(P&&$('#view').style.display==='flex')renderStatic()},200)});
homeRender();
</script>
</body>
</html>
