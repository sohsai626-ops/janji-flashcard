['U5','k','【キンキ】地方の天気。','近畿'],
['U5','k','武者【シュギョウ】に出る。','修行'],
['U5','p','【音訓強化】人の心を【もてあそぶ】。','弄ぶ'],
['U5','p','【似た字形】非難が【フンキュウ】する。','紛糾','もつれる'],
['U5','p','【似た字形】驚いて【ゼッキョウ】する。','絶叫'],
['U5','p','【似た字形】五【キナイ】の制定。','畿内'],
['U5','p','【似た字形】【キカガク】模様の服。','幾何学','図形に関するすうがくの分野'],
['U5','y','【小唄】の師匠。','こうた'],
['U5','y','【窮屈】に感じる。','きゅうくつ'],
['U5','y','会議が【紛糾】する。','ふんきゅう'],
['U5','y','【愛玩】動物','あいがん'],
['U5','y','人を【愚弄】する。','ぐろう'],
['U5','y','心を【弄ぶ】。','もてあそぶ'],
['U5','y','五代目の【藩主】。','はんしゅ'],
['U5','y','【畿内】に向かう。','きない'],
['U5','y','【入試漢字】【厳か】な鐘の音。','おごそか'],
['U5','y','【入試漢字】参加者を【募る】。','つのる'],
['U5','y','【入試漢字】【顕著】に表れる。','けんちょ'],
['U5','p','【入試漢字】農業を【いとなむ】。','営む'],
['U5','p','【入試漢字】成功に【みちびく】。','導く'],
['U5','p','【入試漢字】楽器を【エンソウ】する。','演奏'],
];
// 先頭の【音訓強化】などはラベル、それ以外の【 】が答える部分
const Q=RAW.map((r,i)=>{
 let t=r[2],label='';
 const m=t.match(/^【(同音異義語|音訓強化|似た字形|入試漢字|新出音訓)】/);
 if(m){label=m[1];t=t.slice(m[0].length)}
 return {id:i,u:r[0],k:r[1],label,t,a:r[3],mean:r[4]||''};
});
</script>
<script>
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(){try{return JSON.parse(localStorage.getItem('kanji3_rank')||'{}')}catch(e){return{}}},set(v){try{localStorage.setItem('kanji3_rank',JSON.stringify(v))}catch(e){}}};
const KN={k:'書き（確認問題）',p:'書き（余白）',y:'読み'};
const sent=q=>q.t.replace(/【(.+?)】/g,'<em>$1</em>');
const plain=q=>q.t.replace(/【(.+?)】/g,'$1');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('show',t.id===b.dataset.t));
 if(b.dataset.t==='miss')renderMiss(); if(b.dataset.t==='rank')renderRank(); window.scrollTo(0,0);
});
const selHTML=n=>UNITS.map(u=>`<label><input type="checkbox" name="${n}" value="${u.id}" checked><span>${u.name}（${Q.filter(q=>q.u===u.id).length}問）<br><span class="pg">${u.pg}</span></span></label>`).join('');
$('#qsel').innerHTML=selHTML('qu');$('#psel').innerHTML=selHTML('pu');
const checked=n=>[...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x=>x.value);
let S=null,sessionMiss=[];
function start(qs){
 if(!qs.length){alert('範囲や種類をえらんでください');return}
 S={qs,i:0,ok:0};sessionMiss=[];
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t==='home'));
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('show',t.id==='home'));
 $('#setup').style.display='none';$('#play').style.display='block';show();
}
$('#go').onclick=()=>{const us=checked('qu'),ks=checked('kd');let qs=Q.filter(q=>us.includes(q.u)&&ks.includes(q.k));if(document.querySelector('input[name="ord"]:checked').value==='shuf')qs=shuffle(qs);start(qs)};
function record(q,ok){if(ok){S.ok++;return}if(!sessionMiss.includes(q))sessionMiss.push(q);const r=store.get();r[q.id]=(r[q.id]||0)+1;store.set(r)}
function show(){
 const q=S.qs[S.i],p=$('#play');p.dataset.done='0';
 const instr=q.k==='y'?'赤い部分の読みを書こう':'赤い部分を漢字に直そう（送りがなも）';
 p.innerHTML=`<div class="card"><div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div>
 <div class="qhead"><span>${UNITS.find(u=>u.id===q.u).name}</span><span>${S.i+1} / ${S.qs.length}</span></div>
 <span class="kind ${q.k}">${q.label||KN[q.k]}</span><div class="note">${instr}</div>
 <div class="qtext">${sent(q)}</div>${q.mean?`<div class="mean">意味：${q.mean}</div>`:''}
 <div id="area"><button class="btn sub" id="reveal">答えを見る</button></div></div>`;
 $('#reveal').onclick=()=>{
  $('#area').innerHTML=`<div class="ansbox">${q.a}<small>${plain(q)}</small></div><div class="two"><button class="btn ok" id="o">⭕ 書けた</button><button class="btn ng" id="x">❌ まちがえた</button></div>`;
  const fin=ok=>{if(p.dataset.done==='1')return;p.dataset.done='1';record(q,ok);S.i++;S.i<S.qs.length?show():result()};
  $('#o').onclick=()=>fin(true);$('#x').onclick=()=>fin(false);
 };
 window.scrollTo(0,0);
}
function result(){
 const n=S.i;
 $('#play').innerHTML=`<div class="card"><h2>結果</h2><div class="score">${S.ok} / ${n}</div>
 <p style="text-align:center;margin:6px 0">${n&&S.ok===n?'🎉 全問正解！すばらしい！':'❌の漢字は、もう一度紙に3回書いてから再チャレンジ！'}</p>
 ${sessionMiss.length?`<button class="btn" id="re">❌の問題だけもう一度（${sessionMiss.length}問）</button>`:''}
 <button class="btn sub" id="bk">範囲えらびにもどる</button></div>`;
 if(sessionMiss.length)$('#re').onclick=()=>start(shuffle(sessionMiss));
 $('#bk').onclick=()=>{$('#play').style.display='none';$('#setup').style.display='block';window.scrollTo(0,0)};
}
function line(q){return `<div>${sent(q)}</div><div class="a">→ ${q.a}</div>`}
function renderMiss(){$('#misslist').innerHTML=sessionMiss.length?sessionMiss.map(q=>`<div class="mist">${line(q)}</div>`).join(''):'<p class="note">まだありません。</p>'}
function rankIds(){const r=store.get();return Object.keys(r).sort((a,b)=>r[b]-r[a])}
function renderRank(){const r=store.get(),ids=rankIds();$('#ranklist').innerHTML=ids.length?ids.slice(0,50).map(id=>`<div class="mist"><span class="n">${r[id]}回</span>${line(Q[id])}</div>`).join(''):'<p class="note">まだ記録がありません。</p>'}
$('#rankgo').onclick=()=>{const ids=rankIds();if(!ids.length){alert('まだ記録がありません');return}start(shuffle(ids.map(id=>Q[id])))};
$('#rankreset').onclick=()=>{if(confirm('苦手の記録をすべて消しますか？')){store.set({});renderRank()}};
$('#pgo').onclick=()=>{
 const us=checked('pu'),ks=checked('pkd');let qs=Q.filter(q=>us.includes(q.u)&&ks.includes(q.k));
 if(!qs.length){alert('範囲や種類をえらんでください');return}
 if($('#pshuf').checked)qs=shuffle(qs);
 let h=`<h1>例文漢字3 確認テスト<span>名前（　　　　　　）　／${qs.length}</span></h1>`,key=[];
 qs.forEach((q,k)=>{h+=`<div class="pq"><div class="t">(${k+1}) ${q.k==='y'?'［読］':''}${sent(q)}</div><div class="l"></div></div>`;key.push(`<div>(${k+1}) ${q.a}</div>`)});
 if($('#pans').checked)h+=`<div class="pans"><h1>解答</h1>${key.join('')}</div>`;
 $('#printArea').innerHTML=h;setTimeout(()=>window.print(),200);
};
</script></body></html>
