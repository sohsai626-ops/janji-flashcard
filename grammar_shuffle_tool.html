// =====================================================================
// UI 初期化
// =====================================================================
const grid = document.getElementById("unitGrid");
UNITS.forEach(u=>{
  const label = document.createElement("label");
  label.className = "unit-item";
  label.innerHTML = `<input type="checkbox" value="${u.id}" checked> ${u.title}（${u.page}）`;
  grid.appendChild(label);
});

function selectAll(flag){
  document.querySelectorAll('#unitGrid input[type=checkbox]').forEach(cb=>cb.checked=flag);
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function shuffleDaimon(daimon){
  // 大問オブジェクトを複製し、中の items（小問）だけシャッフルする
  return { ...daimon, items: shuffleArray(daimon.items) };
}

function renderDaimon(daimon, dNo){
  let html = `<div class="daimon">`;
  html += `<div class="daimon-meta">大問 ${dNo}</div>`;
  html += `<div class="daimon-instruction">${daimon.instruction}</div>`;
  if(daimon.choices){
    html += `<div class="choices">${daimon.choices.join("　")}</div>`;
  }
  html += `<ol class="items">`;
  daimon.items.forEach(it=>{
    html += `<li>`;
    if(it.jp) html += `<div class="jp">${it.jp}</div>`;
    html += `<div class="en">${it.en}${it.blank ? "　"+it.blank : ""}</div>`;
    if(it.answerLine) html += `<div class="en">${it.answerLine}</div>`;
    html += `</li>`;
  });
  html += `</ol></div>`;
  return html;
}

function generate(){
  const selectedIds = Array.from(document.querySelectorAll('#unitGrid input:checked')).map(cb=>cb.value);
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const output = document.getElementById("output");

  if(selectedIds.length === 0){
    output.innerHTML = `<div class="empty-msg">単元を1つ以上選んでください。</div>`;
    return;
  }

  const selectedUnits = UNITS.filter(u=>selectedIds.includes(u.id));
  let html = "";

  if(mode === "all"){
    // 全体でシャッフル：単元の枠を外して全大問をまとめてシャッフル
    let allDaimon = [];
    selectedUnits.forEach(u=>{
      u.daimon.forEach(d=> allDaimon.push(shuffleDaimon(d)));
    });
    allDaimon = shuffleArray(allDaimon);
    html += `<div class="unit-block">`;
    allDaimon.forEach((d,i)=>{ html += renderDaimon(d, i+1); });
    html += `</div>`;
  } else {
    // 単元内でシャッフル：単元ごとにまとめたまま、中の大問順・小問順だけシャッフル
    selectedUnits.forEach(u=>{
      const shuffledDaimon = shuffleArray(u.daimon.map(shuffleDaimon));
      html += `<div class="unit-block">`;
      html += `<div class="unit-block-title">${u.title}（${u.page}）</div>`;
      shuffledDaimon.forEach((d,i)=>{ html += renderDaimon(d, i+1); });
      html += `</div>`;
    });
  }

  output.innerHTML = html;
  output.scrollIntoView({behavior:"smooth"});
}
</script>
