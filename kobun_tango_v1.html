<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>古文単語アプリ（試験範囲版）</title>
<style>
  :root{
    --main:#a6314a;
    --main-dark:#7d2138;
    --bg:#fdf6f2;
    --card:#ffffff;
    --accent:#e8b4b8;
    --text:#3a2c2c;
    --muted:#8a7a7a;
    --good:#4a8c5f;
    --bad:#c0432f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;
  }
  header{
    background:linear-gradient(135deg,var(--main),var(--main-dark));
    color:#fff;padding:14px 10px 0;position:sticky;top:0;z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header h1{margin:0 0 10px;font-size:17px;text-align:center;font-weight:600;letter-spacing:.05em;}
  .tabs{display:flex;}
  .tabbtn{
    flex:1;text-align:center;padding:10px 4px;color:#ffe4e8;
    font-size:13px;cursor:pointer;border-bottom:3px solid transparent;
    transition:.2s;
  }
  .tabbtn.active{color:#fff;border-bottom:3px solid #fff;font-weight:700;}
  .tab{display:none;padding:16px 14px 40px;max-width:520px;margin:0 auto;}
  .tab.show{display:block;}

  /* ===== フラッシュカード ===== */
  .progressbar{font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px;}
  .card{
    background:var(--card);border-radius:16px;padding:36px 20px;
    min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.08);border:1px solid #f0dede;
    position:relative;
  }
  .word{font-size:32px;font-weight:700;color:var(--main-dark);letter-spacing:.03em;text-align:center;}
  .meaning{font-size:20px;margin-top:18px;color:var(--text);text-align:center;line-height:1.5;display:none;}
  .meaning.show{display:block;}
  .hint{font-size:12px;color:var(--muted);margin-top:20px;}
  .speakBtn{
    position:absolute;top:12px;right:12px;background:var(--accent);border:none;
    border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer;color:var(--main-dark);
  }
  .cardnav{display:flex;gap:10px;margin-top:16px;}
  .btn{
    flex:1;padding:13px 0;border-radius:10px;border:none;font-size:15px;font-weight:600;
    cursor:pointer;color:#fff;
  }
  .btn.primary{background:var(--main);}
  .btn.secondary{background:#c9a6a6;}
  .btn.good{background:var(--good);}
  .btn.bad{background:var(--bad);}
  .judgerow{display:flex;gap:10px;margin-top:14px;}
  .judgerow .btn{display:none;}
  .judgerow.show .btn{display:block;}
  .modeRow{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .modeChip{
    padding:6px 12px;border-radius:16px;background:#fff;border:1px solid var(--accent);
    font-size:12px;color:var(--main-dark);cursor:pointer;
  }
  .modeChip.active{background:var(--main);color:#fff;border-color:var(--main);}

  /* ===== 4択 ===== */
  .quizWord{font-size:28px;font-weight:700;text-align:center;color:var(--main-dark);margin:18px 0 22px;}
  .choice{
    background:var(--card);border:2px solid #eee;border-radius:12px;padding:14px 16px;
    margin-bottom:10px;font-size:16px;cursor:pointer;transition:.15s;
  }
  .choice.correct{background:#e5f5e9;border-color:var(--good);}
  .choice.wrong{background:#fbe9e7;border-color:var(--bad);}
  .quizFeedback{text-align:center;font-size:14px;margin-top:10px;min-height:20px;color:var(--muted);}
  .scoreBox{text-align:center;font-size:13px;color:var(--muted);margin-bottom:10px;}

  /* ===== 苦手ランキング ===== */
  .rankItem{
    background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;border:1px solid #f0dede;
  }
  .rankItem .w{font-weight:700;color:var(--main-dark);}
  .rankItem .m{font-size:13px;color:var(--muted);margin-top:2px;}
  .rankItem .stat{font-size:12px;text-align:right;color:var(--bad);white-space:nowrap;}
  .emptyMsg{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;}
  select#rangeSelect{
    width:100%;padding:10px;border-radius:8px;border:1px solid var(--accent);
    font-size:14px;margin-bottom:14px;background:#fff;
  }
</style>
</head>
<body>

<header>
  <h1>古文単語アプリ（試験範囲版）</h1>
  <div class="tabs">
    <div class="tabbtn active" data-tab="tabStudy">フラッシュカード</div>
    <div class="tabbtn" data-tab="tabQuiz">4択問題</div>
    <div class="tabbtn" data-tab="tabRank">苦手ランキング</div>
  </div>
</header>

<div id="tabStudy" class="tab show">
  <div class="modeRow">
    <div class="modeChip active" data-mode="all">すべて(65語)</div>
    <div class="modeChip" data-mode="weak">苦手のみ</div>
  </div>
  <div class="progressbar" id="studyProgress">1 / 65</div>
  <div class="card" id="flashcard">
    <button class="speakBtn" id="speakBtn" title="読み上げ">🔊</button>
    <div class="word" id="cardWord">―</div>
    <div class="meaning" id="cardMeaning">―</div>
    <div class="hint" id="cardHint">タップして意味を表示</div>
  </div>
  <div class="judgerow" id="judgeRow">
    <button class="btn bad" id="markWrong">✗ わからなかった</button>
    <button class="btn good" id="markGood">◯ 覚えている</button>
  </div>
  <div class="cardnav">
    <button class="btn secondary" id="prevBtn">← 前へ</button>
    <button class="btn primary" id="nextBtn">次へ →</button>
  </div>
</div>

<div id="tabQuiz" class="tab">
  <div class="scoreBox" id="quizScore">正解 0 / 0</div>
  <div class="quizWord" id="quizWord">―</div>
  <div id="quizChoices"></div>
  <div class="quizFeedback" id="quizFeedback"></div>
  <button class="btn primary" id="quizNextBtn" style="margin-top:14px;">次の問題へ</button>
</div>

<div id="tabRank" class="tab">
  <div id="rankList"></div>
</div>

<script>
/* ================= データ（P258〜P276 / 65語） ================= */
const WORDS = [
 {no:1,word:"ありつる",meaning:"先程の・例の",group:"past"},
 {no:2,word:"ありし",meaning:"以前の・あの",group:"past"},
 {no:3,word:"ありありて",meaning:"結局",group:"conclusion"},
 {no:4,word:"あらぬ",meaning:"別の",group:"different"},
 {no:5,word:"あなかま",meaning:"ああ、うるさい・静かに",group:"quiet"},
 {no:6,word:"あからめもせず",meaning:"よそ見もしない",group:"attentive"},
 {no:7,word:"あかず（飽かず）",meaning:"満足しない・もの足りない・名残惜しい",group:"satisfaction"},
 {no:8,word:"あれかにもあらず",meaning:"呆然としている",group:"dazed"},
 {no:9,word:"いかがはせむ",meaning:"どうしようもない",group:"helpless"},
 {no:10,word:"いさ知らず",meaning:"さあ、分からない",group:"unknown"},
 {no:11,word:"いざ（させ）給へ",meaning:"さあいらっしゃい",group:"invitation"},
 {no:12,word:"いちのひと（一の人）",meaning:"摂政・関白",group:"title"},
 {no:13,word:"いとしもなし",meaning:"たいしたこともない",group:"trivial"},
 {no:14,word:"いはむかたなし",meaning:"言いようもない",group:"ineffable"},
 {no:15,word:"いふかひなし",meaning:"言ってもかいがない・取るに足りない",group:"worthless"},
 {no:16,word:"（と）いふもおろかなり",meaning:"〜という言葉では言い尽くせない",group:"ineffable"},
 {no:17,word:"いふもさらなり",meaning:"言うまでもない",group:"obvious"},
 {no:18,word:"色に出づ",meaning:"表情に出る",group:"expression"},
 {no:19,word:"寝を寝（いをぬ）",meaning:"寝る",group:"sleep"},
 {no:20,word:"えならず",meaning:"言いようもなくすばらしい",group:"splendid"},
 {no:21,word:"音に聞く",meaning:"噂に聞く",group:"rumor"},
 {no:22,word:"数ならず",meaning:"ものの数ではない・取るに足りない",group:"worthless"},
 {no:23,word:"くるしからず",meaning:"不都合ではない・差し支えない",group:"fine"},
 {no:24,word:"けしきばかり",meaning:"ほんの少し・形ばかり",group:"slight"},
 {no:25,word:"見参に入る",meaning:"お目にかかる",group:"meet"},
 {no:26,word:"こころあり",meaning:"分別がある・風流心がある",group:"thoughtful"},
 {no:27,word:"こころおく",meaning:"気にかける・遠慮する",group:"reserve"},
 {no:28,word:"心の闇",meaning:"心の迷い・分別を失った親心",group:"confusion"},
 {no:29,word:"こころ（を）やる",meaning:"満足する・心を慰める",group:"satisfaction"},
 {no:30,word:"こころゆく",meaning:"気が晴れる・納得する",group:"satisfaction"},
 {no:31,word:"させる",meaning:"たいした（〜ない）",group:"trivial"},
 {no:32,word:"さはれ・さばれ",meaning:"どうとでもなれ・それはそうだがしかし",group:"resign"},
 {no:33,word:"さらでだに",meaning:"そうでなくてさえ",group:"even-so"},
 {no:34,word:"さらぬ（避らぬ）",meaning:"避けられない",group:"unavoidable"},
 {no:35,word:"さらぬ",meaning:"そうではない・それ以外の",group:"different"},
 {no:36,word:"さるべき（ありけむ）",meaning:"そうなるはずの前世からの因縁で",group:"fate"},
 {no:37,word:"さるべき",meaning:"しかるべき・立派な・相当な（身分の）",group:"splendid"},
 {no:38,word:"さるものにて",meaning:"言うまでもないことで・もちろんだが",group:"obvious"},
 {no:39,word:"されば（よ）",meaning:"思ったとおりだ・案の定",group:"as-expected"},
 {no:40,word:"せきあへず",meaning:"我慢できない・こらえきれない",group:"unbearable"},
 {no:41,word:"そのこととなく",meaning:"これということもなく",group:"vague"},
 {no:42,word:"そばめにかく",meaning:"横目で見る・馬鹿にする",group:"mock"},
 {no:43,word:"ただならずなる",meaning:"懐妊する・妊娠する",group:"pregnant"},
 {no:44,word:"力なし",meaning:"どうにもならない",group:"helpless"},
 {no:45,word:"ときしもあれ",meaning:"例の、いつものように",group:"usual"},
 {no:46,word:"ときにあふ",meaning:"時流に乗って栄える・時めいている",group:"prosper"},
 {no:47,word:"ところう（所得）",meaning:"よい地位を得る・いい気になる",group:"prosper"},
 {no:48,word:"とばかり",meaning:"ちょっとの間・しばらく",group:"brief"},
 {no:49,word:"なでふ・なんでふ・何条",meaning:"何と言う・どうして",group:"question"},
 {no:50,word:"名に（し）負ふ",meaning:"名前を持つ・有名である",group:"famous"},
 {no:51,word:"何（に）か（は）せむ",meaning:"いったい何になろうか",group:"rhetorical"},
 {no:52,word:"〜のがり",meaning:"〜のもとへ",group:"direction"},
 {no:53,word:"〜ばこそあらめ",meaning:"実際はそうではない",group:"different"},
 {no:54,word:"人となる",meaning:"一人前になる・成人する",group:"grow"},
 {no:55,word:"ひとやりならず",meaning:"自分のせいである",group:"self-blame"},
 {no:56,word:"またの",meaning:"次の",group:"next"},
 {no:57,word:"〜ままに",meaning:"〜すると（するや）すぐに／〜につれて",group:"immediate"},
 {no:58,word:"昔の人",meaning:"亡くなった人・昔の知人",group:"past"},
 {no:59,word:"目もあやなり",meaning:"まぶしいほど立派だ",group:"splendid"},
 {no:60,word:"やおそきと",meaning:"とすぐに",group:"immediate"},
 {no:61,word:"やらん",meaning:"〜であろうか",group:"conjecture"},
 {no:62,word:"やるかたなし",meaning:"晴らしようがない・どうしようもない",group:"helpless"},
 {no:63,word:"世にあり",meaning:"世間で評判が高い",group:"famous"},
 {no:64,word:"例ならず",meaning:"いつもとは違う・病気（懐妊）である",group:"pregnant"},
 {no:65,word:"例の",meaning:"いつものように",group:"usual"}
];

/* ================= 進捗データ（localStorage） ================= */
const STORAGE_KEY = "kobunTangoProgress_v1";
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {stats:{}}; // stats[no] = {right:0, wrong:0}
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}
let progress = loadProgress();
function getStat(no){
  if(!progress.stats[no]) progress.stats[no] = {right:0, wrong:0};
  return progress.stats[no];
}
function bumpStat(no, isRight){
  const s = getStat(no);
  if(isRight) s.right++; else s.wrong++;
  saveProgress(progress);
}
function isWeak(no){
  const s = getStat(no);
  return s.wrong > s.right;
}

/* ================= タブ切り替え ================= */
document.querySelectorAll(".tabbtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tabbtn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("show"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("show");
    if(btn.dataset.tab === "tabRank") renderRank();
    if(btn.dataset.tab === "tabQuiz") newQuiz();
  });
});

/* ================= フラッシュカード ================= */
let studyMode = "all"; // all | weak
let studyList = WORDS.slice();
let studyIdx = 0;
let revealed = false;

function refreshStudyList(){
  studyList = studyMode === "weak" ? WORDS.filter(w=>isWeak(w.no)) : WORDS.slice();
  studyIdx = 0;
  renderCard();
}

document.querySelectorAll(".modeChip").forEach(chip=>{
  chip.addEventListener("click", ()=>{
    document.querySelectorAll(".modeChip").forEach(c=>c.classList.remove("active"));
    chip.classList.add("active");
    studyMode = chip.dataset.mode;
    refreshStudyList();
  });
});

function renderCard(){
  const total = studyList.length;
  const progEl = document.getElementById("studyProgress");
  if(total === 0){
    document.getElementById("cardWord").textContent = "🎉";
    document.getElementById("cardMeaning").textContent = "苦手な単語はありません";
    document.getElementById("cardMeaning").classList.add("show");
    document.getElementById("cardHint").textContent = "";
    progEl.textContent = "0 / 0";
    document.getElementById("judgeRow").classList.remove("show");
    return;
  }
  if(studyIdx >= total) studyIdx = 0;
  if(studyIdx < 0) studyIdx = total - 1;
  const w = studyList[studyIdx];
  progEl.textContent = (studyIdx+1) + " / " + total;
  document.getElementById("cardWord").textContent = w.word;
  document.getElementById("cardMeaning").textContent = w.meaning;
  document.getElementById("cardMeaning").classList.remove("show");
  document.getElementById("cardHint").textContent = "タップして意味を表示";
  document.getElementById("judgeRow").classList.remove("show");
  revealed = false;
}

document.getElementById("flashcard").addEventListener("click",(e)=>{
  if(e.target.id === "speakBtn") return;
  revealed = !revealed;
  document.getElementById("cardMeaning").classList.toggle("show", revealed);
  document.getElementById("cardHint").textContent = revealed ? "" : "タップして意味を表示";
  document.getElementById("judgeRow").classList.toggle("show", revealed);
});

document.getElementById("nextBtn").addEventListener("click", ()=>{
  studyIdx++;
  renderCard();
});
document.getElementById("prevBtn").addEventListener("click", ()=>{
  studyIdx--;
  renderCard();
});
document.getElementById("markGood").addEventListener("click", ()=>{
  const w = studyList[studyIdx];
  if(w) bumpStat(w.no, true);
  studyIdx++;
  renderCard();
});
document.getElementById("markWrong").addEventListener("click", ()=>{
  const w = studyList[studyIdx];
  if(w) bumpStat(w.no, false);
  studyIdx++;
  renderCard();
});

document.getElementById("speakBtn").addEventListener("click",(e)=>{
  e.stopPropagation();
  const w = studyList[studyIdx];
  if(!w) return;
  speakJa(w.word.replace(/[（(].*?[）)]/g,""));
});

function speakJa(text){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= 4択問題 ================= */
let quizCorrect = 0, quizTotal = 0;
let currentQuizWord = null;

function pickDistractors(word){
  const sameGroup = WORDS.filter(w=>w.no!==word.no && w.group===word.group);
  const others = WORDS.filter(w=>w.no!==word.no && w.group!==word.group);
  shuffle(sameGroup); shuffle(others);
  const pool = sameGroup.concat(others);
  return pool.slice(0,3);
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function newQuiz(){
  document.getElementById("quizFeedback").textContent = "";
  document.getElementById("quizScore").textContent = "正解 " + quizCorrect + " / " + quizTotal;
  const w = WORDS[Math.floor(Math.random()*WORDS.length)];
  currentQuizWord = w;
  document.getElementById("quizWord").textContent = w.word;
  const distractors = pickDistractors(w);
  const choices = shuffle([w, ...distractors]);
  const box = document.getElementById("quizChoices");
  box.innerHTML = "";
  choices.forEach(c=>{
    const div = document.createElement("div");
    div.className = "choice";
    div.textContent = c.meaning;
    div.addEventListener("click", ()=>handleAnswer(div, c, w));
    box.appendChild(div);
  });
}

function handleAnswer(el, chosen, correctWord){
  if(el.classList.contains("correct") || el.classList.contains("wrong")) return; // 二重回答防止
  const isRight = chosen.no === correctWord.no;
  quizTotal++;
  if(isRight){
    quizCorrect++;
    el.classList.add("correct");
    document.getElementById("quizFeedback").textContent = "◯ 正解！";
  }else{
    el.classList.add("wrong");
    document.getElementById("quizFeedback").textContent = "✗ 不正解。正解は「" + correctWord.meaning + "」";
    document.querySelectorAll(".choice").forEach(c=>{
      if(c.textContent === correctWord.meaning) c.classList.add("correct");
    });
  }
  bumpStat(correctWord.no, isRight);
  document.getElementById("quizScore").textContent = "正解 " + quizCorrect + " / " + quizTotal;
}

document.getElementById("quizNextBtn").addEventListener("click", newQuiz);

/* ================= 苦手ランキング ================= */
function renderRank(){
  const list = WORDS
    .map(w=>({w, s:getStat(w.no)}))
    .filter(x=>x.s.wrong>0)
    .sort((a,b)=> (b.s.wrong - b.s.right) - (a.s.wrong - a.s.right));
  const box = document.getElementById("rankList");
  box.innerHTML = "";
  if(list.length === 0){
    box.innerHTML = '<div class="emptyMsg">まだ間違えた単語はありません。<br>フラッシュカードや4択に挑戦してみましょう！</div>';
    return;
  }
  list.forEach(x=>{
    const div = document.createElement("div");
    div.className = "rankItem";
    div.innerHTML =
      '<div><div class="w">'+x.w.word+'</div><div class="m">'+x.w.meaning+'</div></div>'+
      '<div class="stat">正解'+x.s.right+' / 誤答'+x.s.wrong+'</div>';
    box.appendChild(div);
  });
}

/* ================= 初期化 ================= */
renderCard();
</script>
</body>
</html>
