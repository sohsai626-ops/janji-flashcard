['3f','3-55','検察官が起訴しなかったことのよしあしを審査する機関。抽選された国民で構成される。','検察審査会'],

['3g','3-62','地方の政治は、住民の意思に基づき、国から自立して行われるという原則。「民主主義の学校」といわれる。','地方自治'],

['3g','3-65','地域の住民が直接選挙で選んだ議員からなる機関。（都道府県議会・市（区）町村議会）','地方議会'],
['3g','3-66','首長と地方議会の議員という、2種類の代表を住民が直接選ぶ制度。','二元代表制'],

['3h','3-73','特定の事業を行うために国から支給される財源。','国庫支出金'],
['3h','3-74','複数の市町村がまとまって1つの地方公共団体になる動き。','市町村合併'],
['3h','3-75','地域の重要課題について、住民の意思を明らかにするために行われる投票。','住民投票'],
['3h','3-76','自発的に社会貢献活動を行うこと。','ボランティア'],
['3h','3-77','利益を目的としないで社会貢献活動を行う団体。','NPO','非営利組織'],
];
const Q=RAW.map((r,i)=>({id:i,u:r[0],no:r[1],q:r[2],a:r[3],alt:r[4]||''}));
</script>
<script>
const $=s=>document.querySelector(s);
const uName=id=>{const u=UNITS.find(x=>x.id===id);return u.name};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ansText=q=>q.a+(q.alt?`<small>（${q.alt} でもOK）</small>`:'');
const store={get(){try{return JSON.parse(localStorage.getItem('koumin_kiso_rank')||'{}')}catch(e){return{}}},set(v){try{localStorage.setItem('koumin_kiso_rank',JSON.stringify(v))}catch(e){}}};

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('show',t.id===b.dataset.t));
 if(b.dataset.t==='miss')renderMiss(); if(b.dataset.t==='rank')renderRank(); window.scrollTo(0,0);
});

function buildSel(el,name){
 let h='';
 [...new Set(UNITS.map(u=>u.g))].forEach(g=>{
  h+=`<div class="gh">${g}<button type="button" data-g="${g}">全部はずす</button></div>`;
  UNITS.filter(u=>u.g===g).forEach(u=>{h+=`<label><input type="checkbox" name="${name}" value="${u.id}" data-g="${g}" checked><span>${u.name}（${Q.filter(q=>q.u===u.id).length}問）<br><span class="pg">${u.pg}</span></span></label>`});
 });
 el.innerHTML=h;
 el.querySelectorAll('.gh button').forEach(b=>b.onclick=()=>{
  const bs=el.querySelectorAll(`input[data-g="${b.dataset.g}"]`);const all=[...bs].every(x=>x.checked);
  bs.forEach(x=>x.checked=!all);b.textContent=all?'全部えらぶ':'全部はずす';
 });
}
buildSel($('#qsel'),'qu');buildSel($('#psel'),'pu');
const picked=n=>[...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x=>x.value);
const radio=n=>document.querySelector(`input[name="${n}"]:checked`).value;

let S=null,sessionMiss=[];
function start(qs,mode){
 if(!qs.length){alert('範囲をえらんでください');return}
 S={qs,i:0,ok:0,mode};sessionMiss=[];
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t==='home'));
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('show',t.id==='home'));
 $('#setup').style.display='none';$('#play').style.display='block';show();
}
$('#go').onclick=()=>{let qs=Q.filter(q=>picked('qu').includes(q.u));if(radio('ord')==='shuf')qs=shuffle(qs);start(qs,radio('mode'))};

function record(q,ok){if(ok){S.ok++;return}if(!sessionMiss.includes(q))sessionMiss.push(q);const r=store.get();r[q.id]=(r[q.id]||0)+1;store.set(r)}
function head(){const q=S.qs[S.i];return `<div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div><div class="qhead"><span>${q.no}　${uName(q.u)}</span><span>${S.i+1} / ${S.qs.length}</span></div>`}
function nextBtns(){return `<button class="btn" id="nx">${S.i+1<S.qs.length?'次の問題へ':'結果を見る'}</button><button class="btn ghost" id="qt">やめる</button>`}
function bindNext(){$('#nx').onclick=()=>{S.i++;S.i<S.qs.length?show():result()};$('#qt').onclick=result}
function show(){
 const q=S.qs[S.i],p=$('#play');p.dataset.done='0';
 if(S.mode==='card'){
  p.innerHTML=`<div class="card">${head()}<div class="qtext">${q.q}</div><div id="area"><button class="btn sub" id="reveal">答えを見る</button></div></div>`;
  $('#reveal').onclick=()=>{
   $('#area').innerHTML=`<div class="ansbox">${ansText(q)}</div><p class="note" style="text-align:center">言えた？書けた？</p><div class="two"><button class="btn ok" id="o">⭕ できた</button><button class="btn ng" id="x">❌ できなかった</button></div>`;
   const fin=ok=>{if(p.dataset.done==='1')return;p.dataset.done='1';record(q,ok);S.i++;S.i<S.qs.length?show():result()};
   $('#o').onclick=()=>fin(true);$('#x').onclick=()=>fin(false);
  };
 }else{
  const same=Q.filter(x=>x.id!==q.id&&x.a!==q.a&&x.u[0]===q.u[0]);
  const near=shuffle(same.filter(x=>x.u===q.u));const far=shuffle(same.filter(x=>x.u!==q.u));
  const ds=[];[...near,...far].forEach(x=>{if(ds.length<3&&!ds.includes(x.a))ds.push(x.a)});
  const ch=shuffle([q.a,...ds]);
  p.innerHTML=`<div class="card">${head()}<div class="qtext">${q.q}</div>${ch.map(c=>`<button class="choice">${c}</button>`).join('')}<div id="fb"></div></div>`;
  p.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
   if(p.dataset.done==='1')return;p.dataset.done='1';const ok=b.textContent===q.a;record(q,ok);
   p.querySelectorAll('.choice').forEach(x=>{if(x.textContent===q.a)x.classList.add('ok')});if(!ok)b.classList.add('ng');
   $('#fb').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><b>${ok?'⭕ 正解！':'❌ 正解は「'+q.a+'」'}</b>${q.alt?`<br>（${q.alt} とも言う）`:''}</div>${nextBtns()}`;bindNext();
  });
 }
 window.scrollTo(0,0);
}
function result(){
 const tot=S.i+(S.mode==='mc'&&$('#play').dataset.done==='1'&&S.i<S.qs.length?1:0);const n=Math.min(tot,S.qs.length);
 $('#play').innerHTML=`<div class="card"><h2>結果</h2><div class="score">${S.ok} / ${n}</div>
 <p style="text-align:center;margin:6px 0">${n&&S.ok===n?'🎉 全問正解！すばらしい！':'まちがえた問題を、全問正解するまでくり返そう！'}</p>
 ${sessionMiss.length?`<button class="btn" id="re">❌の問題だけもう一度（${sessionMiss.length}問）</button>`:''}
 <button class="btn sub" id="bk">範囲えらびにもどる</button></div>`;
 if(sessionMiss.length)$('#re').onclick=()=>start(shuffle(sessionMiss),S.mode);
 $('#bk').onclick=()=>{$('#play').style.display='none';$('#setup').style.display='block';window.scrollTo(0,0)};
}
function line(q){return `<div>${q.no}　${q.q}</div><div class="a">→ ${q.a}${q.alt?'（'+q.alt+'）':''}</div>`}
function renderMiss(){$('#misslist').innerHTML=sessionMiss.length?sessionMiss.map(q=>`<div class="mist">${line(q)}</div>`).join(''):'<p class="note">まだありません。</p>'}
function rankIds(){const r=store.get();return Object.keys(r).sort((a,b)=>r[b]-r[a])}
function renderRank(){const r=store.get(),ids=rankIds();$('#ranklist').innerHTML=ids.length?ids.slice(0,40).map(id=>`<div class="mist"><span class="n">${r[id]}回</span>${line(Q[id])}</div>`).join(''):'<p class="note">まだ記録がありません。</p>'}
$('#rankgo').onclick=()=>{const ids=rankIds();if(!ids.length){alert('まだ記録がありません');return}start(shuffle(ids.map(id=>Q[id])),'card')};
$('#rankreset').onclick=()=>{if(confirm('苦手の記録をすべて消しますか？')){store.set({});renderRank()}};

$('#pgo').onclick=()=>{
 let qs=Q.filter(q=>picked('pu').includes(q.u));if(!qs.length){alert('範囲をえらんでください');return}
 const shuf=radio('pord')==='shuf';if(shuf)qs=shuffle(qs);
 let h=`<h1>公民 基本用語チェック<span>名前（　　　　　　　　）　　／${qs.length}</span></h1>`,last=null,key=[];
 qs.forEach((q,k)=>{
  if(!shuf&&q.u!==last){h+=`<div class="ps">${uName(q.u)}</div>`;last=q.u}
  h+=`<div class="pq"><div class="t">(${k+1}) ${q.q}</div><div class="l"></div></div>`;
  key.push(`<div class="pq"><div class="t">(${k+1}) ${q.a}${q.alt?'（'+q.alt+'）':''}</div></div>`);
 });
 if($('#pans').checked)h+=`<div class="pans"><h1>解答</h1>${key.join('')}</div>`;
 $('#printArea').innerHTML=h;setTimeout(()=>window.print(),200);
};
</script></body></html>
