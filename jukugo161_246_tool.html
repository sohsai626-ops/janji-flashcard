<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英熟語並べ替えクイズ（161〜246番）</title>
<style>
  :root{
    --main:#2f6f5e;
    --main-dark:#1f4e42;
    --bg:#f4faf7;
    --card:#ffffff;
    --accent:#bfe3d4;
    --text:#233;
    --muted:#7a8a86;
    --good:#2f8c4a;
    --bad:#c0432f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  header{background:linear-gradient(135deg,var(--main),var(--main-dark));color:#fff;padding:14px 10px 0;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  header h1{margin:0 0 10px;font-size:16px;text-align:center;font-weight:700;}
  .tabs{display:flex;}
  .tabbtn{flex:1;text-align:center;padding:10px 4px;color:#dff3ea;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;}
  .tabbtn.active{color:#fff;border-bottom:3px solid #fff;font-weight:700;}
  .tab{display:none;padding:16px 14px 40px;max-width:560px;margin:0 auto;}
  .tab.show{display:block;}

  .progressbar{font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px;}
  .meaningCard{background:var(--card);border-radius:14px;padding:16px;text-align:center;margin-bottom:14px;border:1px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .idiomTag{display:inline-block;background:var(--main);color:#fff;font-size:12px;padding:3px 10px;border-radius:12px;margin-bottom:8px;}
  .meaningText{font-size:17px;font-weight:600;color:var(--main-dark);}
  .hintNote{font-size:12px;color:var(--muted);margin-top:6px;}

  .answerArea{
    min-height:70px;background:var(--card);border:2px dashed var(--accent);border-radius:12px;
    padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-bottom:14px;
  }
  .poolArea{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:44px;}
  .wordChip{
    background:#fff;border:2px solid var(--accent);border-radius:8px;padding:8px 12px;
    font-size:15px;cursor:pointer;user-select:none;transition:.12s;
  }
  .wordChip:active{transform:scale(.96);}
  .answerArea .wordChip{background:var(--accent);border-color:var(--main);}
  .actionRow{display:flex;gap:10px;margin-bottom:10px;}
  .btn{flex:1;padding:13px 0;border-radius:10px;border:none;font-size:15px;font-weight:700;cursor:pointer;color:#fff;}
  .btn.primary{background:var(--main);}
  .btn.secondary{background:#9db8ae;}
  .btn.next{background:var(--main-dark);display:none;}
  .btn.next.show{display:block;}
  .feedback{text-align:center;font-size:15px;margin:8px 0;min-height:22px;font-weight:700;}
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}
  .correctSentence{text-align:center;font-size:14px;color:var(--muted);margin-top:6px;}

  .rankItem{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--accent);}
  .rankItem .w{font-weight:700;color:var(--main-dark);}
  .rankItem .m{font-size:13px;color:var(--muted);margin-top:2px;}
  .rankItem .stat{font-size:12px;text-align:right;color:var(--bad);white-space:nowrap;}
  .emptyMsg{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;}
</style>
</head>
<body>

<header>
  <h1>英熟語並べ替えクイズ（161〜246番）</h1>
  <div class="tabs">
    <div class="tabbtn active" data-tab="tabQuiz">並べ替えクイズ</div>
    <div class="tabbtn" data-tab="tabRank">苦手ランキング</div>
  </div>
</header>

<div id="tabQuiz" class="tab show">
  <div class="progressbar" id="progressLabel">1 / 68</div>
  <div class="meaningCard">
    <div class="idiomTag" id="idiomTag">―</div>
    <div class="meaningText" id="meaningText">―</div>
    <div class="hintNote">この熟語を使った英文を、下の単語を並べ替えて完成させましょう</div>
  </div>

  <div class="answerArea" id="answerArea"></div>
  <div class="poolArea" id="poolArea"></div>

  <div class="actionRow">
    <button class="btn secondary" id="resetBtn">リセット</button>
    <button class="btn primary" id="checkBtn">確認する</button>
  </div>
  <div class="feedback" id="feedback"></div>
  <div class="correctSentence" id="correctSentence"></div>
  <button class="btn next" id="nextBtn">次の問題へ →</button>
</div>

<div id="tabRank" class="tab">
  <div id="rankList"></div>
</div>

<script>
/* ================= データ（161〜246番 / 68語・オリジナル例文） ================= */
const ITEMS = [
 {no:161,idiom:"so far",meaning:"今のところ・これまでのところ",sentence:"So far, everything has gone well."},
 {no:162,idiom:"sooner or later",meaning:"遅かれ早かれ",sentence:"You will find out the truth sooner or later."},
 {no:163,idiom:"these days",meaning:"近ごろ・最近",sentence:"More people work from home these days."},
 {no:164,idiom:"according to",meaning:"〜によれば",sentence:"According to the report, it will rain tomorrow."},
 {no:166,idiom:"thanks to",meaning:"〜のおかげで",sentence:"Thanks to your help, I finished the project on time."},
 {no:168,idiom:"all over",meaning:"〜のいたるところで",sentence:"News of the accident spread all over the town."},
 {no:169,idiom:"apart from",meaning:"〜は別として・〜を除いて",sentence:"Apart from a few mistakes, the essay was well written."},
 {no:170,idiom:"aside from",meaning:"〜は別として",sentence:"Aside from the price, the car is perfect."},
 {no:171,idiom:"ahead of",meaning:"〜より先に",sentence:"She arrived ahead of the other guests."},
 {no:172,idiom:"in search of",meaning:"〜を探して",sentence:"They traveled to the mountains in search of a rare bird."},
 {no:173,idiom:"in preparation for",meaning:"〜の準備として",sentence:"We cleaned the classroom in preparation for the festival."},
 {no:174,idiom:"each other",meaning:"お互いに",sentence:"The two friends helped each other with their homework."},
 {no:175,idiom:"so that",meaning:"〜するために",sentence:"He studied hard so that he could pass the exam."},
 {no:176,idiom:"A as well as B",meaning:"BだけでなくAも",sentence:"She speaks French as well as English."},
 {no:177,idiom:"not only A but also B",meaning:"AだけでなくBも",sentence:"He is not only smart but also kind."},
 {no:178,idiom:"as if (though)",meaning:"まるで〜であるかのように",sentence:"She talked as if she knew everything about the plan."},
 {no:179,idiom:"as soon as",meaning:"〜するとすぐに",sentence:"Call me as soon as you arrive at the station."},
 {no:180,idiom:"Something is wrong with ~",meaning:"〜はどこかおかしい",sentence:"Something is wrong with my computer."},
 {no:181,idiom:"bring up",meaning:"育てる・話題に出す",sentence:"She was brought up by her grandparents."},
 {no:184,idiom:"come about",meaning:"起こる・生じる",sentence:"How did this problem come about?"},
 {no:185,idiom:"come by",meaning:"手に入れる",sentence:"It is hard to come by fresh vegetables in winter."},
 {no:190,idiom:"hand in ~",meaning:"提出する",sentence:"Please hand in your homework by Friday."},
 {no:191,idiom:"learn ~ by heart",meaning:"暗記する",sentence:"The students learned the poem by heart."},
 {no:192,idiom:"look into ~",meaning:"調査する",sentence:"The police decided to look into the matter."},
 {no:193,idiom:"look over ~",meaning:"ざっと目を通す",sentence:"Could you look over my report before I submit it?"},
 {no:194,idiom:"pass away",meaning:"亡くなる",sentence:"Her grandfather passed away last winter."},
 {no:195,idiom:"put off ~",meaning:"延期する",sentence:"We had to put off the trip because of the storm."},
 {no:196,idiom:"put together",meaning:"組み立てる・まとめる",sentence:"It took an hour to put the furniture together."},
 {no:197,idiom:"put up",meaning:"掲示する",sentence:"They put up posters all over the school."},
 {no:198,idiom:"put up with ~",meaning:"我慢する",sentence:"I can't put up with this noise any longer."},
 {no:199,idiom:"set about ~",meaning:"取り掛かる",sentence:"She set about cleaning the whole house."},
 {no:200,idiom:"set in",meaning:"（季節などが）始まる",sentence:"Winter set in earlier than usual this year."},
 {no:201,idiom:"take after ~",meaning:"似ている",sentence:"He takes after his father in many ways."},
 {no:202,idiom:"of importance",meaning:"重要な",sentence:"This is a matter of great importance."},
 {no:203,idiom:"along with",meaning:"〜と一緒に",sentence:"He sent a card along with a small gift."},
 {no:204,idiom:"in connection with ~",meaning:"〜に関連して",sentence:"The police questioned him in connection with the robbery."},
 {no:205,idiom:"on board",meaning:"乗船して・搭乗して",sentence:"All passengers were on board before the ship left."},
 {no:206,idiom:"prior to ~",meaning:"〜より前に",sentence:"Please arrive prior to the start of the ceremony."},
 {no:207,idiom:"(every) once in a while",meaning:"時々",sentence:"We meet for lunch once in a while."},
 {no:208,idiom:"above all (else)",meaning:"何よりも",sentence:"Above all, stay calm during the exam."},
 {no:209,idiom:"all of a sudden",meaning:"突然",sentence:"All of a sudden, the lights went out."},
 {no:210,idiom:"all (just) the same",meaning:"それでもやはり",sentence:"It was raining, but we went out all the same."},
 {no:211,idiom:"as a (general) rule",meaning:"一般的に",sentence:"As a rule, the shop closes at nine."},
 {no:212,idiom:"as well",meaning:"〜も・同様に",sentence:"She can play the piano, and she can sing as well."},
 {no:214,idiom:"by degrees",meaning:"徐々に",sentence:"The pain disappeared by degrees."},
 {no:215,idiom:"for good",meaning:"永久に",sentence:"He left his hometown for good."},
 {no:216,idiom:"for the most part",meaning:"大部分は",sentence:"The book, for the most part, is easy to read."},
 {no:217,idiom:"from time to time",meaning:"時々",sentence:"We visit our grandparents from time to time."},
 {no:218,idiom:"in advance",meaning:"前もって",sentence:"You should book the tickets in advance."},
 {no:219,idiom:"in all",meaning:"全部で",sentence:"There were fifty students in all."},
 {no:220,idiom:"in particular",meaning:"特に",sentence:"I enjoyed the trip, this beach in particular."},
 {no:221,idiom:"on occasion(s)",meaning:"時折",sentence:"He visits his parents on occasion."},
 {no:222,idiom:"on purpose",meaning:"わざと",sentence:"She didn't break the vase on purpose."},
 {no:224,idiom:"right away",meaning:"すぐに",sentence:"Please call the doctor right away."},
 {no:226,idiom:"agree with ~",meaning:"（人・意見）に同意する",sentence:"I agree with your opinion on this matter."},
 {no:227,idiom:"apply for ~",meaning:"〜に応募する",sentence:"She applied for a new job last week."},
 {no:228,idiom:"apply to ~",meaning:"〜に当てはまる",sentence:"This rule applies to all students."},
 {no:229,idiom:"remember doing",meaning:"〜したことを覚えている",sentence:"I remember meeting him at the party."},
 {no:230,idiom:"remember to do",meaning:"忘れずに〜する",sentence:"Remember to lock the door before you leave."},
 {no:234,idiom:"leave alone",meaning:"放っておく",sentence:"Please leave the cat alone."},
 {no:235,idiom:"let alone",meaning:"まして〜ない",sentence:"He can't even swim, let alone dive."},
 {no:237,idiom:"correspond with ~",meaning:"一致する",sentence:"His story doesn't correspond with the facts."},
 {no:238,idiom:"hit on (upon) ~",meaning:"ふと思いつく",sentence:"She hit on a great idea for the festival."},
 {no:239,idiom:"occur to ~",meaning:"（考えが）ふと浮かぶ",sentence:"It occurred to me that I had forgotten my keys."},
 {no:240,idiom:"draw on ~",meaning:"〜を利用する・頼る",sentence:"The writer drew on her own experience for the novel."},
 {no:243,idiom:"lay off ~",meaning:"一時解雇する",sentence:"The company had to lay off many workers."},
 {no:244,idiom:"lay out ~",meaning:"配置する・計画を立てる",sentence:"The garden was laid out in a beautiful pattern."},
 {no:246,idiom:"be concerned with (in) ~",meaning:"〜に関係している",sentence:"This report is concerned with climate change."}
];

/* ================= 進捗データ（localStorage） ================= */
const STORAGE_KEY = "jukugo161246Progress_v1";
function loadProgress(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {stats:{}};
}
function saveProgress(p){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){} }
let progress = loadProgress();
function getStat(no){ if(!progress.stats[no]) progress.stats[no] = {right:0, wrong:0}; return progress.stats[no]; }
function bumpStat(no, isRight){ const s = getStat(no); if(isRight) s.right++; else s.wrong++; saveProgress(progress); }

/* ================= タブ切り替え ================= */
document.querySelectorAll(".tabbtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tabbtn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("show"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("show");
    if(btn.dataset.tab === "tabRank") renderRank();
  });
});

/* ================= クイズロジック ================= */
let order = shuffle(ITEMS.map((_,i)=>i));
let qIdx = 0;
let currentWords = [];
let answerWords = [];
let checked = false;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function splitSentence(sentence){
  return sentence.split(" ");
}

function renderQuestion(){
  checked = false;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("correctSentence").textContent = "";
  document.getElementById("nextBtn").classList.remove("show");
  document.getElementById("checkBtn").style.display = "block";

  const total = ITEMS.length;
  document.getElementById("progressLabel").textContent = (qIdx+1) + " / " + total;

  const item = ITEMS[order[qIdx]];
  document.getElementById("idiomTag").textContent = "No." + item.no + "  " + item.idiom;
  document.getElementById("meaningText").textContent = item.meaning;

  currentWords = shuffle(splitSentence(item.sentence).map((w,i)=>({id:i+"_"+Math.random(), text:w})));
  answerWords = [];
  renderChips();
}

function renderChips(){
  const pool = document.getElementById("poolArea");
  const ans = document.getElementById("answerArea");
  pool.innerHTML = "";
  ans.innerHTML = "";
  currentWords.forEach(w=>{
    const chip = document.createElement("div");
    chip.className = "wordChip";
    chip.textContent = w.text;
    chip.addEventListener("click", ()=>{
      if(checked) return;
      answerWords.push(w);
      currentWords = currentWords.filter(x=>x.id!==w.id);
      renderChips();
    });
    pool.appendChild(chip);
  });
  answerWords.forEach(w=>{
    const chip = document.createElement("div");
    chip.className = "wordChip";
    chip.textContent = w.text;
    chip.addEventListener("click", ()=>{
      if(checked) return;
      currentWords.push(w);
      answerWords = answerWords.filter(x=>x.id!==w.id);
      renderChips();
    });
    ans.appendChild(chip);
  });
}

document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(checked) return;
  const item = ITEMS[order[qIdx]];
  currentWords = shuffle(splitSentence(item.sentence).map((w,i)=>({id:i+"_"+Math.random(), text:w})));
  answerWords = [];
  renderChips();
});

document.getElementById("checkBtn").addEventListener("click", ()=>{
  const item = ITEMS[order[qIdx]];
  const built = answerWords.map(w=>w.text).join(" ");
  const isRight = built === item.sentence;
  checked = true;
  bumpStat(item.no, isRight);
  const fb = document.getElementById("feedback");
  if(isRight){
    fb.textContent = "◯ 正解！";
    fb.className = "feedback good";
  }else{
    fb.textContent = "✗ 不正解";
    fb.className = "feedback bad";
    document.getElementById("correctSentence").textContent = "正しい英文： " + item.sentence;
  }
  document.getElementById("checkBtn").style.display = "none";
  document.getElementById("nextBtn").classList.add("show");
});

document.getElementById("nextBtn").addEventListener("click", ()=>{
  qIdx++;
  if(qIdx >= order.length){
    order = shuffle(ITEMS.map((_,i)=>i));
    qIdx = 0;
  }
  renderQuestion();
});

/* ================= 苦手ランキング ================= */
function renderRank(){
  const list = ITEMS
    .map(it=>({it, s:getStat(it.no)}))
    .filter(x=>x.s.wrong>0)
    .sort((a,b)=> (b.s.wrong - b.s.right) - (a.s.wrong - a.s.right));
  const box = document.getElementById("rankList");
  box.innerHTML = "";
  if(list.length === 0){
    box.innerHTML = '<div class="emptyMsg">まだ間違えた熟語はありません。<br>並べ替えクイズに挑戦してみましょう！</div>';
    return;
  }
  list.forEach(x=>{
    const div = document.createElement("div");
    div.className = "rankItem";
    div.innerHTML =
      '<div><div class="w">No.'+x.it.no+' '+x.it.idiom+'</div><div class="m">'+x.it.meaning+'</div></div>'+
      '<div class="stat">正解'+x.s.right+' / 誤答'+x.s.wrong+'</div>';
    box.appendChild(div);
  });
}

/* ================= 初期化 ================= */
renderQuestion();
</script>
</body>
</html>
