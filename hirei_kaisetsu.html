<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中1数学 比例・反比例 くわしい解説</title>
<style>
:root{--fs:26px;--lw:auto;--rw:auto;--bg:#fcfaf4;--ink:#28282f;--grey:#7a7a85;--red:#d63a3a;--blue:#2f6fd6;--org:#e08a1e;--pur:#8a3fd1;--grn:#14915a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",Meiryo,sans-serif}
button{font-family:inherit}
i{font-family:"Times New Roman",Times,serif;font-style:italic;font-weight:normal;padding:0 .04em}
.op{margin:0 .1em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.82em;margin:0 .12em;line-height:1.12}
.fr .nu{border-bottom:2px solid currentColor;padding:0 .2em .05em}
.fr .de{padding:.05em .2em 0}
.r{color:var(--red)}.b{color:var(--blue)}.o{color:var(--org)}.p{color:var(--pur)}
.g{color:var(--grn);font-weight:700;border-bottom:3px solid var(--grn);padding:0 .1em}
.t{display:inline-flex;align-items:center;position:relative;border-radius:6px}
/* ---------- home ---------- */
#home{height:100%;overflow-y:auto;padding:18px 14px 40px}
h1{font-size:24px;margin:6px 0 2px;text-align:center}
.sub{color:var(--grey);text-align:center;font-size:14px;margin-bottom:14px}
.mode{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #e6dfcc;border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:15px}
.mode input{width:24px;height:24px;accent-color:var(--grn)}
.unit{background:#fff;border:2px solid #eadfca;border-radius:16px;padding:12px;margin-bottom:12px}
.unit h2{font-size:19px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.unit h2 .no{background:#e2557a;color:#fff;border-radius:8px;padding:2px 8px;font-size:15px}
details{margin:4px 0 10px;background:#fff7e6;border-radius:10px;padding:8px 10px;font-size:15px;line-height:1.7}
summary{font-weight:700;color:#b5651d;cursor:pointer}
details ul{margin:6px 0 0;padding-left:1.1em}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{flex:1 1 calc(50% - 8px);min-width:140px;border:2px solid #cfd9ee;background:#f4f7fd;border-radius:12px;padding:10px 8px;font-size:16px;text-align:left;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pbtn.star{border-color:#f0c35a;background:#fff8e2}
.pbtn .lbl{font-weight:700}
.pbtn .chk{margin-left:auto;color:var(--grn);font-weight:700}
.badge{font-size:11px;background:#f0b429;color:#fff;border-radius:6px;padding:1px 5px}
/* ---------- problem view ---------- */
#view{display:none;height:100%;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-bottom:2px solid #eee4cf}
#top button{border:none;background:#efe8d8;border-radius:10px;padding:8px 10px;font-size:15px}
#ttl{font-weight:700;font-size:16px;flex:1;line-height:1.3}
#prog{font-size:13px;color:var(--grey);white-space:nowrap}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#q{margin:10px 10px 0;background:#fff;border:2px solid #e6dfcc;border-radius:14px;padding:10px 12px;font-size:17px;line-height:1.8}
#q .qt{font-size:13px;color:var(--grey)}
#board{position:relative;padding:6px 8px 26px;font-size:var(--fs);min-height:120px}
#arcs{position:absolute;left:0;top:0;width:100%;pointer-events:none;overflow:visible;z-index:3}
.row{animation:none}
.row.e{display:flex;justify-content:center;align-items:center;padding-top:.62em;line-height:1.3}
.row.e.arcrow{padding-top:1.5em}
.row .cl{width:var(--lw);text-align:right;flex:none}
.row .cq{width:1.3em;text-align:center;flex:none}
.row .cr{width:var(--rw);text-align:left;flex:none}
.in{white-space:nowrap;display:inline-flex;align-items:center}
.row .cl .lab{font-size:.62em;color:var(--grey)}
.row.tx{padding:.6em .3em 0;text-align:center;font-size:.8em;line-height:1.6}
.row.new{animation:rowin .6s ease-out}
@keyframes rowin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.1s ease-in-out 3;}
@keyframes pulse{0%,100%{background:transparent;box-shadow:none}50%{background:#ffe680;box-shadow:0 0 0 4px #ffe680}}
.land{animation:land .5s ease-out}
@keyframes land{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.fly{position:absolute;z-index:6;pointer-events:none;white-space:nowrap;display:inline-flex;align-items:center;background:#fffbe0;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.18);padding:0 .1em;font-weight:700}
.cx::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;border-top:3px solid var(--red);transform:rotate(-35deg) scaleX(0);animation:slash .45s ease-out forwards;animation-delay:var(--d,0s)}
.cx.done::after{animation:none;transform:rotate(-35deg) scaleX(1)}
@keyframes slash{to{transform:rotate(-35deg) scaleX(1)}}
.cx[data-n]::before{content:attr(data-n);position:absolute;right:-.62em;top:-.75em;font-size:.62em;color:var(--red);font-weight:700;opacity:0;animation:fadein .3s forwards;animation-delay:calc(var(--d,0s) + .4s)}
.cx.done[data-n]::before{animation:none;opacity:1}
@keyframes fadein{to{opacity:1}}
.dia{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:nowrap;font-size:.95em}
.dia .bx2{border:2px solid #555;border-radius:6px;padding:4px 6px;text-align:center;line-height:1.3;min-width:3.6em;background:#fff}
.dia .bx2 b{font-size:1.05em}
.dia .ar{font-size:1.2em;color:var(--pur);text-align:center;line-height:1.1}
.dia .ar small{display:block;font-size:.55em}

#fig{position:sticky;top:0;z-index:4;background:var(--bg);display:none;justify-content:center;padding:8px 0 6px;border-bottom:2px dashed #e6dcc4}
#fig svg{display:block;overflow:visible}
.ftb{border-collapse:collapse;background:#fff;font-size:19px}
.ftb th,.ftb td{border:1.5px solid #555;min-width:46px;height:44px;text-align:center;padding:0 4px}
.ftb th{background:#f3efe4}
.ftb td.pop{animation:cellpop .6s both}
@keyframes cellpop{0%{transform:scale(.2);opacity:0;background:#ffe680}60%{transform:scale(1.25);opacity:1;background:#ffe680}100%{transform:scale(1);background:#fff}}
.row.tx .ftb{margin:0 auto;font-size:.95em}
.sv-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:svdraw 1s ease-in-out forwards}
@keyframes svdraw{to{stroke-dashoffset:0}}
.sv-pop{transform-box:fill-box;transform-origin:center;animation:svpop .5s ease-out both}
@keyframes svpop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.8);opacity:1}100%{transform:scale(1)}}
.sv-fade{animation:svfade .7s ease-out both}
@keyframes svfade{from{opacity:0}to{opacity:1}}

.bx{outline:2px solid currentColor;outline-offset:1px;border-radius:4px;margin:0 .14em}
.row.c{display:flex;justify-content:center;align-items:center;padding-top:.62em;line-height:1.3}
.row.c .cq{width:1.3em;text-align:center;flex:none}
.row.c .cc{flex:none;text-align:left}
.row.tx .sh{display:inline-block;background:#efe6ff;color:#6b3fb0;border-radius:8px;padding:2px 14px;font-size:.8em;font-weight:700;margin-top:.5em}
#band{position:sticky;top:0;z-index:5;display:none;justify-content:center;gap:8px;padding:6px 6px;background:var(--bg);border-bottom:2px dashed #e6dcc4;font-size:15px;font-weight:700;flex-wrap:wrap}
#band span{border-radius:10px;padding:3px 10px;border:2px solid;white-space:nowrap}
#bL{color:var(--org);border-color:var(--org);background:#fff6e8}
#bR{color:var(--blue);border-color:var(--blue);background:#eef4ff}
.glow{animation:glow 1.6s ease-in-out 1}
@keyframes glow{0%,100%{transform:scale(1);box-shadow:none}35%,65%{transform:scale(1.12);box-shadow:0 0 0 6px #ffe680}}
/* ---------- card ---------- */
#card{background:#fff;border-top:3px solid #e8dcc0;padding:10px 14px 4px;min-height:132px;max-height:42vh;overflow-y:auto}
#ctag{font-size:14px;font-weight:700;color:#b5651d;margin-bottom:4px}
#ctext{font-size:18px;line-height:1.75}
#ctext .dob{font-weight:700;display:block;margin-bottom:4px}
#cnote{font-size:13px;color:var(--grey);margin-top:6px}
.ansbox{background:#eaf7ef;border:2px solid var(--grn);border-radius:12px;padding:6px 10px;margin:4px 0 8px;font-weight:700;font-size:20px;text-align:center}
.exbox{background:#fff6e0;border:2px solid var(--org);border-radius:12px;padding:8px 10px;font-size:16px;line-height:1.7}
.exbox b{color:var(--org)}
#nav{display:flex;gap:10px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:#fff}
#nav button{flex:1;border:none;border-radius:14px;padding:14px 6px;font-size:18px;font-weight:700}
#bk{background:#ece6d8;color:#555;flex:0 0 32% !important}
#nx{background:var(--grn);color:#fff}
#nx.alt{background:#e2557a}
</style>
</head>
<body>
<div id="home"></div>
<div id="view">
  <div id="top"><button id="homeBtn">≡ 一覧</button><div id="ttl"></div><div id="prog"></div></div>
  <div id="main">
    <div id="q"></div>
    <div id="band"><span id="bL">文字の項 → 左辺へ</span><span id="bR">数の項 → 右辺へ</span></div>
    <div id="fig"></div>
    <div id="board"></div>
  </div>
  <div id="card"><div id="ctag"></div><div id="ctext"></div><div id="cnote"></div></div>
  <div id="nav"><button id="bk">◀ もどる</button><button id="nx">スタート ▶</button></div>
</div>
<script>
/* ================= mini math markup =================
   [key|content|class]  -> tagged span      {num/den} -> fraction
   x, a -> italic letters ;  - * + = :  -> math operators            */
function closeIdx(s,i,o,c){let d=0;for(let j=i;j<s.length;j++){if(s[j]===o)d++;else if(s[j]===c){d--;if(!d)return j}}return s.length-1}
function splitTop(s,ch){const out=[];let d=0,cur='';for(const c of s){if(c==='['||c==='{')d++;if(c===']'||c==='}')d--;if(c===ch&&d===0){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
const OPS={'-':'−','*':'×','+':'+','=':'=',':':':','<':'&lt;','>':'&gt;','≦':'≦','≧':'≧'};
function esc(c){return c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c}
function M(s){if(s==null)return'';let out='';for(let i=0;i<s.length;){const ch=s[i];
  if(ch==='['){const j=closeIdx(s,i,'[',']');const p=splitTop(s.slice(i+1,j),'|');out+=`<span class="t ${p[2]||''}" data-k="${p[0]}">${M(p[1]||'')}</span>`;i=j+1;continue}
  if(ch==='{'){const j=closeIdx(s,i,'{','}');const p=splitTop(s.slice(i+1,j),'/');out+=`<span class="fr"><span class="nu">${M(p[0])}</span><span class="de">${M(p[1]||'')}</span></span>`;i=j+1;continue}
  if(ch==='x'||ch==='a'){out+=`<i>${ch}</i>`;i++;continue}
  if(OPS[ch]){out+=`<span class="op">${OPS[ch]}</span>`;i++;continue}
  out+=esc(ch);i++}return out}
const E=(L,R,eq)=>({L,R,eq}), T=s=>({T:s}), Hh=s=>({H:s});

/* ================= data ================= */
const pt=(x,y,lab,c,lo)=>({k:'pt',x,y,lab,c:c||'r',lo});
const mv=(x0,y0,x1,y1,lab,c,ls)=>({k:'mv',x0,y0,x1,y1,lab,c:c||(y0===y1?'b':'r'),ls});
const ln=(a,c,lab,lp,w)=>({k:'line',a,c:c||'r',lab,lp,w});
const hy=(a,c,lab,lp,s,w)=>({k:'hyp',a,c:c||'r',lab,lp,s,w});
const pg=(pts,c,lab,lp)=>({k:'poly',pts,c,lab,lp});
const tx=(x,y,s,c)=>({k:'txt',x,y,s,c:c||'k'});
const CLR={k:'clear'};
const dot=(x,open,c)=>({k:'dot',x,open,c:c||'r'});
const sg=(a,b,c)=>({k:'seg',a,b,c:c||'r'});
const cell=(i,v)=>({k:'cell',i,v});
function tbl(xs,ys){return `<table class="ftb"><tr><th><i>x</i></th>${xs.map(v=>`<td>${M(v)}</td>`).join('')}</tr><tr><th><i>y</i></th>${ys.map(v=>`<td class="b">${M(v)}</td>`).join('')}</tr></table>`}

const UNITS=[
{no:'4-2',name:'変数と変域',
 point:['いろいろな値をとる文字を <b>変数</b>、決まった数を <b>定数</b> という。',
        '変数のとる値の範囲を <b>変域</b> という。不等号で 表す。',
        '「より大きい」x&gt;○、「より小さい（未満）」x&lt;○ → その数は <b>入らない</b>（数直線では ○）',
        '「以上」x≧○、「以下」x≦○ → その数も <b>入る</b>（数直線では ●）',
        '不等号は 大きい方に 口を ひらく。2つあるときは「小さい数 ＜ x ＜ 大きい数」の順。'],
 probs:[
 {t:'(1)① x は 2 より大きい',q:'x の変域を 不等号で 表そう：<b>x は 2 より大きい</b>',fig:{type:'nl',min:-2,max:7},
  steps:[
   {do:'「2 より大きい」に 2 は 入る？ → 入らない → 2 に ○（白丸）',g:[dot(2,1)],why:'○ は「その数は 入らない」しるし。2 は「2 より大きい」とは いえない。'},
   {do:'2 より 大きい方（右がわ）を 太線に する',g:[sg(2,'inf')],why:'数直線は 右へ 行くほど 大きい。'},
   {do:'不等号で 書く。不等号は 大きい方に 口を ひらく',row:T('[g|x > 2|g]'),why:'x の方が 大きいので、x の方に 口（ひらいた方）を 向ける。'}],
  ans:'x＞2',ex:'「2 より大きい」で、2 に ○（白丸）を つけるのは なぜ？'},
 {t:'(1)② x は −5 未満',q:'x の変域を 不等号で 表そう：<b>x は −5 未満</b>',fig:{type:'nl',min:-8,max:2},
  steps:[
   {do:'「未満」は「より小さい」と 同じ。−5 は 入らない → ○',g:[dot(-5,1)]},
   {do:'−5 より 小さい方（左がわ）を 太線に',g:[sg('-inf',-5)],why:'左へ 行くほど 小さい（−6、−7、…）'},
   {do:'不等号で 書く',row:T('[g|x < -5|g]'),why:'−5 の方が 大きいので、−5 の方に 口を ひらく。'}],
  ans:'x＜−5',ex:'「未満」と「以下」は どうちがう？'},
 {t:'(1)③ −4 以上 5 未満',q:'x の変域を 不等号で 表そう：<b>x は −4 以上 5 未満</b>',fig:{type:'nl',min:-6,max:7},
  steps:[
   {do:'「−4 以上」→ −4 も 入る → ●（黒丸）',g:[dot(-4,0)],why:'以上・以下は その数も ふくむ。'},
   {do:'「5 未満」→ 5 は 入らない → ○',g:[dot(5,1)]},
   {do:'あいだを 太線に',g:[sg(-4,5)]},
   {row:T('x ≧ -4　と　x < 5'),why:'「以上」は ≧（下に ＝ が つく）、「未満」は ＜'},
   {do:'「小さい数 → x → 大きい数」の 順に 書いて、間に 不等号',row:T('[g|-4 ≦ x < 5|g]'),why:'数直線と 同じ 並び（左が 小さい、右が 大きい）に なる。'}],
  ans:'−4≦x＜5',ex:'−4 に ●、5 に ○ を つけるのは なぜ？'},
 {t:'(1)④ 2 より大きく 8 以下',q:'x の変域を 不等号で 表そう：<b>x は 2 より大きく 8 以下</b>',fig:{type:'nl',min:0,max:10},
  steps:[
   {do:'「2 より大きい」→ 2 は 入らない → ○',g:[dot(2,1)]},
   {do:'「8 以下」→ 8 も 入る → ●',g:[dot(8,0)]},
   {do:'あいだを 太線に',g:[sg(2,8)]},
   {do:'小さい数 → x → 大きい数 の順に 書く',row:T('[g|2 < x ≦ 8|g]'),why:'2 は 入らないので ＜、8 は 入るので ≦'}],
  ans:'2＜x≦8',ex:'≦ と ＜ の ちがいを 説明しよう。'},
 {t:'(2)① 数直線（−8 と 2）',q:'数直線を 不等号で 表そう（−8 が ○、2 が ●）',fig:{type:'nl',min:-10,max:4,base:[sg(-8,2,'k'),dot(-8,1,'k'),dot(2,0,'k')]},
  steps:[
   {do:'左はしの −8 は ○ → 入らない → ＜',g:[dot(-8,1,'r')],row:T('-8 < x')},
   {do:'右はしの 2 は ● → 入る → ≦',g:[dot(2,0,'r')],row:T('x ≦ 2')},
   {do:'つなげて「小さい数 → x → 大きい数」',row:T('[g|-8 < x ≦ 2|g]')}],
  ans:'−8＜x≦2',ex:'○ と ● を 見て、どうやって 不等号を 決める？'},
 {t:'(2)② 数直線（−4 と 10）',q:'数直線を 不等号で 表そう（−4 が ●、10 が ○）',fig:{type:'nl',min:-6,max:12,base:[sg(-4,10,'k'),dot(-4,0,'k'),dot(10,1,'k')]},
  steps:[
   {do:'左はしの −4 は ● → 入る → ≦',g:[dot(-4,0,'r')],row:T('-4 ≦ x')},
   {do:'右はしの 10 は ○ → 入らない → ＜',g:[dot(10,1,'r')],row:T('x < 10')},
   {do:'つなげる',row:T('[g|-4 ≦ x < 10|g]')}],
  ans:'−4≦x＜10',ex:'この 数直線を ことばで 言うと？（「〜以上〜未満」）'}
 ]},
{no:'4-3',name:'比例と比例の式',
 point:['y＝ax で 表されるとき、y は x に <b>比例</b> する。a を <b>比例定数</b> という。',
        'x が 2倍、3倍 … に なると、y も 2倍、3倍 … に なる。x＝0 のとき y＝0。',
        '式の 求め方：❶ y＝ax と 書く → ❷ x、y の値を 代入 → ❸ a を 求める → ❹ a を y＝ax に 入れる',
        '「y を x の式で 表しなさい」は y＝○ の形で 答える。'],
 probs:[
 {t:'(1)① y=-3x の比例定数',q:'y=-3x の 比例定数を 答えよう。',
  start:[],
  steps:[
   {do:'比例の式は y＝ax。この a が 比例定数',row:E('y','[k|a|p]x')},
   {do:'y＝−3x と くらべる',row:E('y','[c|-3|p]x'),why:'a の ところに ある数が 比例定数。マイナスも わすれずに。'}],
  ans:'−3',ex:'比例定数って、式の どこの 数？'},
 {t:'(1)② y=-3x の表',q:'y=-3x について、表を 完成させよう。',fig:{type:'tbl',xs:['-2','-1','0','1','2'],ys:['','','','','']},
  start:[],
  steps:[
   {do:'−3x は −3×x。× を 書き戻す',row:E('y','-3*[x|x|o bx]')},
   {do:'x＝−2 を かっこを つけて 代入',row:E('y','-3*[s|(-2)|o bx]'),move:[['x','s']]},
   {row:E('','[v|6|b]'),g:[cell(0,'6')],why:'まず 符号を 決める：− が 2個 → +。3×2＝6'},
   {do:'x＝−1 を 代入',row:E('y','-3*(-1) = 3'),g:[cell(1,'3')]},
   {do:'x＝0 を 代入',row:E('y','-3*0 = 0'),g:[cell(2,'0')],why:'0 に 何を かけても 0。比例は いつも x＝0 で y＝0'},
   {do:'x＝1 を 代入',row:E('y','-3*1 = -3'),g:[cell(3,'-3')]},

    c.innerHTML=src.innerHTML;c.style.fontSize=getComputedStyle(tgt).fontSize;c.style.left=(r1.left-B.left)+'px';c.style.top=(r1.top-B.top)+'px';board.appendChild(c);
    const dx=r2.left-r1.left,dy=r2.top-r1.top,h=-Math.max(36,Math.abs(dx)*0.28);
    const kf=[0,.15,.3,.45,.6,.75,.9,1].map(u=>({transform:`translate(${dx*u}px,${dy*u+h*Math.sin(Math.PI*u)}px) scale(${1+0.35*Math.sin(Math.PI*u)})`}));
    c.animate(kf,{duration:1500,easing:'ease-in-out',fill:'forwards'});
    src.animate([{opacity:1},{opacity:.25},{opacity:.25},{opacity:1}],{duration:1600});
    if(P.unit.band){const b=$(/[xa]/.test(src.textContent)?'#bL':'#bR');b.classList.remove('glow');void b.offsetWidth;b.classList.add('glow')}
    later(()=>{c.innerHTML=tgt.innerHTML;c.className='fly '+[...tgt.classList].filter(x=>x!=='t').join(' ')},700);
    later(()=>{tgt.style.visibility='visible';tgt.classList.add('land');c.remove()},1520);
  },delay)}


const COL={r:'#d63a3a',b:'#2f6fd6',g:'#14915a',o:'#e08a1e',p:'#8a3fd1',k:'#28282f',gr:'#a8a29a'};
const FILL={r:'#f6b3b3',b:'#b9d0f5',o:'#f8d39f',p:'#d9c2f2',gr:'#dddad2',g:'#bfe6cf'};
function figActs(){const acts=(P.fig.base||[]).slice();for(let s=0;s<=cur;s++){const st=stages[s];if(st.k==='res'&&P.steps[st.i].g)acts.push(...P.steps[st.i].g)}return acts}
function renderFig(newN){
  const F=$('#fig');if(!P||!P.fig){F.style.display='none';F.innerHTML='';return}
  F.style.display='flex';const f=P.fig;const all=figActs();const first=all.length-(newN||0);
  // resolve clears
  let list=[];all.forEach((a,i)=>{if(a.k==='clear'){list=list.filter(x=>x.a.k!=='mv');return}list.push({a,isNew:i>=first})});
  let d=0;list.forEach(o=>{if(o.isNew){o.delay=d;d+=(o.a.k==='pt'||o.a.k==='dot'||o.a.k==='cell'||o.a.k==='txt')?0.45:1.0}});
  const W=Math.min((main.clientWidth||360)-20,360,f&&f.type==='grid'?Math.max(240,window.innerHeight*0.39):999);
  if(f.type==='tbl'){
    const ys=f.ys.slice();const cls=ys.map(()=>'');list.forEach(o=>{if(o.a.k==='cell'){ys[o.a.i]=o.a.v;cls[o.a.i]=o.isNew?`pop" style="animation-delay:${o.delay}s`:''}});
    F.innerHTML=`<table class="ftb"><tr><th><i>x</i></th>${f.xs.map(v=>`<td>${M(v)}</td>`).join('')}</tr><tr><th><i>y</i></th>${ys.map((v,i)=>`<td class="b ${cls[i]}">${M(v)}</td>`).join('')}</tr></table>`;return}
  const an=(o,kind)=>o.isNew?` class="sv-${kind}" style="animation-delay:${o.delay}s"`:'';
  const lab=(o)=>o.isNew?` class="sv-fade" style="animation-delay:${o.delay+0.6}s"`:'';
  let svg='';
  if(f.type==='nl'){
    const H=86,m=22,X=v=>m+(v-f.min)/(f.max-f.min)*(W-2*m),Y=40;
    svg+=`<line x1="4" y1="${Y}" x2="${W-4}" y2="${Y}" stroke="#555" stroke-width="2"/><path d="M${W-4},${Y} l-9,-5 v10 z" fill="#555"/>`;
    for(let v=f.min;v<=f.max;v++){svg+=`<line x1="${X(v)}" y1="${Y-6}" x2="${X(v)}" y2="${Y+6}" stroke="#555" stroke-width="1.5"/>`;
      if((f.max-f.min)<=14||v%2===0)svg+=`<text x="${X(v)}" y="${Y+24}" font-size="12" text-anchor="middle" fill="#333">${v<0?'−'+(-v):v}</text>`}
    let segs='',dots='';
    list.forEach(o=>{const a=o.a,c=COL[a.c];
      if(a.k==='seg'){const x1=a.a==='-inf'?6:X(a.a),x2=a.b==='inf'?W-8:X(a.b);
        segs+=`<g${an(o,'fade')}><line x1="${x1}" y1="${Y}" x2="${x2}" y2="${Y}" stroke="${c}" stroke-width="7" stroke-linecap="round"/>${a.b==='inf'?`<path d="M${W-2},${Y} l-14,-9 v18 z" fill="${c}"/>`:''}${a.a==='-inf'?`<path d="M2,${Y} l14,-9 v18 z" fill="${c}"/>`:''}</g>`}
      if(a.k==='dot'){dots+=`<circle cx="${X(a.x)}" cy="${Y}" r="8" fill="${a.open?'#fff':c}" stroke="${c}" stroke-width="3"${an(o,'pop')}/>`}});
    F.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${svg}${segs}${dots}</svg>`;return}
  // grid
  const r=f.r,S=W,s=S/(2*r+2),cx=S/2,cy=S/2,X=x=>cx+x*s,Y=y=>cy-y*s,R=r+0.5;
  for(let i=-r;i<=r;i++){svg+=`<line x1="${X(i)}" y1="${Y(R)}" x2="${X(i)}" y2="${Y(-R)}" stroke="#e1dbcd" stroke-width="1"/><line x1="${X(-R)}" y1="${Y(i)}" x2="${X(R)}" y2="${Y(i)}" stroke="#e1dbcd" stroke-width="1"/>`}
  svg+=`<line x1="${X(-R-.3)}" y1="${cy}" x2="${X(R+.4)}" y2="${cy}" stroke="#444" stroke-width="1.6"/><path d="M${X(R+.6)},${cy} l-8,-4 v8 z" fill="#444"/>`;
  svg+=`<line x1="${cx}" y1="${Y(-R-.3)}" x2="${cx}" y2="${Y(R+.4)}" stroke="#444" stroke-width="1.6"/><path d="M${cx},${Y(R+.6)} l-4,8 h8 z" fill="#444"/>`;
  svg+=`<text x="${X(R+.6)}" y="${cy+14}" font-size="13" font-style="italic" font-family="Times New Roman,serif">x</text><text x="${cx+7}" y="${Y(R+.4)}" font-size="13" font-style="italic" font-family="Times New Roman,serif">y</text><text x="${cx-11}" y="${cy+12}" font-size="11">O</text>`;
  const st=r<=6?1:5;for(let i=-r;i<=r;i++){if(i===0||i%st)continue;const t=i<0?'−'+(-i):i;
    svg+=`<text x="${X(i)}" y="${cy+11}" font-size="9" text-anchor="middle" fill="#666">${t}</text><text x="${cx-3}" y="${Y(i)+3}" font-size="9" text-anchor="end" fill="#666">${t}</text>`}
  let clip='',top='';
  list.forEach(o=>{const a=o.a,c=COL[a.c]||a.c;
    if(a.k==='line'){const xe=Math.min(R,R/Math.abs(a.a));clip+=`<line x1="${X(-xe)}" y1="${Y(-a.a*xe)}" x2="${X(xe)}" y2="${Y(a.a*xe)}" stroke="${c}" stroke-width="${a.w||2.4}" pathLength="1"${an(o,'draw')}/>`;
      if(a.lab){const lp=a.lp||[xe*0.9,a.a*xe*0.9];top+=`<text x="${X(lp[0])}" y="${Y(lp[1])}" font-size="11" font-weight="700" fill="${c}" text-anchor="middle"${lab(o)}>${a.lab}</text>`}}
    if(a.k==='hyp'){const brs=a.s?[a.s]:[1,-1];let dd='';brs.forEach(sgn=>{const xmin=Math.abs(a.a)/R;let p='';for(let k=0;k<=60;k++){const xx=sgn*Math.exp(Math.log(xmin)+(Math.log(R)-Math.log(xmin))*k/60);p+=(k?'L':'M')+X(xx).toFixed(1)+','+Y(a.a/xx).toFixed(1)}dd+=p});
      clip+=`<path d="${dd}" fill="none" stroke="${c}" stroke-width="${a.w||2.4}" pathLength="1"${an(o,'draw')}/>`;
      if(a.lab){const lp=a.lp;top+=`<text x="${X(lp[0])}" y="${Y(lp[1])}" font-size="11" font-weight="700" fill="${c}" text-anchor="middle"${lab(o)}>${a.lab}</text>`}}
    if(a.k==='poly'){clip+=`<polygon points="${a.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="${FILL[a.c]||'#eee'}" fill-opacity="${a.c==='gr'?0.55:0.6}" stroke="${COL[a.c]}" stroke-width="1.6"${an(o,'fade')}/>`;
      if(a.lab)top+=`<text x="${X(a.lp[0])}" y="${Y(a.lp[1])+5}" font-size="14" font-weight="700" fill="${COL[a.c]}" text-anchor="middle"${lab(o)}>${a.lab}</text>`}
    if(a.k==='mv'){const hor=a.y0===a.y1;{const x0=X(a.x0),y0=Y(a.y0),x1=X(a.x1),y1=Y(a.y1),L=Math.hypot(x1-x0,y1-y0)||1,ux=(x1-x0)/L,uy=(y1-y0)/L,bx=x1-ux*10,by=y1-uy*10;
        top+=`<line x1="${x0}" y1="${y0}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="3.4" pathLength="1"${an(o,'draw')}/><polygon points="${x1},${y1} ${bx-uy*6},${by+ux*6} ${bx+uy*6},${by-ux*6}" fill="${c}"${o.isNew?` class="sv-fade" style="animation-delay:${o.delay+0.85}s"`:''}/>`;}
      if(a.lab){const mx=X((a.x0+a.x1)/2),my=Y((a.y0+a.y1)/2);const ls=a.ls||(hor?'d':'r');const dx=ls==='r'?6:ls==='l'?-6:0,dy=ls==='d'?14:ls==='u'?-6:4;
        top+=`<text x="${mx+dx}" y="${my+dy}" font-size="11.5" font-weight="700" fill="${c}" text-anchor="${ls==='r'?'start':ls==='l'?'end':'middle'}" paint-order="stroke" stroke="#fcfaf4" stroke-width="3"${lab(o)}>${a.lab}</text>`}}
    if(a.k==='pt'){top+=`<circle cx="${X(a.x)}" cy="${Y(a.y)}" r="4.6" fill="${c}"${an(o,'pop')}/>`;
      if(a.lab){const lo=a.lo||[6,-6];top+=`<text x="${X(a.x)+lo[0]}" y="${Y(a.y)+lo[1]}" font-size="12" font-weight="700" fill="${c}" paint-order="stroke" stroke="#fcfaf4" stroke-width="3"${lab(o)}>${a.lab}</text>`}}
    if(a.k==='txt'){top+=`<text x="${X(a.x)}" y="${Y(a.y)}" font-size="13" font-weight="700" fill="${c}" text-anchor="middle"${an(o,'fade')}>${a.s}</text>`}
  });
  const defs=`<defs><clipPath id="gclip"><rect x="${X(-R)}" y="${Y(R)}" width="${2*R*s}" height="${2*R*s}"/></clipPath>${Object.keys(COL).map(k=>`<marker id="ar_${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${COL[k]}"/></marker>`).join('')}</defs>`;
  F.innerHTML=`<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">${defs}${svg}<g clip-path="url(#gclip)">${clip}</g>${top}</svg>`;
}

function renderStatic(){
  timers.forEach(clearTimeout);timers=[];board.innerHTML='';ensureSvg();rowSteps=[];arcsDone=[];
  (P.start||[]).forEach(r=>board.appendChild(rowEl(r)));
  for(let s=0;s<=cur;s++){const st=stages[s];if(st.k!=='res')continue;const step=P.steps[st.i];if(!step.row)continue;const el=rowEl(step.row);board.appendChild(el);rowSteps.push([el,step]);}
  renderFig(0);
  fit();
  rowSteps.forEach(([el,step])=>{applyCancel(el,step,false);(step.arcs||[]).forEach(a=>arcsDone.push(a))});
  drawArcs();
  if(cur>=0&&stages[cur].k==='plan')pulseFocus(P.steps[stages[cur].i]);
  updateCard();
}
function pulseFocus(step){const ks=[];(step.move||[]).forEach(m=>ks.push(m[0]));(step.arcs||[]).forEach(a=>ks.push(a[0]));
  ks.forEach(k=>{const e=findLast(k);if(e){e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse')}})}

function next(){
  if(cur>=stages.length-1){ // end -> next problem
    const i=ALL.indexOf(P);if(i<ALL.length-1)openProb(ALL[i+1]);else goHome();return}
  finishAnims();drawArcs();cur++;const st=stages[cur];
  if(st.k==='plan'){pulseFocus(P.steps[st.i]);scrollEnd()}
  else if(st.k==='res'){
    const step=P.steps[st.i];if(step.g)renderFig(step.g.length);
    if(!step.row){updateCard();return}
    const el=rowEl(step.row);el.classList.add('new');board.appendChild(el);rowSteps.push([el,step]);
    fit();
    const tg=(step.move||[]).map(m=>el.querySelector(`[data-k="${m[1]}"]`));tg.forEach(t=>{if(t)t.style.visibility='hidden'});
    const newArcs=(step.arcs||[]).slice();
    drawArcs();scrollEnd();newArcs.forEach(a=>arcsDone.push(a));applyCancel(el,step,true);
    later(()=>{
      (step.move||[]).forEach((m,j)=>{const s=findLast(m[0],el),t=tg[j];if(s&&t)fly(s,t,j*1300);else if(t)t.style.visibility='visible'});
      if(newArcs.length)drawArcs(newArcs);
    },450);
  } else {doneSet[P.id]=1;saveDone()}
  updateCard();scrollEnd();
}
function back(){if(cur<0)return;cur--;renderStatic()}
function scrollEnd(){setTimeout(()=>{main.scrollTo({top:main.scrollHeight,behavior:'smooth'})},60)}

function updateCard(){
  const tag=$('#ctag'),tx=$('#ctext'),nt=$('#cnote'),nx=$('#nx');nx.classList.remove('alt');
  const total=P.steps.length;const done=stages.slice(0,cur+1).filter(s=>s.k==='res').length;
  $('#prog').textContent=`${done} / ${total}`;
  $('#bk').style.visibility=cur<0?'hidden':'visible';
  if(cur<0){tag.textContent='📝 はじめに';tx.innerHTML='まず 問題を ノートに 写そう。';nt.textContent=think?'1つずつ「つぎに やること」が 出るよ。自分で 書いてから 式を 見よう。':'';nx.textContent='スタート ▶';return}
  const st=stages[cur];
  if(st.k==='plan'){const s=P.steps[st.i];tag.textContent='🧭 つぎに やること';tx.innerHTML=MT(s.do);nt.textContent='✏️ ノートに 自分で 書いてから「式を見る」を おそう';nx.textContent='式を見る ▶';return}
  if(st.k==='res'){const s=P.steps[st.i];
    let h='';if(!think&&s.do)h+=`<span class="dob">${MT(s.do)}</span>`;
    if(s.why){tag.textContent=think&&s.do?'💡 なぜ？':'💡 せつめい';h+=MT(s.why)}else if(s.g&&!s.row){tag.textContent='👀 図を 見よう';h+=h?'':MT(s.do||'')}else{tag.textContent='🔢 計算';h+=h?'':(think&&s.do?MT(s.do):'計算すると こうなる')}
    tx.innerHTML=h;nt.textContent=s.move?'⬆ 動いた 数を よく 見よう':'';nx.textContent=cur===stages.length-2?'まとめ ▶':'つぎへ ▶';return}
  tag.textContent='🎉 できた！';
  tx.innerHTML=`<div class="ansbox">答え　${MT(P.ans)}</div><div class="exbox"><b>🗣 説明してみよう！</b><br>${MT(P.ex)}</div>`;
  nt.textContent='';const i=ALL.indexOf(P);nx.textContent=i<ALL.length-1?'つぎの問題 ▶':'一覧へ';nx.classList.add('alt');
}
$('#nx').onclick=next;$('#bk').onclick=back;$('#homeBtn').onclick=goHome;
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(P&&$('#view').style.display==='flex')renderStatic()},200)});
homeRender();
</script>
