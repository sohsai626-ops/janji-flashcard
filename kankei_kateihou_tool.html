{u:'R0',type:'mc',q:'We have many things (　　) study.',ja:'私たちには勉強すべきことがたくさんあります。',ch:['for','to','of','that'],a:1,ex:'不定詞（to＋原形）がうしろから説明：many things <b>to study</b>。'},
{u:'R0',type:'mc',q:'The boy (　　) by me is Eddy.',ja:'私のそばに立っている少年はエディです。',ch:['stand','stood','standing','to stand'],a:2,ex:'「〜している」は現在分詞（-ing）：The boy <b>standing</b> by me。'},

{u:'R0',type:'mc',q:'That (　　) cat is so cute.',ja:'眠っているあのネコはとてもかわいい。',ch:['sleep','slept','sleeping','to sleep'],a:2,ex:'<b>1語だけ</b>のときは名詞の<b>前</b>に置く：That <b>sleeping</b> cat（p.71）。'},
{u:'R0',type:'mc',q:'There are many products (　　) in foreign countries.',ja:'外国で作られた製品がたくさんあります。',ch:['make','making','made','to make'],a:2,ex:'「作られた」→ 過去分詞 <b>made</b>（p.82 Round 2 の文）。'},
{u:'R0',type:'mc',q:'This is a picture (　　) my friends.',ja:'これは私の友達の写真です。',ch:['of','on','at','to'],a:0,ex:'a picture <b>of my friends</b>（前置詞＋語句）。'},

{u:'R1',type:'mc',q:'Gandhi is a man (　　) has influenced a lot of people.',ja:'ガンディーは多くの人々に影響を与えてきた人物です。',ch:['which','who','what','he'],a:1,ex:'Key 16。先行詞 a man は「人」→ <b>who</b>。'},
{u:'R1',type:'mc',q:'This is a movie (　　) makes people happy.',ja:'これは人々を幸せにする映画です。',ch:['who','what','which','it'],a:2,ex:'Key 17。先行詞 a movie は「もの」→ <b>which</b>（that でもよい）。'},
{u:'R1',type:'mc',q:'He\'s still respected by people (　　) fight for human rights.',ja:'彼は今でも人権のためにたたかう人々に尊敬されています。',ch:['which','who','they','what'],a:1,ex:'先行詞 people は「人」→ <b>who</b>（本文 p.63）。'},
{u:'R1',type:'mc',q:'Eddy is a classmate (　　) can cook well.',ja:'エディは料理がじょうずなクラスメートです。',ch:['which','he','who','what'],a:2,ex:'先行詞 a classmate は「人」→ <b>who</b>（p.63 Practice）。'},
{u:'R1',type:'mc',q:'This is a school (　　) was built in 2000.',ja:'これは2000年に建てられた学校です。',ch:['who','that','what','where'],a:1,ex:'先行詞 a school は「もの」→ <b>that</b>（which でもよい）。'},
{u:'R1',type:'mc',q:'This is the bus (　　) goes to the hospital.',ja:'これは病院に行くバスです。',ch:['who','which','what','it'],a:1,ex:'先行詞 the bus は「もの」→ <b>which</b>。'},
{u:'R1',type:'mc',q:'There were also hotels (　　) did not accept Indian guests.',ja:'インド人の客を受け入れないホテルもありました。',ch:['who','that','what','they'],a:1,ex:'先行詞 hotels は「もの」→ <b>that</b>（本文 p.64）。'},

{u:'R1',type:'mc',q:'Ms. Chen is a teacher (　　) came from Canada two years ago.',ja:'チェン先生は2年前にカナダから来た先生です。',ch:['which','who','what','she'],a:1,ex:'先行詞 a teacher は「人」→ <b>who</b>（p.63 Practice）。'},

{u:'R2',type:'mc',q:'Many things that we see every day (　　) from overseas.',ja:'私たちが毎日目にする多くのものは海外から来ています。',ch:['comes','come','coming','came from'],a:1,ex:'Key 22。骨組みは Many things … <b>come</b> from overseas. 主語は複数なので s は付けない。'},
{u:'R2',type:'mc',q:'The park that I often visited (　　) changed.',ja:'私がよく訪れた公園は変わってしまった。',ch:['have','has','is','are'],a:1,ex:'骨組みは The park … <b>has</b> changed.（p.83 Practice）'},
{u:'R2',type:'mc',q:'The gifts I brought from Japan (　　) my friends happy.',ja:'私が日本から持ってきたおみやげは友達を喜ばせた。',ch:['makes','made','making','to make'],a:1,ex:'骨組みは The gifts … <b>made</b> my friends happy.'},
{u:'R2',type:'mc',q:'The new zoo that opened last month (　　) popular.',ja:'先月開園した新しい動物園は人気がある。',ch:['are','be','is','were'],a:2,ex:'骨組みは The new zoo … <b>is</b> popular.'},
{u:'R2',type:'mc',q:'The boy who is talking with Ken (　　) my brother.',ja:'ケンと話している少年は私の弟です。',ch:['are','is','be','am'],a:1,ex:'(who is talking with Ken) をカッコに入れる → The boy <b>is</b> my brother.'},
{u:'R2',type:'mc',q:'次の文の「文全体の動詞」はどれ？\nMany products that are sold by Japanese companies are made in other countries.',ja:'',ch:['sold','are（1つ目）','are made（2つ目）','companies'],a:2,ex:'that are sold by Japanese companies は products の説明。骨組みは Many products <b>are made</b> in other countries.'},

{u:'R2',type:'mc',q:'Jun is a boy who (　　) to play soccer.',ja:'純はサッカーをするのが大好きな男の子です。',ch:['love','loves','loving','to love'],a:1,ex:'先行詞 a boy は単数 → <b>loves</b>（p.63 Practice）。'},

{u:'R3',type:'mc',q:'This is a picture (　　) I found on the internet.',ja:'これは私がインターネットで見つけた写真です。',ch:['who','which','what','it'],a:1,ex:'Key 18。うしろが「I found（主語＋動詞）」→ 目的格 <b>which</b>（that でもよい）。'},

{u:'R3',type:'mc',q:'Ms. Chen is a teacher (　　) I respect.',ja:'チェン先生は私が尊敬する先生です。',ch:['which','that','what','she'],a:1,ex:'目的格で先行詞が「人」→ <b>that</b>。which は人には使えません。'},
{u:'R3',type:'mc',q:'関係代名詞を<b>省略できる</b>のはどれ？',ja:'',ch:['Gandhi is a man who has influenced many people.','This is a movie that makes people happy.','This is a picture that my father took.','This is the bus which goes to the hospital.'],a:2,ex:'省略できるのは<b>目的格</b>（すぐうしろが「主語＋動詞」）だけ。This is a picture (that) <b>my father took</b>.'},
{u:'R3',type:'mc',q:'This is a gift my sister (　　) me.',ja:'これは姉がくれたプレゼントです。',ch:['give','gave','giving','given'],a:1,ex:'接触節（which の省略）。a gift (which) my sister <b>gave</b> me（p.62 Practice）。'},

{u:'R3',type:'mc',q:'This is a T-shirt that the students (　　) for Sports Day.',ja:'これは生徒たちが体育祭のためにデザインしたTシャツです。',ch:['design','designed','designing','to design'],a:1,ex:'過去のこと → <b>designed</b>（p.67 Practice）。'},

{u:'R4',type:'tile',ja:'これは私がインターネットで見つけた写真です。',t:['This','is','a picture','I','found','on the internet'],ex:'Key 15。a picture ＋ I found …（which の省略）。'},
{u:'R4',type:'tile',ja:'ガンディーは多くの人々に影響を与えてきた人物です。',t:['Gandhi','is','a man','who','has influenced','a lot of people'],ex:'Key 16。a man ＋ who has influenced …'},
{u:'R4',type:'tile',ja:'これは人々を幸せにする映画です。',t:['This','is','a movie','that','makes','people','happy'],ex:'Key 17。a movie ＋ that makes people happy。'},

{u:'R4',type:'tile',ja:'私のそばに立っている少年はエディです。',t:['The boy','standing','by me','is','Eddy'],ex:'現在分詞の後置修飾：The boy standing by me ＋ is Eddy。'},

const GUIDE = [
{g:'関係代名詞・後置修飾', title:'しくみ：名詞に「うしろから説明」をくっつける（後置修飾）', body:`
<p>日本語は説明が<b>前</b>、英語は説明が<b>うしろ</b>。</p>
<table><tr><th>形</th><th>例（p.70〜71）</th></tr>
<tr><td>前置詞＋語句</td><td>That cat <b>on the bench</b></td></tr>
<tr><td>不定詞</td><td>many things <b>to study</b></td></tr>
<tr><td>現在分詞（〜している）</td><td>The boy <b>standing by me</b></td></tr>
<tr><td>過去分詞（〜された）</td><td>a book <b>written by Soseki</b></td></tr>
<tr><td>関係代名詞</td><td>the boy <b>who came to our house</b></td></tr></table>
<p>⚠️ 分詞が<b>1語だけ</b>なら前に置く：That <b>sleeping</b> cat</p>`},
{g:'関係代名詞・後置修飾', title:'who / which / that の使い分け', body:`
<table><tr><th>先行詞</th><th>主格</th><th>目的格</th></tr>
<tr><td>人</td><td><b>who</b>（that）</td><td><b>that</b>（省略できる）</td></tr>
<tr><td>もの・動物</td><td><b>which</b> / that</td><td><b>which</b> / that（省略できる）</td></tr></table>
<div class="ex">Gandhi is a man <b>who</b> has influenced a lot of people.（Key 16）<br>This is a movie <b>that [which]</b> makes people happy.（Key 17）</div>`},
{g:'関係代名詞・後置修飾', title:'目的格と接触節（Key 15・18）', body:`
<p>関係代名詞のうしろが「<b>主語＋動詞</b>」なら目的格。目的格は<b>省略できる</b>（＝接触節）。</p>
<div class="ex">This is a picture <b>that [which]</b> I found on the internet.（Key 18）<br>＝ This is a picture I found on the internet.（Key 15）</div>
<p>⚠️ which が「それ」の役目なので、<b>it を重ねない</b>。</p>`},
{g:'関係代名詞・後置修飾', title:'いちばん大事：文の動詞を見失わない（Key 22）', body:`
<p>主語に説明がつくと、主語と動詞の間に説明が<b>入り込む</b>。説明の部分をカッコに入れてみよう。</p>
<div class="ex">Many things <span class="paren">(that we see every day)</span> <b>come</b> from overseas.</div>
<p>主語は Many things、文の動詞は <b>come</b>。</p>`},
{g:'仮定法', title:'しくみ：現実とちがうことは「1つ過去」にずらす', body:`
<p>「今」のことでも、<b>現実とちがう</b>願い・想像は<b>過去形</b>で表します。</p>
<div class="ex">現実：I <b>can\'t</b> go to school.<br>仮定法：I wish I <b>could</b> go to school.（Key 19）</div>`},
{g:'仮定法', title:'I wish ～（〜ならいいのに）', body:`
<div class="ex">I wish ＋ 主語 ＋ <b>過去形</b>.<br>I wish ＋ 主語 ＋ <b>could</b> ＋ 動詞の原形.</div>
<div class="ex">I wish I <b>had</b> pens and notebooks.<br>I wish I <b>lived</b> in Hawaii.<br>I wish I <b>were</b> in Hawaii.</div>
<p>be動詞は主語に関係なく <b>were</b> が多い。</p>`},
{g:'仮定法', title:'If ～（もし〜なら、…だろうに）', body:`
<div class="ex">If ＋ 主語 ＋ <b>過去形</b> …, 主語 ＋ <b>would / could</b> ＋ 動詞の原形 ….</div>
<div class="ex">If I <b>were</b> you, I <b>would</b> ask my friends for help.（Key 20）<br>If I <b>had</b> a school backpack, I <b>would</b> donate it.（Key 21）</div>
<p>would ＝〜するだろうに／could ＝〜できるのに</p>`},
{g:'仮定法', title:'可能性がある？ ない？（p.87）', body:`
<table><tr><th></th><th>可能性がある</th><th>可能性がない（仮定法）</th></tr>
<tr><td>if の文</td><td>現在形</td><td>過去形・were</td></tr>
<tr><td>後半</td><td>will / can</td><td>would / could</td></tr></table>
<div class="ex">If it <b>is</b> sunny tomorrow, I <b>will</b> go fishing.<br>If it <b>were</b> sunny today, I <b>would</b> go fishing.</div>`},
];

</script>
<script>
const $=s=>document.querySelector(s);
Q.forEach((q,i)=>q.id=i);
const unitName=id=>UNITS.find(u=>u.id===id).name;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const tileAns=q=>q.t.join(' ')+'.';
const store={get(){try{return JSON.parse(localStorage.getItem('kk_rank')||'{}')}catch(e){return {}}},set(v){try{localStorage.setItem('kk_rank',JSON.stringify(v))}catch(e){}}};

// tabs
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('show',t.id===b.dataset.t));
 if(b.dataset.t==='miss')renderMiss(); if(b.dataset.t==='rank')renderRank(); window.scrollTo(0,0);
});

// guide
$('#guide').innerHTML=GUIDE.map(g=>`<div class="card"><span class="gtag ${g.g==='仮定法'?'K':''}">${g.g}</span><h2>${g.title}</h2>${g.body}</div>`).join('');

// selectors
function buildSel(el,name){
 let h='';
 [...new Set(UNITS.map(u=>u.g))].forEach(g=>{
  h+=`<div class="gh">${g}<button type="button" data-g="${g}">全部えらぶ</button></div>`;
  UNITS.filter(u=>u.g===g).forEach(u=>{h+=`<label><input type="checkbox" name="${name}" value="${u.id}" data-g="${g}" checked> ${u.name}（${Q.filter(q=>q.u===u.id).length}問）</label>`});
 });
 el.innerHTML=h;
 el.querySelectorAll('.gh button').forEach(b=>b.onclick=()=>{
  const bs=el.querySelectorAll(`input[data-g="${b.dataset.g}"]`); const all=[...bs].every(x=>x.checked);
  bs.forEach(x=>x.checked=!all); b.textContent=all?'全部えらぶ':'全部はずす';
 });
}
buildSel($('#qsel'),'qu'); buildSel($('#psel'),'pu');
const picked=name=>[...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value);
const pickQs=(name,ord)=>{const us=picked(name);let qs=Q.filter(q=>us.includes(q.u));return ord==='shuf'?shuffle(qs):qs};

// quiz
let S=null, sessionMiss=[];
$('#qstart').onclick=()=>{
 const qs=pickQs('qu',document.querySelector('input[name="qord"]:checked').value);
 if(!qs.length){alert('範囲をえらんでください');return}
 S={qs,i:0,ok:0}; sessionMiss=[];
 $('#qsetup').style.display='none'; $('#qplay').style.display='block'; showQ();
};
function record(q,correct){
 if(correct){S.ok++;return}
 if(!sessionMiss.includes(q))sessionMiss.push(q);
 const r=store.get(); r[q.id]=(r[q.id]||0)+1; store.set(r);
}
function head(){return `<div class="qhead"><span>${unitName(S.qs[S.i].u)}</span><span>${S.i+1} / ${S.qs.length}</span></div>`}
function showQ(){
 const q=S.qs[S.i]; const p=$('#qplay');
 if(q.type==='mc'){
  p.innerHTML=`<div class="card">${head()}<div class="qtext">${q.q}</div>${q.ja?`<div class="qja">${q.ja}</div>`:''}
  ${q.ch.map((c,k)=>`<button class="choice" data-k="${k}">${c}</button>`).join('')}<div id="fb"></div></div>`;
  p.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
   if(p.dataset.done==='1')return; p.dataset.done='1';
   const k=+b.dataset.k, ok=k===q.a; record(q,ok);
   p.querySelectorAll('.choice').forEach(x=>{if(+x.dataset.k===q.a)x.classList.add('ok')}); if(!ok)b.classList.add('ng');
   feedback(ok,q.ch[q.a],q.ex);
  });
 }else{
  const order=shuffle(q.t.map((t,k)=>k));
  p.innerHTML=`<div class="card">${head()}<div class="qja" style="font-size:16px;color:#2b2540">${q.ja}</div>
  <div class="ans" id="ans"></div><div class="pool" id="pool">${order.map(k=>`<button class="tile" data-k="${k}">${q.t[k]}</button>`).join('')}</div>
  <div class="minibar" style="margin-top:12px"><button id="tclear">やり直す</button></div>
  <button class="btn sub" id="tcheck">答え合わせ</button><div id="fb"></div></div>`;
  const ans=$('#ans'), pool=$('#pool'); let seq=[];
  const redraw=()=>{ans.innerHTML=seq.map((k,n)=>`<button class="tile" data-n="${n}">${q.t[k]}</button>`).join('');
   pool.querySelectorAll('.tile').forEach(b=>b.classList.toggle('used',seq.includes(+b.dataset.k)));
   ans.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(p.dataset.done==='1')return;seq.splice(+b.dataset.n,1);redraw()});};
  pool.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(p.dataset.done==='1')return;const k=+b.dataset.k;if(!seq.includes(k)){seq.push(k);redraw()}});
  $('#tclear').onclick=()=>{if(p.dataset.done==='1')return;seq=[];redraw()};
  $('#tcheck').onclick=()=>{
   if(p.dataset.done==='1')return; if(seq.length<q.t.length){alert('すべての語を並べてください');return}
   p.dataset.done='1'; const mine=seq.map(k=>q.t[k]).join(' '); const ok=mine===q.t.join(' ');
   record(q,ok); $('#tcheck').style.display='none'; feedback(ok,tileAns(q),q.ex, ok?'':mine+'.');
  };
 }
 p.dataset.done='0'; window.scrollTo(0,0);
}
function feedback(ok,right,ex,mine){
 $('#fb').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><span class="mark">${ok?'⭕ 正解！':'❌ ざんねん'}</span>
 ${mine?`<p>あなたの答え：<span style="font-family:Georgia,serif">${mine}</span></p>`:''}
 <p>正解：<b style="font-family:Georgia,serif">${right}</b></p><p>${ex}</p></div>
 <button class="btn" id="next">${S.i+1<S.qs.length?'次の問題へ':'結果を見る'}</button>
 <button class="btn ghost" id="quit">やめる</button>`;
 $('#next').onclick=()=>{S.i++; S.i<S.qs.length?showQ():result()};
 $('#quit').onclick=result;
}
function result(){
 const n=S.i+(($('#qplay').dataset.done==='1'&&S.i<S.qs.length)?1:0); const tot=Math.min(n,S.qs.length);
 $('#qplay').innerHTML=`<div class="card"><h2>結果</h2><div class="score">${S.ok} / ${tot}</div>
 <p style="text-align:center">${S.ok===tot?'全問正解！すばらしい！':'まちがえた問題を「❗ ミス」で復習しよう'}</p>
 ${sessionMiss.length?`<button class="btn" id="retry">まちがえた問題だけもう一度</button>`:''}
 <button class="btn sub" id="back">範囲えらびにもどる</button></div>`;
 if(sessionMiss.length)$('#retry').onclick=()=>{S={qs:shuffle(sessionMiss),i:0,ok:0};sessionMiss=[];showQ()};
 $('#back').onclick=()=>{$('#qplay').style.display='none';$('#qsetup').style.display='block'};
}
function qLine(q){return q.type==='mc'?`<div class="q">${q.q}</div>${q.ja?`<div class="note">${q.ja}</div>`:''}<div class="a">正解：${q.ch[q.a]}</div>`:`<div>${q.ja}</div><div class="a" style="font-family:Georgia,serif">${tileAns(q)}</div>`}
function renderMiss(){
 $('#misslist').innerHTML=sessionMiss.length?sessionMiss.map(q=>`<div class="mist">${qLine(q)}<div class="note">${q.ex}</div></div>`).join(''):'<p class="note">まだありません。</p>';
}
function renderRank(){
 const r=store.get(); const ids=Object.keys(r).sort((a,b)=>r[b]-r[a]);
 $('#ranklist').innerHTML=ids.length?ids.slice(0,30).map(id=>{const q=Q[id];return `<div class="mist"><span class="n">${r[id]}回</span><div class="note">${unitName(q.u)}</div>${qLine(q)}</div>`}).join(''):'<p class="note">まだ記録がありません。</p>';
}
$('#rankreset').onclick=()=>{if(confirm('苦手の記録をすべて消しますか？')){store.set({});renderRank()}};

// print
const KANA='アイウエ';
$('#pgo').onclick=()=>{
 const qs=pickQs('pu',document.querySelector('input[name="pord"]:checked').value);
 if(!qs.length){alert('範囲をえらんでください');return}
 const shuf=document.querySelector('input[name="pord"]:checked').value==='shuf';
 let h=`<div class="ph"><h1>Unit 5・6 関係代名詞・仮定法 確認プリント</h1><div class="nm">名前（　　　　　　　　）　　　／${qs.length}</div></div>`;
 let last=null, n=0, key=[];
 qs.forEach(q=>{
  if(!shuf&&q.u!==last){h+=`<div class="psec">${unitName(q.u)}</div>`;last=q.u}
  n++;
  if(q.type==='mc'){
   const many=q.ch.some(c=>c.length>18);
   h+=`<div class="pq">(${n}) <span class="en">${q.q.replace(/<\/?b>/g,'')}</span>${q.ja?`\n　<span class="jp">${q.ja}</span>`:''}\n　<span class="chs">${q.ch.map((c,k)=>`${KANA[k]}　${c}`).join(many?'\n　':'　　')}</span>　　答（　　　）</div>`;
   key.push(`(${n}) ${KANA[q.a]}　${q.ch[q.a]}`);
  }else{
   h+=`<div class="pq">(${n}) ${q.ja}\n　<span class="chs">（ ${shuffle(q.t).join(' / ')} ）</span><div class="line"></div></div>`;
   key.push(`(${n}) ${tileAns(q)}`);
  }
 });
 if($('#pans').checked) h+=`<div class="pans"><div class="ph"><h1>解答</h1></div>${key.map(k=>`<div class="pq">${k}</div>`).join('')}</div>`;
 $('#printArea').innerHTML=h; setTimeout(()=>window.print(),200);
};
</script></body></html>
