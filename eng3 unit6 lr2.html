<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中3英語 Unit6・Let's Read②</title>
<style>
:root{--pri:#1d4e89;--pri2:#2f6fb5;--acc:#e07a1f;--bg:#f2f5f9;--ok:#2a9d6f;--ng:#d64545;--mut:#6b7280;--line:#dfe4ec}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:#1f2933;line-height:1.6;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:10px 12px 0}
.htop{display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1;line-height:1.3}
header small{display:block;font-size:11px;opacity:.85;font-weight:normal}
.badge{background:#fff;color:var(--pri);font-weight:bold;font-size:11px;border-radius:10px;padding:2px 7px}
.tabs{display:flex;gap:4px;margin-top:8px}
.tabs button{flex:1;border:0;border-radius:10px 10px 0 0;padding:8px 2px;font-size:13px;background:rgba(255,255,255,.18);color:#fff;font-weight:bold}
.tabs button.on{background:var(--bg);color:var(--pri)}
main{max-width:640px;margin:0 auto;padding:10px 12px 90px}
.screen{display:none}.screen.show{display:block}
.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.urow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;margin:9px 0;box-shadow:0 1px 3px rgba(0,0,0,.08);border:0;width:100%;text-align:left;color:inherit;font:inherit}
.num{flex:0 0 40px;height:40px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px}
.num.ex{background:var(--acc)}.num.all{background:#0f766e}
.uname{flex:1;font-weight:bold;font-size:15px;line-height:1.35}
.uname small{display:block;color:var(--mut);font-weight:normal;font-size:12px;margin-top:2px}
.ucnt{font-weight:bold;color:var(--pri);font-size:14px;white-space:nowrap}
.ucnt .o{color:var(--ng)}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:bold;background:var(--pri);color:#fff}
.btn.sub{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn.acc{background:var(--acc)}.btn.dark{background:#3f4a5a}
.btn.sm{padding:8px 10px;font-size:13px}.btn.wide{width:100%;margin-top:8px}
.btn:disabled{opacity:.4}
h2{font-size:17px;margin:4px 0 8px;color:var(--pri)}h3{font-size:15px;margin:12px 0 6px;color:var(--pri2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:14px;color:#333}
.chip.on{border-color:var(--pri2);background:#e6effa;color:var(--pri);font-weight:bold}
.chip small{display:block;font-size:11px;font-weight:normal;color:var(--mut)}
.resume{background:#fff7e6;border:2px solid #f4a261}
.prog{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin:6px 0}.prog>div{height:100%;background:var(--ok)}
.qmeta{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:6px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;background:#e9eef5;color:var(--pri);margin:0 4px 2px 0}
.ja{font-size:15px;color:#374151;margin-bottom:6px}
.en{font-size:19px;line-height:2.1;font-family:"Helvetica Neue",Arial,"Hiragino Sans",sans-serif}
.bl{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--acc);color:var(--acc);font-weight:bold;text-align:center;padding:0 4px;line-height:1.5;margin:0 2px}
.bl.sel{background:#fff3e6;border-radius:6px 6px 0 0}
.bl.okb{color:var(--ok);border-color:var(--ok)}.bl.ngb{color:var(--ng);border-color:var(--ng)}
.bin{width:6.5em;font-size:18px;padding:4px 6px;border:2px solid var(--acc);border-radius:8px;text-align:center;margin:2px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tile{border:2px solid var(--pri2);background:#fff;color:var(--pri);border-radius:10px;padding:8px 12px;font-size:17px;font-weight:bold;font-family:"Helvetica Neue",Arial,sans-serif}
.tile.used{opacity:.25}
.build{min-height:54px;border:2px dashed #b8c4d6;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.build .tile{border-color:var(--acc);color:#7a3e05}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:17px;text-align:left;color:#1f2933}
.opt.ok{border-color:var(--ok);background:#e6f6ef}.opt.ng{border-color:var(--ng);background:#fdecec}
textarea,input[type=text],input[type=search]{width:100%;font-size:17px;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-family:"Helvetica Neue",Arial,"Hiragino Sans",sans-serif}
.fb{margin-top:10px;padding:10px;border-radius:10px;font-size:15px}
.fb.ok{background:#e6f6ef;color:#17623f}.fb.ng{background:#fdecec;color:#922}
.ans{font-size:19px;font-weight:bold;color:var(--pri);margin:8px 0;font-family:"Helvetica Neue",Arial,"Hiragino Sans",sans-serif}
.wg{color:var(--ok);font-weight:bold}.wr{color:var(--ng);text-decoration:line-through}.wm{color:var(--ng);font-weight:bold;border-bottom:2px solid var(--ng)}
.note{font-size:12px;color:var(--mut)}
.spk{border:0;background:#e6effa;border-radius:8px;padding:4px 8px;font-size:15px;margin-left:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ovl.show{display:flex}.ovl .panel{background:#fff;width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
table.rk{width:100%;border-collapse:collapse;font-size:14px}table.rk td,table.rk th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.sum{width:100%;border-collapse:collapse;font-size:14px}table.sum th,table.sum td{border:1px solid var(--line);padding:6px}table.sum th{background:#eef4fb}
.warn{background:#fff3e6;border-radius:8px;padding:8px;font-size:14px}
.kw label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:15px}.kw input{width:22px;height:22px;flex:0 0 auto}
.pas{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;line-height:1.8;white-space:pre-wrap;font-family:"Helvetica Neue",Arial,sans-serif}
#printArea{display:none}
@media print{body{background:#fff}header,main,.ovl{display:none!important}#printArea{display:block;font-size:11pt;line-height:1.8;color:#000}
#printArea h1{font-size:14pt;margin:0}#printArea h2{font-size:12pt;border-bottom:1px solid #000;margin:10px 0 4px}
.pq{margin:3px 0;page-break-inside:avoid}.pl{border-bottom:1px solid #000;height:1.6em;margin:2px 0 6px 1.5em}.pgbr{page-break-before:always}}
</style>
</head>
<body>
<header>
 <div class="htop"><h1>中3英語 Unit 6・Let's Read ②<small>ワーク p.77・81〜95・100〜101</small></h1><span class="badge">v1.0</span></div>
 <div class="tabs" id="tabs">
  <button data-t="home" class="on">🏠 ホーム</button><button data-t="sum">📘 まとめ</button><button data-t="rank">⭐ 苦手</button><button data-t="search">🔍 検索</button><button data-t="help">❓</button>
 </div>
</header>
<main>
<section id="s-home" class="screen show">
 <div id="resumeBox"></div>
 <div id="unitList"></div>
 <div class="bigbtns"><button class="btn dark" onclick="openPrint()">🖨 プリント</button><button class="btn acc" onclick="openReport()">📋 先生に報告</button></div>
 <button class="btn sub wide" onclick="resetAll()">記録をリセット</button>
</section>
<section id="s-quiz" class="screen">
 <div class="card">
  <div class="qmeta"><span id="qPos"></span><span id="qScore"></span></div>
  <div class="prog"><div id="qBar"></div></div>
  <div class="qmeta"><span id="qTag"></span><button class="btn sm sub" onclick="showMiss()">✗ 今回のミス</button></div>
 </div>
 <div class="card" id="qCard"></div>
 <button class="btn sm sub" onclick="quitQuiz()">■ やめてホームへ</button>
</section>
<section id="s-result" class="screen"><div class="card" id="resultCard"></div></section>
<section id="s-explain" class="screen"><div id="exList"></div></section>
<section id="s-sum" class="screen"><div class="card" id="sumBody"></div></section>
<section id="s-rank" class="screen"><div class="card"><h2>⭐ 苦手ランキング</h2><div class="note">まちがえた回数が多い順。タップでその問題だけ練習。</div><div id="rankBody"></div>
 <button class="btn sm sub" style="margin-top:8px" onclick="practiceWeak()">⭐ 苦手だけぜんぶ練習</button></div></section>
<section id="s-search" class="screen"><div class="card"><h2>🔍 検索</h2><input type="search" id="sq" placeholder="例：wish、were、関係代名詞、depend" oninput="doSearch()"><div id="sRes"></div></div></section>
<section id="s-help" class="screen"><div class="card" id="helpBody"></div></section>
</main>
<div id="printArea"></div>
<div class="ovl" id="ovl" onclick="if(event.target===this)closeOvl()"><div class="panel" id="ovlBody"></div></div>
<script>
// ===== 中3英語ワーク（東京書籍 New Horizon 3 準拠）p.77・81〜95・100〜101 =====
// k: w=単語  b=文法・表現（穴うめ・選ぶ）  s=文を書く（並べかえ・英作文・英語で答える）  r=読解
// F: [答え] が空欄。答え|別解。opts があれば「選ぶ」問題
const UNITS=[];let _u=null,_sec='';
function U(id,name,sub){_u={id,name,sub,items:[]};UNITS.push(_u)}
function SC(s){_sec=s}
function push(o){o.sec=_sec;o.id=_u.id+'_'+(_u.items.length+1);_u.items.push(o)}
function W(en,ja,pos,dir){push({t:'w',k:'w',en,ja,pos:pos||'',dir:dir||'ej'})}  // dir: ej=英→日, je=日→英
function F(ja,s,o){push(Object.assign({t:'f',k:'b',ja,s},o||{}))}
function O(ja,a,o){push(Object.assign({t:'o',k:'s',ja,a},o||{}))}
function J(q,a,o){push(Object.assign({t:'j',k:'r',q,a},o||{}))}

U('rle5','Real Life English ⑤ 記事への意見（投稿文）','ワーク p.77・教科書 p.69');
SC('単語チェック');
W('bother','面倒','名');W('decision','決定','名');W('device','装置','名');W('ban','を禁止する','動');W('cross','渡る','動');
W('electronic','電子の','形');W('common','ふつうの','形');W('way','方法、やり方','名','je');W('text','（携帯電話などで）メッセージをおくる','動','je');W('safe','安全な','形','je');
SC('重要表現');
F('あなたはいつサッカー部に入ることを決めたのですか。','When did you [choose|decide] [to] join the soccer club?');
F('私は昨年からずっとこの研究に取り組んでいます。','I have been [working] [on] this research since last year.');
F('私は、私たちはその計画を変える必要があるとは思いません。','I [do] [not] think we need to change the plan.');
SC('作文練習（淳の投稿文）');
F('淳のメモ：もっと多くの旅行客を外国から招くべき。理由は2つ。','I think we should invite more tourists from other countries. I have two [reasons].');
F('理由①：日本の文化をもっと多くの人に楽しんでほしい。','[First], Japanese culture is really interesting and I want more people to enjoy it.');
F('理由②：外国人と触れ合う機会が増える。','[Second], we will have more chances to communicate with people from foreign countries.');
F('ほかの国への理解の助けになる。','It will [help] us understand other countries.');
SC('自己表現（賛成・反対）');
O('「日本はもっと多くの旅行客を海外から招くべきか」について、「私は…と思います」と英語1文で（賛成の例）','I think we should invite more tourists from other countries.',{free:true});
O('同じテーマで「私は…と思いません」（反対の例）','I don\'t think we should invite more tourists from other countries.',{free:true});
O('反対の理由の例：観光客が多すぎて、地元の人がバスを使えない場所がある。','In some places, local people can\'t use buses because there are too many foreign tourists.',{free:true,note:'例文はClaudeが作成。「because of + 名詞」「because + 主語＋動詞」のちがいに注意'});

U('sa2','Stage Activity ② My Activity Report','ワーク p.81・教科書 p.72〜75');
SC('単語チェック');
W('position','位置','名');W('chance','チャンス、機会','名');W('teammate','チームメイト','名');W('content','中身','名');W('set','置く','動');
W('encourage','勇気づける','動');W('report','報告、レポート','名','je');W('thought','考え、意見','名','je');W('move','…を感動させる','動','je');W('most','いちばん、最も','副','je');
SC('重要表現');
F('今日は、私のいちばん好きなスポーツについてあなたたちにお話しします。','Today, I\'m going to [tell] you [about] my favorite sport.');
F('健はバスケットボール部の一員です。','Ken is a [member] [of] the basketball team.');
F('それはいちばん私を勇気づけてくれた出来事です。','That is the event [that|which] encouraged me the [most].');
SC('作文練習（知恵の活動報告）');
F('音楽部のメンバーで、バンドではギターをひく。','I\'m [a] member of the music [club]. I play the guitar.');
F('バンドは約2年間いっしょに演奏してきている。','We have [been] playing together for about [two] years.');
F('10月の学校祭で演奏する予定。','We are [going] [to] play at the school festival in October.');
F('みんなに最後の演奏を楽しんでほしい。','I hope you will [enjoy] our [last] performance.');
SC('自分の経験を伝える');
O('その野球の試合で勝ってうれしかったです。','I was happy to win the baseball game.');
O('料理部に入ってさまざまな料理の作り方を習いました。','I joined the cooking club and learned how to cook various dishes.');

U('drill','場面別ドリル（経験の発表）','ワーク p.82〜83');
SC('部活動');
F('私はこの学校で音楽部に入りました。','I [joined] the music club at this school.');
F('私は3年間テニスをしてきています。','I [have] been [playing] tennis for three years.');
F('佐藤先生は私たちにじょうずに演奏する方法を教えてくれました。','Mr. Sato taught us [how] [to] play well.');
F('私は毎日、熱心にサッカーの練習をしました。','I [practiced] soccer [hard] every day.');
SC('運動会・スポーツ大会');
F('今年は9月20日に運動会がありました。','We [had] a sports day [on] September 20 this year.');
F('私は速く走ることができます。','I [can] run [fast].');
F('私は友達とサッカーをしました。','I [played] soccer [with] my friends.');
F('その日のことを私は決して忘れません。','I will [never] [forget] that day.');
F('私たちのクラスは2位になりました。','Our class [got] [second] place.');
SC('文化祭・学校祭');
F('文化祭に多くの人がいるのを見て、私はわくわくしました。','I was excited [to] [see] many people at our school festival.');
F('いちばん人気があったのはマンガ喫茶でした。','The comic cafe was [the] [most] popular.');
F('私たちはいっしょに大きな絵をかきました。','We drew a big [picture] together.');
F('私は亮といっしょに働きました。今では私たちはよい友達です。','I [worked] with Ryo. We are [good] friends now.');
F('私たちは楽しい時を過ごしました。','We [had] a good [time].');
SC('修学旅行');
F('私たちは先月、修学旅行で京都に行きました。','We [went] [to] Kyoto on our school trip last month.');
F('私たちは京都で有名な寺を訪れました。','We visited [famous] [temples] in Kyoto.');
F('私は修学旅行をとても楽しみました。','I [enjoyed] our school trip very [much].');
F('私は再び京都を訪れたいです。','I want to visit Kyoto [again].');
SC('日本語パラフレーズ');
F('同級生に早食いを注意されました。（→「ゆっくり食べて」と言った）','My classmates said to me, "[Eat] [slowly]!"');
F('私は朝練のために早起きをしました。（→早く起きた）','I [got] up [early] for the morning practice.');
F('修学旅行で、私たちは京都で舞妓さんを見てはしゃぎました。（→興奮していた）','We were [excited] to see maiko-san in Kyoto on our school trip.');
F('僕はテスト勉強のやり方をいろいろと試行錯誤してきました。（→いろいろな方法を試した）','I have [tried] many ways to study for the test.');
F('運動会では、みんなで全力を尽くそうと言い合いました。（→おたがいに対して言う）','At the sports day, we said to [each] [other], "Let\'s do our best!"');
F('マラソン大会で、トムはヘトヘトになっても僕を追い続けました。（→とても疲れていた）','Tom was so [tired], but he kept running after me at the marathon event.');
F('私たちはテニスの練習をくり返しました。（→「もう一度」を2回）','We practiced tennis [again] and [again].');
SC('+one and でつなぐ表現');
F('私はその本を何度も読み返した。','I read the book [over] and [over].');
F('彼は正解を考えに考えた。','He [thought] and [thought] for the right answer.');
F('男の子は道を横断する前に左右を見た。','The boy looked [right] and [left] before crossing the street.');
F('女の子が通りをウロウロしていた。','The girl was walking [up] and [down] the street.');

U('u6_1','Unit 6-1 I wish I could ～.（…であればよいのに）','ワーク p.84〜85・教科書 p.77〜78');
SC('A① 選ぶ');
F('私が何匹かイヌを飼っていればいいのになあ。','I wish I [had] some dogs.',{opts:['have','had']});
F('私がギターをひけたらいいのになあ。','I wish I [could] play the guitar.',{opts:['can','could']});
F('私がサッカー選手だったらいいのになあ。','I wish I [were] a soccer player.',{opts:['am','were']});
SC('A② 形をかえる');
F('あなたがこの町に住んでいればいいのになあ。（live）','I wish you [lived] in this town.');
F('マイクが今、ここにいればいいのになあ。（is）','I wish Mike [were] here now.');
SC('A③ 穴うめ');
F('私が料理がうまくできればいいのになあ。','I wish [I] [could] cook well.');
F('私たちがいっしょにそのコンサートに行けるといいのになあ。','I [wish] we [could] go to the concert together.');
F('私の部屋にコンピュータがあればいいのになあ。','[I] [wish] there [were] a computer in my room.');
SC('必ず覚えたい語句');
W('backpack','バックパック','名');
F('お金を寄付する','[donate] money');
F('未使用のかばん','[unused] bags');
F('海外で勉強する','study [abroad]');
F('このようにラケットを握りなさい。','Hold your racket [this] [way].');
SC('B① 並べかえ');
O('私がもっと速く走ることができればなあ。（faster / I / run / could / wish / I）','I wish I could run faster.');
O('私がボブのいちばん好きな食べ物を知っていればよいのですが。（Bob\'s / I / I / favorite food / wish / knew）','I wish I knew Bob\'s favorite food.');
O('貧しい人々が全くいなければいいのに。（wish / no / I / were / poor people / there）','I wish there were no poor people.');
O('私に週末のいい計画があればいいのになあ。（wish / I / I / a nice plan / for / the weekend / had）','I wish I had a nice plan for the weekend.');
SC('B② 上と下をくらべて');
O('I can\'t speak Chinese. → 私が中国語を話せたらなあ。','I wish I could speak Chinese.');
O('I don\'t remember the man\'s name. → 私がその男の人の名前を覚えていればなあ。','I wish I remembered the man\'s name.');
SC('B③ 自己表現');
O('学校にあったらいいのにと思う設備：新しいプール','I wish we had a new swimming pool in my school.',{free:true});
O('学校にあったらいいのにと思う設備：テニスコート','I wish we had a tennis court in my school.',{free:true});
O('学校にあったらいいのにと思う設備：もっと広い校庭','I wish we had a larger schoolyard in my school.',{free:true});

U('u6_2','Unit 6-2 If I were ～, I would ….','ワーク p.86〜87・教科書 p.79');

const SUMMARY=`
<h3>① 仮定法ってなに？</h3>
<p><b>現実とはちがうこと</b>（ありえない・ほぼ無理なこと）を言うとき、<b>動詞を1つ過去にずらす</b>。形は過去でも、意味は<b>今</b>のこと。</p>
<h3>② 3つの形</h3>
<table class="sum">
<tr><th>形</th><th>例</th><th>意味</th></tr>
<tr><td>I wish ＋主語＋<b>過去形</b></td><td>I wish I <b>had</b> a dog.<br>I wish I <b>could</b> swim.</td><td>…ならいいのになあ（願望）</td></tr>
<tr><td>If ＋主語＋<b>were</b> …,<br>主語＋<b>would / could</b>＋原形</td><td>If I <b>were</b> you, I <b>would</b> go.</td><td>もし…なら～するだろうに</td></tr>
<tr><td>If ＋主語＋<b>一般動詞の過去形</b> …,<br>主語＋<b>would / could</b>＋原形</td><td>If I <b>had</b> time, I <b>could</b> cook.</td><td>もし…なら～できるのに</td></tr>
</table>
<h3>③ よく出る置きかえ</h3>
<table class="sum">
<tr><th>ふつう</th><th>仮定法</th></tr>
<tr><td>am / is / are</td><td><b>were</b>（I でも he でも were）</td></tr>
<tr><td>can</td><td><b>could</b></td></tr>
<tr><td>will</td><td><b>would</b></td></tr>
<tr><td>have / has</td><td><b>had</b></td></tr>
<tr><td>live / know / remember</td><td><b>lived / knew / remembered</b></td></tr>
<tr><td>don't have</td><td><b>didn't</b> have</td></tr>
</table>
<h3>④ ふつうの if と仮定法のちがい</h3>
<p>If I <b>am</b> free, I <b>will</b> go.（ひまなら行くつもり＝ありえる）<br>If I <b>were</b> free, I <b>would</b> go.（ひまなら行くのに＝実際はひまじゃない）</p>

<script>
const KEY={rank:'e3u6_rank',prog:'e3u6_prog',day:'e3u6_day',ex:'e3u6_ex',set:'e3u6_set'};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ALL=[];const BYID={};UNITS.forEach(u=>u.items.forEach(it=>{it.unit=u.id;if(it.t==='j'&&it.eng){it.t='o';it.k='r'}ALL.push(it);BYID[it.id]=it}));
const unitOf=id=>UNITS.find(u=>u.id===id);
const KINDS={w:'単語',b:'文法・表現',s:'文を書く',r:'読解'};

// ---- 英文の処理 ----
function blanksOf(s){const a=[];s.replace(/\[([^\]]+)\]/g,(m,x)=>{a.push(x.split('|'))});return a}
function fullOf(s){return s.replace(/\[([^\]]+)\]/g,(m,x)=>x.split('|')[0])}
function answerOf(it){if(it.t==='f')return fullOf(it.s);if(it.t==='w')return it.dir==='je'?it.en:it.ja;return it.a}
function norm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"')
 .replace(/\bi'm\b/g,'i am').replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bwon't\b/g,'will not')
 .replace(/\b(\w+)n't\b/g,'$1 not').replace(/\bthat's\b/g,'that is').replace(/\blet's\b/g,'let us')
 .replace(/[.,!?"]/g,' ').replace(/\s+/g,' ').trim()}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[\[\]]/g,''));u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function spkBtn(t){return '<button class="spk" onclick="speak(\''+esc(t).replace(/'/g,"\\'")+'\')">🔊</button>'}
function tokens(sentence){ // 並べかえ用の語
 let t=sentence.replace(/([,!?])/g,' $1 ').replace(/\.$/,'').split(/\s+/).filter(Boolean);
 if(t.length&&!PROPER.includes(t[0])&&!PROPER.includes(t[0].replace(/'s$/,'')))t[0]=t[0][0].toLowerCase()+t[0].slice(1);
 return t;
}
function lcsDiff(user,ans){ // 単語ごとの○✕
 const a=norm(user).split(' ').filter(Boolean),b=norm(ans).split(' ').filter(Boolean);
 const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 let i=0,j=0,out=[];while(i<n&&j<m){if(a[i]===b[j]){out.push('<span class="wg">'+esc(a[i])+'</span>');i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){out.push('<span class="wr">'+esc(a[i])+'</span>');i++}else{out.push('<span class="wm">＋'+esc(b[j])+'</span>');j++}}
 while(i<n)out.push('<span class="wr">'+esc(a[i++])+'</span>');while(j<m)out.push('<span class="wm">＋'+esc(b[j++])+'</span>');
 return out.join(' ');
}
function confFor(word,avoid){const w=word.toLowerCase();const g=CONF.find(g=>g.includes(w));let c=g?g.filter(x=>x!==w&&!avoid.has(x)):[];return c}

// ---- 記録 ----
function rk(){return store.get(KEY.rank,{})}
function isWeak(id){const r=rk()[id];return r&&r.w>r.r}
function unitScore(uid){const r=rk();const L=unitOf(uid).items;return {ok:L.filter(i=>r[i.id]&&r[i.id].last===1).length,n:L.length}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function record(it,ok){const r=rk();r[it.id]=r[it.id]||{w:0,r:0};ok?r[it.id].r++:r[it.id].w++;r[it.id].last=ok?1:0;r[it.id].t=new Date().toISOString().slice(0,16);store.set(KEY.rank,r);
 const d=store.get(KEY.day,{}),t=today();d[t]=d[t]||{n:0,ok:0};d[t].n++;if(ok)d[t].ok++;store.set(KEY.day,d)}

// ---- ホーム ----
function renderHome(){
 let h='';
 UNITS.forEach((u,i)=>{const s=unitScore(u.id);h+=`<button class="urow" onclick="openSetup('${u.id}')"><span class="num">${i+1}</span><span class="uname">${esc(u.name)}<small>${esc(u.sub)}</small></span><span class="ucnt"><span class="o">⭕</span>${s.ok}/${s.n}</span></button>`});
 const ex=store.get(KEY.ex,{});const exd=EXPLAINS.filter(e=>ex[e.id]&&ex[e.id].done).length;
 h+=`<button class="urow" onclick="show('explain')"><span class="num ex">💬</span><span class="uname">自分の言葉で説明<small>声に出して説明 → 録音 → 模範とくらべる</small></span><span class="ucnt"><span class="o">⭕</span>${exd}/${EXPLAINS.length}</span></button>`;
 const tot=ALL.length,ok=UNITS.reduce((a,u)=>a+unitScore(u.id).ok,0);
 h+=`<button class="urow" onclick="openSetup('ALL')"><span class="num all">全</span><span class="uname">ぜんぶの単元から<small>テスト直前の総まとめ・⭐苦手だけもえらべる</small></span><span class="ucnt"><span class="o">⭕</span>${ok}/${tot}</span></button>`;
 document.getElementById('unitList').innerHTML=h;
 const p=store.get(KEY.prog,null);
 document.getElementById('resumeBox').innerHTML=(p&&p.ids&&p.i<p.ids.length)?`<div class="card resume"><b>📌 前回の続きがあります</b>（${p.i+1}問目／${p.ids.length}問）<div class="row" style="margin-top:8px"><button class="btn sm acc" onclick="resume()">▶ 続きから再開</button><button class="btn sm sub" onclick="clearProg();renderHome()">最初からやり直す</button></div></div>`:'';
}
let SET=Object.assign({kind:'all',mode:'tile',order:'seq',weak:false},store.get(KEY.set,{}));let setupUid=null;
function chip(l,on,fn,sub){return `<button class="chip${on?' on':''}" onclick="${fn}">${l}${sub?'<small>'+sub+'</small>':''}</button>`}
function poolFor(uid){return uid==='ALL'?ALL:unitOf(uid).items}
function listFor(){let L=poolFor(setupUid).filter(i=>(SET.kind==='all'||i.k===SET.kind)&&(!SET.weak||isWeak(i.id)));return L}
function openSetup(uid){setupUid=uid;renderSetup()}
function setS(k,v){SET[k]=v;store.set(KEY.set,SET);renderSetup()}
function renderSetup(){
 const P=poolFor(setupUid);const kinds=Object.keys(KINDS).filter(k=>P.some(i=>i.k===k));
 const name=setupUid==='ALL'?'ぜんぶの単元から':unitOf(setupUid).name;
 let h=`<h2>${esc(name)}</h2><h3>種類</h3><div class="chips">${chip('ぜんぶ',SET.kind==='all',"setS('kind','all')",P.length+'問')}${kinds.map(k=>chip(KINDS[k],SET.kind===k,`setS('kind','${k}')`,P.filter(i=>i.k===k).length+'問')).join('')}</div>
 <h3>答え方</h3><div class="chips">${chip('🧩 えらぶ・並べる',SET.mode==='tile',"setS('mode','tile')",'まずはここから')}${chip('⌨ 書く',SET.mode==='type',"setS('mode','type')",'テストと同じ')}${chip('👀 思い出す',SET.mode==='recall',"setS('mode','recall')",'頭の中で言う')}</div>
 <h3>順番</h3><div class="chips">${chip('ワークの順',SET.order==='seq',"setS('order','seq')")}${chip('シャッフル',SET.order==='shuf',"setS('order','shuf')")}</div>
 <div class="chips" style="margin-top:10px">${chip('⭐ 苦手だけ',SET.weak,"setS('weak',"+(!SET.weak)+")",'まちがい＞正解の問題')}</div>`;
 const n=listFor().length;
 h+=`<button class="btn wide acc" ${n?'':'disabled'} onclick="closeOvl();startQuiz()">▶ スタート（${n}問）</button><button class="btn wide sub" onclick="closeOvl()">閉じる</button>`;
 openOvl(h);
}

// ---- 出題 ----
let S=null,cur=null;
function startQuiz(list){let L=list||listFor();if(!L.length)return;if(!list&&SET.order==='shuf')L=shuffle(L);
 S={ids:L.map(i=>i.id),i:0,ok:0,miss:[],mode:SET.mode};saveProg();show('quiz');renderQ()}
function resume(){const p=store.get(KEY.prog,null);if(!p)return;S=p;show('quiz');renderQ()}
function saveProg(){if(S)store.set(KEY.prog,{ids:S.ids,i:S.i,ok:S.ok,miss:S.miss,mode:S.mode})}
function clearProg(){try{localStorage.removeItem(KEY.prog)}catch(e){}}
function quitQuiz(){saveProg();show('home')}
function effMode(it){if(it.t==='j')return 'recall';if(it.t==='w'&&it.dir==='ej'&&S.mode==='type')return 'recall';if(it.t==='f'&&it.opts)return 'tile';return S.mode}
function renderQ(){
 if(S.i>=S.ids.length)return finish();
 const it=BYID[S.ids[S.i]],u=unitOf(it.unit),m=effMode(it);cur={it,m,done:false};
 document.getElementById('qPos').textContent=(S.i+1)+' / '+S.ids.length+' 問';
 document.getElementById('qScore').textContent='正解 '+S.ok;
 document.getElementById('qBar').style.width=(S.i/S.ids.length*100)+'%';
 document.getElementById('qTag').innerHTML='<span class="tag">'+esc(u.name.split(' ').slice(0,3).join(' '))+'</span><span class="tag">'+esc(it.sec)+'</span>';
 let h='';
 if(it.pas) h+=`<details style="margin-bottom:8px"><summary class="note">📄 本文を見る</summary><div class="pas">${esc(PASSAGES[it.pas].replace(/ \/ /g,'\n'))}</div></details>`;
 if(it.t==='w'){
  if(it.dir==='ej'){h+=`<div class="note">意味は？</div><div class="en"><b>${esc(it.en)}</b> ${spkBtn(it.en)} <span class="tag">${it.pos}</span></div>`}
  else{h+=`<div class="note">英語で</div><div class="ja" style="font-size:19px"><b>${esc(it.ja)}</b> <span class="tag">${it.pos}</span></div>`}
  if(m==='tile'){const pool=ALL.filter(x=>x.t==='w'&&x.id!==it.id);const key=it.dir==='ej'?'ja':'en';
   let ds=shuffle(pool.filter(x=>x.unit===it.unit&&x.pos===it.pos)).concat(shuffle(pool));const opts=[it[key]];for(const d of ds){if(opts.length>=4)break;if(!opts.includes(d[key]))opts.push(d[key])}
   cur.opts=shuffle(opts);h+='<div class="opts">'+cur.opts.map((o,k)=>`<button class="opt" onclick="pickW(${k})">${esc(o)}</button>`).join('')+'</div>'}
  else if(m==='type'){h+=`<input type="text" id="tin" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="つづりを書こう"><button class="btn wide" onclick="checkType()">こたえ合わせ</button>`}
  else h+=recallHtml();
 }
 else if(it.t==='f'){
  if(it.ja)h+=`<div class="ja">${esc(it.ja)}</div>`;
  const bl=blanksOf(it.s);cur.bl=bl;cur.fill=Array(bl.length).fill(null);
  if(m==='type'){let k=0;h+='<div class="en">'+esc(it.s).replace(/\[([^\]]+)\]/g,()=>`<input class="bin" id="b${k++}" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">`)+'</div><button class="btn wide" onclick="checkFillType()">こたえ合わせ</button>'}
  else if(m==='tile'){
   let tiles;if(it.opts)tiles=it.opts.slice();else{const ans=bl.map(b=>b[0]);const avoid=new Set(ans.map(a=>a.toLowerCase()));let ds=[];ans.forEach(a=>{const c=confFor(a,avoid);if(c.length){const x=c[Math.floor(Math.random()*c.length)];if(!ds.includes(x))ds.push(x)}});
    if(ds.length<2){const other=shuffle(unitOf(it.unit).items.filter(x=>x.t==='f').flatMap(x=>blanksOf(x.s).map(b=>b[0]))).filter(x=>!avoid.has(x.toLowerCase())&&!ds.includes(x));ds=ds.concat(other.slice(0,2-ds.length))}
    tiles=shuffle(ans.concat(ds.slice(0,Math.max(2,Math.min(3,ans.length+1)))))}
   cur.tiles=tiles;cur.used=Array(tiles.length).fill(false);
   h+='<div class="en" id="fillLine"></div><div class="tiles" id="tileBox"></div><div class="row" style="margin-top:10px"><button class="btn" id="chk" onclick="checkFillTile()" disabled>こたえ合わせ</button><button class="btn sub sm" onclick="clearTiles()">↺ やり直す</button></div>';
  } else {h+='<div class="en">'+esc(it.s).replace(/\[([^\]]+)\]/g,'<span class="bl">　？　</span>')+'</div>'+recallHtml()}
 }
 else if(it.t==='o'){
  h+=`<div class="ja">${esc(it.ja||it.q)}</div>`;if(it.free)h+='<div class="note">✏ 自由英作文：下は例文です。自分の文でもOK（「○にする」で自分で正解にできる）</div>';
  if(it.q&&/^[A-Z]/.test(it.q))h=h.replace('<div class="ja">','<div class="en" style="font-size:17px;line-height:1.6">')+spkBtn(it.q);
  if(m==='tile'){const tk=tokens(it.a);const avoid=new Set(tk.map(x=>x.toLowerCase()));let ds=[];for(const t of shuffle(tk)){const c=confFor(t,avoid);if(c.length){ds.push(c[0]);break}}
   cur.tiles=shuffle(tk.concat(ds));cur.used=Array(cur.tiles.length).fill(false);cur.seq=[];
   h+='<div class="build" id="build"></div><div class="tiles" id="tileBox"></div><div class="row" style="margin-top:10px"><button class="btn" id="chk" onclick="checkOrder()">こたえ合わせ</button><button class="btn sub sm" onclick="clearTiles()">↺ やり直す</button></div>'}
  else if(m==='type'){h+=`<textarea id="tin" rows="3" autocapitalize="sentences" autocorrect="off" spellcheck="false" placeholder="英文を書こう"></textarea><button class="btn wide" onclick="checkType()">こたえ合わせ</button>`}
  else h+=recallHtml();
 }
 else if(it.t==='j'){h+=`<div class="ja" style="font-size:17px">${esc(it.q)}</div><div class="note">頭の中で（または紙に）答えてから見よう</div>`+recallHtml()}
 h+='<div id="fbArea"></div>';
 document.getElementById('qCard').innerHTML=h;
 if(cur.tiles)drawTiles();
 window.scrollTo(0,0);
}
function recallHtml(){return '<button class="btn wide sub" id="revBtn" onclick="reveal()">👀 答えを見る</button><div id="revArea"></div>'}
function reveal(){const it=cur.it;document.getElementById('revBtn').style.display='none';const a=answerOf(it);
 document.getElementById('revArea').innerHTML=`<div class="ans">${esc(a)} ${/[a-z]/i.test(a)&&it.t!=='j'||it.eng?spkBtn(a):''}</div><div class="row"><button class="btn" style="flex:1" onclick="selfJ(true)">⭕ 言えた</button><button class="btn sub" style="flex:1" onclick="selfJ(false)">❌ 言えなかった</button></div>`}
function selfJ(ok){if(cur.done)return;document.getElementById('revArea').querySelector('.row').remove();judge(ok,'')}
function pickW(k){if(cur.done)return;const it=cur.it,key=it.dir==='ej'?'ja':'en';const ok=cur.opts[k]===it[key];
 document.querySelectorAll('#qCard .opt').forEach((b,j)=>{if(cur.opts[j]===it[key])b.classList.add('ok');else if(j===k)b.classList.add('ng')});judge(ok,'')}
// タイル（穴うめ）
function drawTiles(){
 const it=cur.it;
 if(it.t==='f'){let k=0;const sel=cur.fill.indexOf(null);document.getElementById('fillLine').innerHTML=esc(it.s).replace(/\[([^\]]+)\]/g,()=>{const i=k++;const v=cur.fill[i];return `<span class="bl${i===sel?' sel':''}" onclick="unfill(${i})">${v===null?'　'+(cur.bl.length>1?i+1:'？')+'　':esc(cur.tiles[v])}</span>`});
  document.getElementById('chk').disabled=cur.fill.includes(null)}
 else{document.getElementById('build').innerHTML=cur.seq.map((v,i)=>`<button class="tile" onclick="unseq(${i})">${esc(cur.tiles[v])}</button>`).join('')||'<span class="note">下の語をタップして並べよう</span>'}
 document.getElementById('tileBox').innerHTML=cur.tiles.map((t,i)=>`<button class="tile${cur.used[i]?' used':''}" onclick="useTile(${i})" ${cur.used[i]?'disabled':''}>${esc(t)}</button>`).join('');
}
function useTile(i){if(cur.done||cur.used[i])return;const it=cur.it;
 if(it.t==='f'){const p=cur.fill.indexOf(null);if(p<0)return;cur.fill[p]=i}else cur.seq.push(i);cur.used[i]=true;drawTiles()}
function unfill(p){if(cur.done||cur.fill[p]===null)return;cur.used[cur.fill[p]]=false;cur.fill[p]=null;drawTiles()}
function unseq(p){if(cur.done)return;cur.used[cur.seq[p]]=false;cur.seq.splice(p,1);drawTiles()}
function clearTiles(){if(cur.done)return;cur.used=cur.used.map(()=>false);if(cur.fill)cur.fill=cur.fill.map(()=>null);if(cur.seq)cur.seq=[];drawTiles()}
function checkFillTile(){if(cur.done)return;const vals=cur.fill.map(v=>cur.tiles[v]);checkBlanks(vals)}
function checkFillType(){if(cur.done)return;const vals=cur.bl.map((b,i)=>document.getElementById('b'+i).value);checkBlanks(vals,true)}
function checkBlanks(vals,typed){
 const res=cur.bl.map((alts,i)=>alts.some(a=>norm(a)===norm(vals[i]||'')));const ok=res.every(Boolean);
 if(typed)cur.bl.forEach((b,i)=>{const e=document.getElementById('b'+i);e.style.borderColor=res[i]?'#2a9d6f':'#d64545';e.disabled=true});
 else document.querySelectorAll('#fillLine .bl').forEach((e,i)=>e.classList.add(res[i]?'okb':'ngb'));
 judge(ok,typed?vals.join(' / '):'',!ok&&typed);
}
function checkOrder(){if(cur.done)return;const u=cur.seq.map(v=>cur.tiles[v]).join(' ');compareSentence(u,false)}
function checkType(){if(cur.done)return;const v=document.getElementById('tin').value;if(!v.trim()){alert('書いてからこたえ合わせしよう');return}
 if(cur.it.t==='w'){const ok=norm(v)===norm(cur.it.en);let d='';if(!ok)d=letterDiff(v.trim(),cur.it.en);judge(ok,v,!ok,d)}else compareSentence(v,true)}
function compareSentence(u,typed){const it=cur.it;const alts=[it.a].concat(it.alt||[]);const ok=alts.some(a=>norm(a)===norm(u));
 judge(ok,u,!ok&&(typed||it.free),ok?'':'<div style="margin-top:6px">あなたの文：'+lcsDiff(u,it.a)+'</div><div class="note">緑＝合っている　赤の線＝いらない・ちがう　＋＝足りない</div>')}
function letterDiff(u,a){let h='';for(let i=0;i<Math.max(u.length,a.length);i++){const x=u[i]||'',y=a[i]||'';h+=x.toLowerCase()===y.toLowerCase()?'<span class="wg">'+esc(x)+'</span>':x?'<span class="wr">'+esc(x)+'</span>':'<span class="wm">'+esc(y)+'</span>'}return '<div style="margin-top:6px;font-size:20px;letter-spacing:2px">'+h+'</div><div class="note">赤＝ちがう文字　下線＝足りない文字</div>'}
function judge(ok,userText,canSelfOk,extra){
 cur.done=true;const it=cur.it;record(it,ok);if(ok)S.ok++;else S.miss.push(it.id);
 const a=answerOf(it);const en=/[a-z]/i.test(a)&&(it.t!=='j'||it.eng);
 let h=`<div class="fb ${ok?'ok':'ng'}">${ok?'⭕ 正解！':'❌ ざんねん'}${extra||''}<div class="ans">${esc(a)} ${en?spkBtn(a):''}</div>`;
 if(it.t==='f'&&it.bl!==undefined);if(it.alt&&it.alt.length)h+='<div class="note">これも正解：'+it.alt.map(esc).join(' ／ ')+'</div>';
 if(it.t==='f'){const al=blanksOf(it.s).filter(b=>b.length>1);if(al.length)h+='<div class="note">これも正解：'+al.map(b=>b.slice(1).join('・')).join('、')+'</div>'}
 if(it.note)h+='<div class="note">'+esc(it.note)+'</div>';
 h+='</div>';
 if(canSelfOk)h+='<button class="btn sm sub" id="selfOk" style="margin-top:6px" onclick="markOk()">○にする（別の言い方で合っている）</button>';
 h+='<button class="btn wide" onclick="nextQ()">次へ ▶</button>';
 document.getElementById('fbArea').innerHTML=h;
 if(en&&ok)speak(a);
 S.i++;saveProg();S.i--;
}
function markOk(){const it=cur.it;const r=rk();if(r[it.id]){r[it.id].w=Math.max(0,r[it.id].w-1);r[it.id].r++;r[it.id].last=1;store.set(KEY.rank,r)}
 const d=store.get(KEY.day,{}),t=today();if(d[t]){d[t].ok++;store.set(KEY.day,d)}
 S.ok++;S.miss=S.miss.filter(x=>x!==it.id);document.getElementById('selfOk').outerHTML='<div class="note">○にしました（先生に確認してもらうと安心）</div>'}
function nextQ(){S.i++;saveProg();renderQ()}
function finish(){clearProg();const n=S.ids.length;let h=`<h2>おつかれさま！</h2><div class="ans" style="text-align:center">${S.ok} / ${n} 問正解（${Math.round(S.ok/n*100)}%）</div>`;
 if(S.miss.length)h+='<h3>まちがえた問題</h3>'+missHtml(S.miss)+'<button class="btn wide acc" onclick="startQuiz(S.miss.map(id=>BYID[id]))">❌ まちがえた問題だけもう一度</button>';
 else h+='<p>全問正解！🎉 次は「⌨ 書く」でもためしてみよう。</p>';
 h+='<button class="btn wide sub" onclick="show(\'home\')">🏠 ホームへ</button>';document.getElementById('resultCard').innerHTML=h;show('result')}
function qText(it){return it.t==='f'?((it.ja?it.ja+' ':'')+it.s.replace(/\[[^\]]+\]/g,'（　）')):it.t==='w'?(it.dir==='ej'?it.en:it.ja):(it.ja||it.q)}
function missHtml(ids){return '<table class="rk">'+[...new Set(ids)].map(id=>{const it=BYID[id];return `<tr><td style="font-size:13px">${esc(qText(it)).slice(0,90)}<br><b>${esc(answerOf(it))}</b></td></tr>`}).join('')+'</table>'}
function showMiss(){openOvl('<h2>✗ 今回のミス</h2>'+(S&&S.miss.length?missHtml(S.miss):'<p>まだありません 👍</p>')+'<button class="btn wide" onclick="closeOvl()">閉じる</button>')}

function kwSave(id,k,v){const st=store.get(KEY.ex,{});st[id]=st[id]||{};st[id][k]=v;store.set(KEY.ex,st)}
async function toggleRec(id){const b=document.getElementById('rb_'+id),s=document.getElementById('rs_'+id);if(rec&&rec.state==='recording'){rec.stop();return}

  rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'audio/mp4'}));document.getElementById('ra_'+id).innerHTML='<audio controls src="'+url+'" style="width:100%;margin-top:6px"></audio>';b.textContent='🎙 もう一度録音';s.textContent='聞き返してチェックしよう'};
  rec.start();b.textContent='⏹ 止める';s.textContent='録音中…'}catch(e){s.textContent='録音できませんでした（Safariで開くと録音できます）。声に出すだけでもOK！'}}

 document.getElementById('rankBody').innerHTML=L.length?'<table class="rk">'+L.slice(0,60).map((id,i)=>{const it=BYID[id];return `<tr onclick="startQuiz([BYID['${id}']])"><td>${i+1}</td><td style="font-size:13px">${esc(qText(it)).slice(0,70)}<br><b>${esc(answerOf(it))}</b> <span class="tag">${esc(unitOf(it.unit).name.split(' ').slice(0,3).join(' '))}</span></td><td>✗${r[id].w}<br>○${r[id].r}</td></tr>`}).join('')+'</table>':'<p>まだ記録がありません。</p>'}
function practiceWeak(){const L=ALL.filter(i=>isWeak(i.id));if(!L.length){alert('苦手な問題はありません 🎉');return}SET.mode=SET.mode||'tile';startQuiz(shuffle(L))}

 <label class="row" style="margin-top:8px"><input type="checkbox" id="pSh" style="width:20px;height:20px"> シャッフル</label><label class="row"><input type="checkbox" id="pWk" style="width:20px;height:20px"> ⭐ 苦手だけ</label>
 <button class="btn wide" onclick="makePrint()">🖨 印刷する（解答ページつき）</button><button class="btn wide sub" onclick="closeOvl()">閉じる</button>`)}
function makePrint(){const sh=document.getElementById('pSh').checked,wk=document.getElementById('pWk').checked;let q='<h1>中3英語 Unit 6・Let\'s Read ② テスト対策プリント</h1><div>名前（　　　　　　　　）　日付（　　／　　）</div>',a='<div class="pgbr"></div><h1>解答</h1>',n=0;
 UNITS.filter(u=>pSel.has(u.id)).forEach(u=>{let L=u.items.filter(i=>(pKind==='all'||i.k===pKind)&&(!wk||isWeak(i.id)));if(sh)L=shuffle(L);if(!L.length)return;q+='<h2>'+esc(u.name)+'</h2>';a+='<h2>'+esc(u.name)+'</h2>';
  L.forEach(it=>{n++;let t;if(it.t==='w')t=(it.dir==='ej'?esc(it.en)+'（'+it.pos+'）→ ＿＿＿＿＿':esc(it.ja)+'（'+it.pos+'）→ ＿＿＿＿＿');
   else if(it.t==='f'){t=(it.ja?esc(it.ja)+'<br>':'')+esc(it.s).replace(/\[[^\]]+\]/g,'＿＿＿＿');if(it.opts)t+='　（'+it.opts.join(' / ')+'）'}
   else t=esc(it.ja||it.q)+'<div class="pl"></div>';
   q+='<div class="pq">'+n+'. '+t+'</div>';a+='<div>'+n+'. '+esc(answerOf(it))+'</div>'})});
 if(!n){alert('問題がありません');return}document.getElementById('printArea').innerHTML=q+a;closeOvl();setTimeout(()=>window.print(),150)}

// ---- 報告 ----
function repText(fam){const d=store.get(KEY.day,{}),r=rk();const t=d[today()]||{n:0,ok:0};
 let s=(fam?'【古賀先生に転送してください】\n':'')+'【中3英語 Unit6・Let\'s Read② 学習報告】'+today()+'\n■今日：'+t.n+'問（⭕'+t.ok+'／❌'+(t.n-t.ok)+(t.n?'、正答率'+Math.round(t.ok/t.n*100)+'%':'')+'）\n■単元ごと（⭕／全部）\n';
 UNITS.forEach((u,i)=>{const x=unitScore(u.id);s+='　'+(i+1)+' '+u.name.split('（')[0]+'：'+x.ok+'/'+x.n+'\n'});
 const ex=store.get(KEY.ex,{});s+='　💬 説明：'+EXPLAINS.filter(e=>ex[e.id]&&ex[e.id].done).length+'/'+EXPLAINS.length+'\n';
 const w=Object.keys(r).filter(id=>BYID[id]&&r[id].last===0).sort((a,b)=>r[b].w-r[a].w).slice(0,5);
 s+='■まだ❌の苦手（上位5）\n'+(w.length?w.map(id=>{const it=BYID[id];return '　・'+unitOf(it.unit).name.split(' ').slice(0,3).join(' ')+' '+it.sec+'「'+qText(it).slice(0,24)+'…」→'+answerOf(it)+'（×'+r[id].w+'）'}).join('\n'):'　なし');return s}
function openReport(){openOvl(`<h2>📋 先生に報告</h2><textarea id="repT" rows="14" readonly style="font-size:13px">${esc(repText(false))}</textarea>
 <div class="row" style="margin-top:8px"><button class="btn sm" onclick="sendLine(false)">LINEで先生へ</button><button class="btn sm acc" onclick="sendLine(true)">👪 おうちの人に送る</button><button class="btn sm sub" onclick="showQR()">📱 QR</button><button class="btn sm sub" onclick="copyRep()">コピー</button></div><div id="qrBox" style="text-align:center;margin-top:8px"></div><button class="btn wide sub" onclick="closeOvl()">閉じる</button>`)}
function sendLine(f){location.href='https://line.me/R/share?text='+encodeURIComponent(repText(f))}
function copyRep(){try{navigator.clipboard.writeText(repText(false)).then(()=>alert('コピーしました'),()=>alert('長押しでコピーしてください'))}catch(e){alert('長押しでコピーしてください')}}
function showQR(){try{qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];const q=qrcode(0,'L');q.addData(repText(false));q.make();document.getElementById('qrBox').innerHTML=q.createSvgTag(3,6)+'<div class="note">塾で先生のスマホに読み取ってもらおう</div>'}catch(e){document.getElementById('qrBox').textContent='QRコードを作れませんでした'}}
function resetAll(){if(confirm('このアプリの記録（⭕・苦手・途中・説明）を全部消しますか？')){[KEY.rank,KEY.prog,KEY.day,KEY.ex].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});renderHome()}}

// ---- 使い方 ----
const HELP=`<h2>❓ 使い方</h2>
<h3>このアプリは？</h3><p>中3英語ワーク（p.77・81〜95・100〜101）のテスト対策アプリです。仮定法（I wish／If I were）、関係代名詞、Stage Activity、Let's Read ② が入っています。</p>
<h3>🏠 ホーム</h3><p>単元をタップ → 種類・答え方・順番をえらんで「スタート」。右の ⭕ は、最後に正解した問題の数です。</p>
<h3>答え方は3つ</h3><p><b>🧩 えらぶ・並べる</b>：語のタイルをタップして空欄をうめる／文を並べる。まずはここから。<br><b>⌨ 書く</b>：キーボードで書く。テストと同じ形。まちがえた所が赤で出ます。<br><b>👀 思い出す</b>：頭の中で言ってから答えを見て、自分で⭕❌。</p>
<p>自由英作文は「例文」です。自分の文が正しいと思ったら「○にする」を押せます（先生に確認してもらうと安心）。</p>
<h3>🔊 読み上げ</h3><p>🔊で英文を読み上げます。正解すると自動で読みます。音が出ないときは、LINEなら「…」→「Safariで開く」。</p>
<h3>📘 まとめ・💬 説明</h3><p>まとめ：仮定法と関係代名詞のルールを1ページに。<br>説明：声に出して説明 → 録音 → 模範とくらべる。</p>
<h3>記録</h3><p>「✗ 今回のミス」はその回のまちがい、⭐苦手はこれまでの合計です。途中でやめても「▶ 続きから再開」できます。記録はこのスマホの中だけ。LINEの中とSafariでは別々になります。</p>
<h3>おすすめの使い方</h3><p>① 📘まとめを読む → ② 各単元を「🧩えらぶ」で1周 → ③「⌨書く」で1周 → ④ ぜんぶの単元から ⭐苦手だけ → ⑤ 💬説明</p>
<h3>うまく動かないとき</h3><p>古い版が出るときはURLの最後に ?v=2 を付けて開く。</p>`;

function openOvl(h){document.getElementById('ovlBody').innerHTML=h;document.getElementById('ovl').classList.add('show')}
function closeOvl(){document.getElementById('ovl').classList.remove('show')}
function show(t){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));document.getElementById('s-'+t).classList.add('show');
 const tab={quiz:'home',result:'home',explain:'home'}[t]||t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 if(t==='home')renderHome();if(t==='explain')renderExplain();if(t==='rank')renderRank();if(t==='search')doSearch();
 if(t==='sum')document.getElementById('sumBody').innerHTML='<h2>📘 まとめ</h2>'+SUMMARY;if(t==='help')document.getElementById('helpBody').innerHTML=HELP;window.scrollTo(0,0)}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{if(S&&document.getElementById('s-quiz').classList.contains('show'))saveProg();show(b.dataset.t)});
renderHome();
</script>
